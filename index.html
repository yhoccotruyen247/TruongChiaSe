<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>TRẠM ĐĂNG BÀI • PHÚC HỌC ĐIỀU HAY</title>
  <link rel="icon" type="image/png" href="Avatar.png">
  <link rel="apple-touch-icon" href="Avatar.png">
  <meta name="theme-color" content="#090d16">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --card-inner: #0d1322;
      --border: #1f293d;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #f59e0b;
      --emerald: #10b981;
      --cyan: #06b6d4;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Plus Jakarta Sans", sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 10px; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 520px; background: var(--card-bg); border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); overflow: hidden; display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.06); }

    /* HEADER */
    header { background: linear-gradient(180deg, rgba(245, 158, 11, 0.16) 0%, rgba(17, 24, 39, 0) 100%); padding: 14px 16px 10px 16px; text-align: center; border-bottom: 1px solid var(--border); }
    .brand-wrap { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 6px; }
    .brand-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }
    .header-title { font-size: 19px; font-weight: 900; background: linear-gradient(135deg, #fbbf24, #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.2px; }
    .header-subtitle { font-size: 11px; color: var(--text-muted); font-weight: 600; }

    /* 2 TAB SWITCHER */
    .tab-switcher { display: grid; grid-template-columns: 1fr 1fr; background: #090d16; margin: 10px 14px 4px 14px; border-radius: 14px; padding: 4px; border: 1px solid var(--border); gap: 6px; }
    .tab-btn { border: none; background: transparent; color: var(--text-muted); font-size: 13px; font-weight: 800; padding: 11px 8px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s; }
    .tab-btn.active { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.35); }
    .tab-btn.tab-img.active { background: linear-gradient(135deg, #06b6d4, #0891b2); color: #fff; box-shadow: 0 4px 12px rgba(6, 182, 212, 0.35); }

    /* STATS & PROGRESS */
    .stats-bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 16px 2px 16px; font-size: 12px; color: var(--text-muted); font-weight: 700; }
    .progress-bar-bg { width: 100%; height: 5px; background: rgba(255,255,255,0.06); border-radius: 6px; overflow: hidden; margin-top: 4px; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #f59e0b, #10b981); width: 0%; transition: width 0.3s; }

    /* ACTIVE CARD */
    .current-card { margin: 10px 14px 12px 14px; background: var(--card-inner); border: 1px solid var(--border); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    
    /* CARD HEADER */
    .card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .stt-group { display: flex; align-items: center; gap: 8px; }
    .badge-stt { font-size: 12px; font-weight: 900; background: rgba(245, 158, 11, 0.2); color: #fbbf24; padding: 3px 9px; border-radius: 8px; border: 1px solid rgba(245, 158, 11, 0.35); font-family: 'JetBrains Mono', monospace; }
    .badge-category { font-size: 11px; font-weight: 700; color: var(--text-muted); max-width: 170px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .nav-buttons { display: flex; align-items: center; gap: 6px; }
    .btn-nav { background: #162035; border: 1px solid var(--border); color: #cbd5e1; font-size: 11.5px; font-weight: 800; padding: 4px 10px; border-radius: 8px; cursor: pointer; transition: all 0.15s; }
    .btn-nav:hover { background: #223150; color: #fff; }
    .btn-nav:active { transform: scale(0.95); }

    .current-title { font-size: 15.5px; font-weight: 800; color: #fff; line-height: 1.45; }

    /* 5-ROW ACTION BUTTONS GRID */
    .actions-grid { display: flex; flex-direction: column; gap: 8px; width: 100%; }
    .btn-row-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    
    .btn-act { height: 42px; border: none; border-radius: 12px; padding: 0 10px; font-size: 12.5px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.15s; user-select: none; }
    .btn-act:active { transform: scale(0.97); }

    /* ROW 1: XEM DRIVE & TẢI DRIVE */
    .btn-view-drive { background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.35); color: #38bdf8; }
    .btn-view-drive:hover { background: rgba(56, 189, 248, 0.25); }
    .btn-download-drive { background: rgba(16, 185, 129, 0.18); border: 1px solid rgba(16, 185, 129, 0.4); color: #34d399; }
    .btn-download-drive:hover { background: rgba(16, 185, 129, 0.28); }

    /* ROW 2: CAPTION FB & BÌNH LUẬN */
    .btn-copy-fb { background: rgba(24, 119, 242, 0.18); border: 1px solid rgba(24, 119, 242, 0.45); color: #60a5fa; }
    .btn-copy-fb:hover { background: rgba(24, 119, 242, 0.28); }
    .btn-copy-pinned { background: rgba(168, 85, 247, 0.18); border: 1px solid rgba(168, 85, 247, 0.4); color: #c084fc; }
    .btn-copy-pinned:hover { background: rgba(168, 85, 247, 0.28); }

    /* ROW 3: CAPTION TIKTOK & CAPTION ZALO */
    .btn-copy-tiktok { background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.35); color: #fb7185; }
    .btn-copy-tiktok:hover { background: rgba(244, 63, 94, 0.25); }
    .btn-copy-zalo { background: rgba(14, 165, 233, 0.15); border: 1px solid rgba(14, 165, 233, 0.35); color: #38bdf8; }
    .btn-copy-zalo:hover { background: rgba(14, 165, 233, 0.25); }

    /* ROW 4: YOUTUBE TIÊU ĐỀ & MÔ TẢ (HOẶC INSTA & PROMPT AI Ở TAB ẢNH) */
    .btn-copy-yt-title { background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.35); color: #fbbf24; }
    .btn-copy-yt-title:hover { background: rgba(245, 158, 11, 0.25); }
    .btn-copy-yt-desc { background: rgba(203, 213, 225, 0.1); border: 1px solid var(--border); color: #cbd5e1; }
    .btn-copy-yt-desc:hover { background: rgba(203, 213, 225, 0.18); }

    /* ROW 5: NÚT ĐÁNH DẤU ĐÃ ĐĂNG - FULL WIDTH, NỔI BẬT */
    .btn-mark-posted { width: 100%; height: 46px; border-radius: 13px; font-size: 13.5px; font-weight: 900; letter-spacing: 0.3px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; border: none; }
    .btn-mark-posted.state-pending { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35); }
    .btn-mark-posted.state-pending:hover { background: linear-gradient(135deg, #dc2626, #b91c1c); }
    .btn-mark-posted.state-done { background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.45); color: #34d399; }
    .btn-mark-posted.state-done:hover { background: rgba(16, 185, 129, 0.3); }

    /* PREVIEW FRAME (DƯỚI 5 HÀNG NÚT, KÍCH THƯỚC BẰNG NHAU CHO CẢ VIDEO & ẢNH) */
    .preview-section { width: 100%; display: flex; flex-direction: column; gap: 6px; }
    .preview-header-label { display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; color: var(--text-muted); font-weight: 700; padding: 0 2px; }
    .preview-box { width: 100%; height: 260px; background: #050811; border-radius: 14px; border: 1px solid var(--border); overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; }
    .preview-box iframe { width: 100%; height: 100%; border: none; border-radius: 14px; }
    .preview-box img { width: 100%; height: 100%; object-fit: contain; cursor: zoom-in; }
    .preview-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--text-muted); padding: 16px; text-align: center; }
    .preview-placeholder .icon { font-size: 38px; }
    .preview-placeholder .hint { font-size: 11.5px; color: #64748b; }

    /* LIST & SEARCH SECTION (DƯỚI CÙNG) */
    .list-section { padding: 12px 14px 16px 14px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; background: rgba(11, 17, 32, 0.5); }
    .search-input { width: 100%; background: #090d16; border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; font-size: 13px; color: #fff; outline: none; transition: border-color 0.2s; }
    .search-input:focus { border-color: var(--primary); }

    .filter-chips { display: flex; gap: 6px; overflow-x: auto; }
    .filter-chip { background: #090d16; border: 1px solid var(--border); color: var(--text-muted); font-size: 11.5px; font-weight: 800; padding: 6px 12px; border-radius: 18px; cursor: pointer; white-space: nowrap; transition: all 0.15s; }
    .filter-chip.active { background: var(--primary); color: #000; border-color: var(--primary); }
    .filter-chip.chip-pending.active { background: #ef4444; color: #fff; border-color: #ef4444; }
    .filter-chip.chip-done.active { background: #10b981; color: #000; border-color: #10b981; }

    .table-container { max-height: 240px; overflow-y: auto; border: 1px solid var(--border); border-radius: 12px; background: #090d16; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { background: #131d31; padding: 8px 10px; text-align: left; color: var(--text-muted); font-size: 11px; font-weight: 800; position: sticky; top: 0; border-bottom: 1px solid var(--border); }
    td { padding: 9px 10px; border-bottom: 1px solid rgba(255,255,255,0.04); cursor: pointer; vertical-align: middle; }
    tr:hover { background: rgba(255,255,255,0.04); }
    tr.active { background: rgba(245, 158, 11, 0.15); font-weight: 700; }
    .badge-status { font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 6px; }
    .badge-status.pending { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .badge-status.done { background: rgba(16, 185, 129, 0.2); color: #34d399; }

    /* TOAST */
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #10b981; color: #000; font-weight: 900; font-size: 13px; padding: 10px 22px; border-radius: 20px; z-index: 999; display: none; box-shadow: 0 6px 20px rgba(0,0,0,0.6); }

    /* LIGHTBOX */
    .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 14px; }
    .lightbox img { max-width: 100%; max-height: 92vh; border-radius: 12px; object-fit: contain; }
      .btn-copy-aff { background: rgba(234, 179, 8, 0.16); border: 1px solid rgba(234, 179, 8, 0.42); color: #fde047; }
    .btn-copy-aff:hover { background: rgba(234, 179, 8, 0.27); }
    .btn-link-aff { background: rgba(16, 185, 129, 0.16); border: 1px solid rgba(16, 185, 129, 0.42); color: #34d399; }
    .btn-link-aff:hover { background: rgba(16, 185, 129, 0.27); }
    .btn-mark-posted { width: 100%; height: 46px; border-radius: 13px; font-size: 13.5px; }
</style>
</head>
<body>
  <div class="app-container">
    <header>
      <div class="brand-wrap">
        <img src="Avatar.png" class="brand-avatar" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><circle cx=\'50\' cy=\'50\' r=\'50\' fill=\'%23f59e0b\'/><text x=\'50\' y=\'60\' font-size=\'40\' text-anchor=\'middle\' fill=\'white\'>PH</text></svg>'">
        <div>
          <h1 class="header-title">PHÚC HỌC ĐIỀU HAY</h1>
          <div class="header-subtitle">Trạm Đăng Bài Mobile • Cả Video & Ảnh Dạy Con</div>
        </div>
      </div>
    </header>

    <!-- SWITCH 2 TAB CHÍNH -->
    <div class="tab-switcher">
      <button class="tab-btn active" id="tabVideoBtn" onclick="switchTab('video')">🎬 ĐĂNG VIDEO (<span id="vCount">0</span>)</button>
      <button class="tab-btn tab-img" id="tabImageBtn" onclick="switchTab('image')">📸 ĐĂNG ẢNH (<span id="iCount">0</span>)</button>
    </div>

    <!-- STATS & PROGRESS BAR -->
    <div class="stats-bar">
      <span id="statText">Đang tải...</span>
      <span id="statPercent">0%</span>
    </div>
    <div style="padding: 0 14px;"><div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar"></div></div></div>

    <!-- ACTIVE CARD -->
    <div class="current-card">
      <div class="card-top">
        <div class="stt-group">
          <span class="badge-stt" id="currStt">#---</span>
          <span class="badge-category" id="currCategory">Phúc Học Điều Hay</span>
        </div>
        <div class="nav-buttons">
          <button class="btn-nav" onclick="prevItem()" title="Bài trước">⬅️ Trước</button>
          <button class="btn-nav" onclick="nextItem()" title="Bài tiếp theo">Sau ➡️</button>
        </div>
      </div>

      <div class="current-title" id="currTitle">Đang nạp bài viết...</div>

      <!-- 5 HÀNG NÚT BẤM CÂN XỨNG -->
      <div class="actions-grid">
        <!-- HÀNG 1: XEM DRIVE (TRÊN KHUNG XEM) & TẢI VỀ MÁY -->
        <div class="btn-row-2col">
          <button class="btn-act btn-view-drive" id="btnViewDrive" onclick="triggerViewInFrame()">
            <span>👁️ Xem Drive</span>
          </button>
          <button class="btn-act btn-download-drive" id="btnDownloadDrive" onclick="triggerDownloadDrive()">
            <span id="lblDownloadDrive">📥 Tải Drive</span>
          </button>
        </div>

        <!-- HÀNG 2: CAPTION FACEBOOK & BÌNH LUẬN -->
        <div class="btn-row-2col">
          <button class="btn-act btn-copy-fb" onclick="copyCurrentField('facebook', 'Caption Facebook')">
            <span>📘 Caption Facebook</span>
          </button>
          <button class="btn-act btn-copy-pinned" onclick="copyCurrentField('pinnedComment', 'Bình Luận')">
            <span>📌 Bình Luận</span>
          </button>
        </div>

        <!-- HÀNG 3: CAPTION TIKTOK & CAPTION ZALO -->
        <div class="btn-row-2col">
          <button class="btn-act btn-copy-tiktok" onclick="copyCurrentField('tiktok', 'Caption TikTok')">
            <span>🎵 Caption TikTok</span>
          </button>
          <button class="btn-act btn-copy-zalo" onclick="copyCurrentField('zalo', 'Caption Zalo')">
            <span>💬 Caption Zalo</span>
          </button>
        </div>

        <!-- HÀNG 4: CAPTION YOUTUBE & MÔ TẢ YOUTUBE (HOẶC INSTA & PROMPT AI Ở TAB ẢNH) -->
        <div class="btn-row-2col">
          <button class="btn-act btn-copy-yt-title" id="btnRow4Col1" onclick="copyRow4Col1()">
            <span id="lblRow4Col1">▶️ Caption YouTube</span>
          </button>
          <button class="btn-act btn-copy-yt-desc" id="btnRow4Col2" onclick="copyRow4Col2()">
            <span id="lblRow4Col2">📄 Mô Tả YouTube</span>
          </button>
        </div>

        <!-- HÀNG 5: NÚT ĐÁNH DẤU ĐÃ ĐĂNG - DÀI, MÀU ĐỎ NỔI BẬT -->
        <div class="btn-row-2col">
  <button class="btn-act btn-link-aff" id="btnCopyAffiliateLink" onclick="copyAffiliateLink()">
    <span>🔗 Link AFF</span>
  </button>
  <button class="btn-act btn-copy-aff" id="btnCopyAffiliate" onclick="copyAffiliateSuggestions()">
    <span>🛒 Gợi ý AFF</span>
  </button>
</div>
<button class="btn-mark-posted state-pending" id="btnMarkPosted" onclick="toggleCurrentDone()">
  <span id="lblMarkPosted">🔴 ĐÃ ĐĂNG BÀI</span>
</button>
      </div>

      <!-- KHUNG XEM TRỰC TIẾP VIDEO & ẢNH (ĐẶT DƯỚI 5 HÀNG NÚT, KÍCH THƯỚC BẰNG NHAU) -->
      <div class="preview-section">
        <div class="preview-header-label">
          <span id="previewTypeLabel">Khung Xem Trực Tiếp:</span>
          <span id="previewActionHint" style="font-size:11px;color:#38bdf8;cursor:pointer;" onclick="openDriveExternalTab()">Mở tab Drive ↗</span>
        </div>
        <div class="preview-box" id="previewMediaBox">
          <!-- Video Iframe hoặc Thẻ Img sẽ được render tại đây -->
        </div>
      </div>
    </div>

    <!-- LIST & SEARCH SECTION (DƯỚI CÙNG - MẶC ĐỊNH LỌC CHƯA ĐĂNG) -->
    <div class="list-section">
      <div class="filter-chips">
        <button class="filter-chip chip-pending active" id="chipPending" onclick="setFilter('pending')">⏳ Chưa đăng (<span id="countPending">0</span>)</button>
        <button class="filter-chip chip-done" id="chipDone" onclick="setFilter('done')">✅ Đã đăng (<span id="countDone">0</span>)</button>
        <button class="filter-chip" id="chipAll" onclick="setFilter('all')">Tất cả (<span id="countAll">0</span>)</button>
      </div>

      <input type="text" class="search-input" id="searchInput" placeholder="🔍 Tìm theo STT (#1) hoặc từ khóa..." oninput="renderTable()">

      <div class="table-container">
        <table>
          <thead><tr><th style="width:46px;">STT</th><th>Tiêu đề bài viết</th><th style="width:75px;">Trạng thái</th></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="toast" id="toastMsg">✓ Đã sao chép!</div>
  <div class="lightbox" id="lightbox" onclick="this.style.display='none'"><img id="lightboxImg" src=""></div>

uctLink":""},{"stt":2,"category":"Trường Chia Sẻ","title":"Audio 2","status":"Đã đăng","videoUrl":"https://drive.google.com/file/d/1fBPuSMLBRnTamixorguZe96qLxtGxQe_/view?usp=drivesdk","youtubeTitle":"Vợ Là Người Quan Trọng Nhất: Bài Học Xương Máu Đàn Ông Phải Thuộc Lòng | Trương Chia Sẻ","youtubeDesc":"Trong cuộc đời mỗi người đàn ông, cha mẹ có ơn dưỡng dục, anh em có tình thủ túc, con cái là tương lai. Nhưng người duy nhất cùng ta nếm trải mọi cay đắng ngọt bùi, ở bên lúc khó khăn nhất không rời bỏ chỉ có thể là vợ. Đối xử tốt với vợ chính là đang đối xử tốt với nửa đời sau của chính mình. Đừng quên đăng ký kênh để xem thêm nhiều bài học ý nghĩa.\n\n#TruongChiaSe","tiktok":"Đừng để đến lúc trắng tay mới nhận ra ai là người quan trọng nhất. Đàn ông có thể mất tất cả, nhưng tuyệt đối đừng để mất đi người này. Xem hết video để thấu hiểu đạo lý phu thê.\n\n#TruongChiaSe","facebook":"Nửa đời sau của đàn ông, hơn thua nhau ở người vợ. Hãy trân trọng người đồng hành duy nhất bên bạn lúc gian nan.\n\n#TruongChiaSe #GiaDinh #HonNhan #DanOng #NhanSinh","zalo":"Gửi các anh em, hãy trân trọng người phụ nữ đang cùng mình gánh vác gian nan. Tiền bạc có thể kiếm lại, nhưng người bạn đời tri kỷ thì chỉ có một. Chúc gia đình chúng ta luôn thuận hòa, ấm êm!\n\n#TruongChiaSe","instagram":"Người đi cùng bạn hết cuộc đời, chỉ có thể là vợ. Trân trọng hiện tại, hạnh phúc tương lai. ✨\n\n#TruongChiaSe #HonNhan #GiaDinh #HanhPhuc #NhanSinh","pinnedComment":"Theo bạn, điều gì ở người vợ khiến đàn ông trân trọng nhất? Hãy để lại bình luận chia sẻ cùng Trường nhé! Đừng quên ghé link bio hoặc giỏ hàng để chọn món quà tinh tế tặng người phụ nữ của mình nha.","affiliateSuggestions":"Sách Đàn Ông Đến Từ Sao Hỏa Đàn Bà Đến Từ Sao Kim\nSách 5 Ngôn Ngữ Tình Yêu\nMáy Massage Cổ Vai Gáy Chăm Sóc Sức Khỏe\nBộ Cốc Gốm Sứ Cao Cấp Làm Quà Tặng\nNến Thơm Tinh Dầu Thư Giãn","productLink":""},{"stt":3,"category":"Trường Chia Sẻ","title":"Audio 3","status":"Đã làm video","videoUrl":"https://drive.google.com g 3 tầng\nBình giữ nhiệt Lock&Lock 500ml\nSách Hiểu Về Trái Tim - Thích Nhất Hạnh","productLink":""},{"stt":6,"category":"Trường Chia Sẻ","title":"Audio 6","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1k9OknQ6_suaLFTQOBHkSZ6KnqDdaf-LQ/view?usp=drivesdk","youtubeTitle":"Cưới Được Người Vợ Như Thế Này Là PHÚC BA ĐỜI | Bài Học Cuộc Đời Ý Nghĩa","youtubeDesc":"Trong cuộc sống xô bồ, một người vợ giản đơn, lương thiện và biết vun vén gia đình chính là báu vật vô giá mà không tiền bạc nào mua được. Video này là lời nhắc nhở sâu sắc dành cho các quý ông: Hạnh phúc đôi khi rất gần gũi, hãy biết đủ và trân trọng người bạn đời bên cạnh mình trước khi quá muộn.\n\n#TruongChiaSe #BaiHocCuocDoi","tiktok":"Bạn có biết 99% đàn ông đang khao khát điều gì không? Không phải tiền bạc xa hoa, mà là người phụ nữ có những đặc điểm này. Xem hết video để biết bạn có đang sở hữu 'kho báu' cả đời không nhé!\n\n#TruongChiaSe","facebook":"Cưới được người vợ thế này là phúc ba đời, đàn ông nhớ trân trọng nhé.\n\n#TruongChiaSe #HonNhan #GiaDinh #HanhPhuc #DanOng","zalo":"Gửi những người anh em, đôi khi chúng ta mải mê tìm kiếm những thứ xa vời mà quên mất rằng hạnh phúc lớn nhất chính là người vợ hiền hậu đang đợi ta ở nhà. Nếu may mắn có được người phụ nữ giản dị, biết lo toan, hãy luôn trân quý và yêu thương cô ấy thật nhiều nhé!\n\n#TruongChiaSe","instagram":"Sự giản đơn là đỉnh cao của sự tinh tế. Trân trọng người phụ nữ vì bạn mà giữ lửa ấm gia đình. ✨\n\n#TruongChiaSe #Love #Family #Lifestyle #Minimalism","pinnedComment":"Theo bạn, đức tính nào của người vợ là đáng trân trọng nhất trong thời đại ngày nay? Chia sẻ cùng Trường nhé! 👇 Đừng quên ghé link bio để chọn những món quà nhỏ tinh tế tri ân 'nóc nhà' của mình nha.","affiliateSuggestions":"Tạp dề vải canvas phong cách tối giản\nBộ hộp cơm văn phòng giữ nhiệt cao cấp\nSổ tay quản lý thu chi gia đình\nBộ cọ trang điểm cá nhân 8 món cơ bản\nMáy xông tinh dầu tạo độ ẩm phòng ngủ","productLink":""},{"stt":7,"category":"Trường Chia Sẻ","title":"Audio 7","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1vbsCVuuH8wuuWrF3dA5Uv46i25RlMOAy/view?usp=drivesdk","youtubeTitle":"Đừng Để Sự Nghèo Khó Làm Bạn Mất Đi Tiếng Nói | Bài Học Đắt Giá Về Sự Tự Lập","youtubeDesc":"\"Mái hiên của người khác dù lớn đến đâu cũng không bằng tự mình có một chiếc ô\". Trong cuộc sống này, tiền bạc đôi khi chính là thước đo của sự tôn trọng. Video này chia sẻ về tư duy nỗ lực, chấp nhận khổ cực sau lưng để đổi lấy sự vẻ vang trước mặt người đời. Hãy cùng  chiêm nghiệm để có thêm động lực thay đổi số phận.\n\n#TruongChiaSe","tiktok":"Bạn có biết tại sao ngay cả người thân nhất cũng có lúc xem thường bạn không? Đừng mãi mượn hiên nhà người khác, hãy tự tạo cho mình một chiếc ô vững chãi. Video này sẽ thay đổi hoàn toàn tư duy kiếm tiền và sự tự lập của bạn. Xem hết để hiểu cái giá thực sự của sự vẻ vang nhé!\n\n#TruongChiaSe","facebook":"Đừng đợi đến khi gục ngã mới hối tiếc. Tự đứng trên đôi chân mình mới là sự bảo đảm vững chắc nhất.\n\n#TruongChiaSe #NoLuc #KiemTien #PhatTrienBanThan #BaiHocCuocDoi","zalo":"Dòng đời xô bồ, đôi khi chỉ có chính mình mới là điểm tựa vững chắc nhất. Hy vọng thông điệp này sẽ tiếp thêm sức mạnh để bạn luôn vững vàng, làm chủ cuộc đời và không bao giờ phải dựa dẫm vào bất kỳ ai. Chúc bạn sớm đạt được thành công như ý!\n\n#TruongChiaSe","instagram":"Tự lập là chiếc ô vững chãi nhất giữa bão giông. Muốn rực rỡ dưới ánh hào quang, trước hết hãy kiên cường bước qua những ngày tăm tối. ✨\n\n#TruongChiaSe #Motivation #Success #Mindset #LifeLessons","pinnedComment":"Bạn chọn sự an phận trong căn nhà cũ hay chấp nhận gian khổ để xây dựng cơ đồ riêng? Chia sẻ góc nhìn của bạn bên dưới nhé! Tham khảo thêm những công cụ giúp bạn thay đổi tư duy và làm chủ tài chính tại link Bio/Giỏ hàng nha. 👇","affiliateSuggestions":"Sách Nghĩ Giàu Và Làm Giàu - Napoleon Hill\nSách Thay Đổi Tư Duy Thay Đổi Vận Mệnh\nSách Cha Giàu Cha Nghèo - Robert Kiyosaki\nSổ tay lập kế hoạch mục tiêu ưu hóa thời gian hiệu quả nha!","affiliateSuggestions":"Đồng hồ báo thức để bàn\nGiá đỡ điện thoại xoay 360 độ\nSách Lối Sống Tối Giản Của Người Nhật\nKính cường lực chống nhìn trộm\nTúi đựng điện thoại chống nước","productLink":""},{"stt":12,"category":"Trường Chia Sẻ","title":"Audio 12","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1sUPOjEJe5m4eQXoVj_jBKPEjvO-wD_7v/view?usp=drivesdk","youtubeTitle":"Đừng Đợi Đến Già Mới Hiểu: Đời Người Chỉ Có Một Lần | Bài Học Nhìn Thấu Cuộc Sống","youtubeDesc":"Chúng ta thường mải mê theo đuổi tiền bạc, thể diện và những mối quan hệ xã giao mà quên mất rằng sự sống là một món quà vô giá. Video này là lời nhắc nhở chân thành: Đừng để những điều không vui lấp đầy cuộc đời ngắn ngủi, hãy trân trọng từng ngày bạn còn được thở.\n\n#TruongChiaSe #baihoccuocdoi #trietlynhansinh","tiktok":"Bạn có chắc mình còn nhiều thời gian để lãng phí? Có người 30 đã dừng lại, có người 50 đã ra đi. Chúng ta chỉ đến thế gian này đúng một lần, đừng để áp lực và nỗi buồn chiếm lấy tâm trí. Hãy xem hết video này để biết điều gì thực sự đáng trân trọng trước khi quá muộn.\n\n#TruongChiaSe","facebook":"Đời người ngắn ngủi, đừng đợi đến lúc không còn cơ hội mới nhận ra điều gì thực sự quý giá. Hãy sống cho hiện tại!\n\n#TruongChiaSe #songtronven #nhansinh #quytrong #trietly","zalo":"Cuộc đời này mong manh lắm, đôi khi chẳng đợi được đến già đâu. Đừng để áp lực hay những chuyện không vui làm mình mệt mỏi mãi. Hãy sống trọn vẹn, yêu thương bản thân và trân trọng mỗi ngày bình an bên gia đình nhé. Chúc bạn một đời an yên!\n\n#TruongChiaSe","instagram":"Hành trình này chỉ có một lượt đi, đừng lãng phí cho những muộn phiền không đáng. Hãy sống rực rỡ và trân trọng từng khoảnh khắc hiện tại. ✨\n\n#TruongChiaSe #mindfulness #songcham #binhan #lifequotes","pinnedComment":"Nếu chỉ còn một ngày để sống, điều đầu tiên bạn muốn làm là gì? Hãy chia sẻ cùng Trường nhé! Đừng quên ghé link bio để tìm những món quà chữa lành và chăm sóc sức khỏe cho chính mình và người thân tại đây.","affiliateSuggestions":"Sách Muôn Kiếp Nhân Sinh\nMáy xông tinh dầu kèm tinh dầu thiên nhiên\nThảm tập Yoga định tuyến\nTrà thảo mộc an thần ngủ ngon\nSổ tay ghi chép thực hành lòng biết ơn","productLink":""},{"stt":13,"category":"Trường Chia Sẻ","title":"Audio 13","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1DlpmQwI31J6xlV-tZoLB_Zvv_klTxvcf/view?usp=drivesdk","youtubeTitle":"Đừng Cho Con Gái Sống Thử Khi Chưa Xem Video Này! | Bài Học Đắt Giá Từ Người Cha","youtubeDesc":"Sống thử trước hôn nhân: Cơ hội hay cạm bẫy? Người cha trong video đã đưa ra 3 hệ lụy cực kỳ sâu sắc mà bất kỳ cô gái nào cũng cần phải cân nhắc trước khi quyết định. Từ việc bị coi thường đến rủi ro mang thai ngoài ý muốn, đây là bài học về sự tự trọng và bảo vệ bản thân. Hãy cùng Truong Chia Se lắng nghe lời khuyên tâm huyết này để có cái nhìn thấu đáo hơn về tình yêu và hôn nhân.\n\n#TruongChiaSe","tiktok":"Đừng để con gái bạn phải hối hận vì sống thử quá sớm! 3 lý do tàn khốc mà người cha này cảnh báo sẽ khiến bạn phải giật mình tỉnh ngộ. Liệu tình yêu có thắng được thực tế phũ phàng? Xem hết video để hiểu tại sao người cha lại kiên quyết từ chối nhé!\n\n#TruongChiaSe","facebook":"Con gái đòi sống thử và câu trả lời 'thấu tình đạt lý' của người cha. Bài học cực thấm!\n\n#TruongChiaSe #GiaoDucCon #SongThu #TamLy #GiaDinh","zalo":"Gửi những người làm cha làm mẹ và các bạn trẻ đang yêu. Tình yêu cần trải nghiệm nhưng đừng để thanh xuân phải trả giá quá đắt. Lời khuyên chân thành từ người cha giúp chúng ta tỉnh táo hơn trước những quyết định quan trọng của cuộc đời. Chúc cả nhà một ngày bình an và luôn biết yêu thương bản thân đúng cách!\n\n#TruongChiaSe","instagram":"Tự trọng là trang sức đẹp nhất của người phụ nữ. 🕊️ Đừng vội vàng trao đi thanh xuân khi chưa có một cam kết xứng đáng. Một bài học sâu sắc dành cho phái đẹp. ✨\n\n#TruongChiaSe #LoveLessons #WomanQuotes #FamilyValues #Wisdom","pinnedComment":"Bạn nghĩ sao về quan điểm của người c gay hôm nay hay chấp nhận bị bỏ lại phía sau? Chia sẻ câu chuyện của bạn bên dưới nhé! Đừng quên ghé link bio để tìm những công cụ giúp bạn rèn luyện kỷ luật và phát triển bản thân hiệu quả hơn.","affiliateSuggestions":"Sách Đừng Lựa Chọn An Nhàn Khi Còn Trẻ\nSách Nghĩ Giàu Và Làm Giàu - Napoleon Hill\nSổ tay lập kế hoạch hành động Daily Planner\nSách Đời Thay Đổi Khi Chúng Ta Thay Đổi\nSách Sức Mạnh Của Kỷ Luật","productLink":""},{"stt":15,"category":"Trường Chia Sẻ","title":"Audio 15","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1SLCFja_y0JMCFNfFN2q038r0IylGtNIm/view?usp=drivesdk","youtubeTitle":"Khi Cha Bắt Đầu 'Hỏi Ý Kiến' Bạn: Sự Chuyển Giao Lặng Lẽ Của Thời Gian | #TruongChiaSe","youtubeDesc":"Năm tháng tàn nhẫn in hằn lên gương mặt cha những nếp nhăn, và cũng là lúc vai cha đã mỏi. Khi cha không còn trách mắng, ấy là lúc ông đã trao lại 'quyền trượng' gánh vác gia đình cho bạn. Đừng để cha phải đợi quá lâu để thấy bạn trưởng thành. Hãy trở thành điểm tựa vững chắc để cha được nghỉ ngơi. Đăng ký kênh Truong Chia Se để cùng chiêm nghiệm những bài học nhân sinh giá trị.\n\n#TruongChiaSe #GiaDinh #Cha #BaiHocCuocDoi","tiktok":"Bạn có nhận ra khoảnh khắc cha mình đột nhiên trở nên 'hiền' lạ thường? Khi cha không còn trách mắng mà bắt đầu hỏi ý kiến bạn, đó là lúc gánh nặng gia đình đã âm thầm chuyển sang vai bạn rồi. Đừng để cha phải đợi quá lâu để thấy bạn trưởng thành. Xem hết video này để thấu hiểu sự chuyển giao lặng lẽ của thời gian nhé.\n\n#TruongChiaSe #NhanSinh #BaiHocCuocDoi #GiaDinh #HieuThao","facebook":"Khi cha không còn trách mắng, là lúc đôi vai bạn phải đủ rộng để che chở cả gia đình. Đã đến lúc trưởng thành rồi.\n\n#TruongChiaSe #Cha #GiaDinh #TruongThanh #DaoLy","zalo":"Trưởng thành không phải là khi ta lớn lên, mà là khi ta dám đứng ra che mưa chắn gió cho cha mẹ. Khi cha bắt đầu hỏi ý kiến chúng ta, đó là lời thông báo rằng cha đã già và cần một điểm tựa. Hãy trân trọng và thấu hiểu khi còn có thể, bạn nhé.\n\n#TruongChiaSe","instagram":"Gánh nặng trên vai cha, giờ đây đã là bầu trời của con. Sự chuyển giao lặng lẽ của năm tháng qua những nếp nhăn. 🕯️✨\n\n#TruongChiaSe #FamilyFirst #Growth #NhanSinh #Love #GiaDinh","pinnedComment":"Khoảnh khắc nào khiến bạn nhận ra mình đã thực sự là trụ cột của gia đình? Chia sẻ câu chuyện của bạn cùng Trường nhé! Đừng quên ghé link bio để chọn những món quà sức khỏe dành tặng cha mẹ lúc tuổi già. ❤️ #TruongChiaSe","affiliateSuggestions":"Máy massage cổ vai gáy đa năng\nThực phẩm bảo vệ sức khỏe Glucosamine cho người già\nMáy đo huyết áp điện tử Omron\nHộp trà biếu cao cấp\nSách Muôn Kiếp Nhân Sinh","productLink":""},{"stt":16,"category":"Trường Chia Sẻ","title":"Audio 16","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1OyPNS7q-uf5W_DNwoyUxzD5f6o9D9q8L/view?usp=drivesdk","youtubeTitle":"Nỗi Đau Mất Người Thân: Không Phải Lúc Chia Ly, Mà Là Khi Kỷ Niệm Ùa Về | Truong Chia Se","youtubeDesc":"Có những sự ra đi không làm ta bật khóc ngay lập tức, nhưng lại khiến ta day dứt cả đời qua những điều giản đơn nhất: chiếc cốc cũ, món ăn quen thuộc... Hãy cùng lắng lòng lại để trân trọng những người bên cạnh trước khi mọi thứ chỉ còn là ký ức. Đừng để sự nuối tiếc lấp đầy khoảng trống của sự mất mát.\n\n#TruongChiaSe #BaiHocCuocDoi","tiktok":"Bạn có biết, nỗi đau lớn nhất không phải là lúc họ rời đi? Mà là khi vô tình nhìn món ăn họ thích, lòng bỗng quặn thắt. Xem hết video để thấu hiểu vì sao nỗi nhớ lại đau lòng đến thế.\n\n#TruongChiaSe","facebook":"Nỗi đau không đến ngay lúc ly biệt, mà thấm vào từng kỷ niệm nhỏ nhất. Trân trọng khi còn có thể.\n\n#TruongChiaSe #NoiNho #GiaDinh #NhanSinh #CuocSong","zalo":"Đừng đợi đến khi chỉ còn là kỷ niệm mới thấy trân trọng. Hãy dành thời gian cho những người thân yêu khi còn có thể, bởi nỗi nhớ sau này sẽ đau lòng lắm. Gửi lời chúc bình an đến bạn và gia đình.\n\n#TruongChiaSe","instagram":"Khoảng trống họ để lại, nằm ở những điều bình dị nhất. 🕊️\n.\n\n#TruongChiaSe #Memory #Grief #Love #LifeLessons #Healing","pinnedComment":"Khoảnh khắc nào khiến bạn nhớ về người thân đã khuất nhất? Hãy chia sẻ cùng cộng đồng nhé. Nếu bạn đang tìm kiếm sự an yên, hãy ghé thăm giỏ hàng/bio để chọn những món quà ý nghĩa dành cho người thân yêu khi còn có thể. #TruongChiaSe","affiliateSuggestions":"Sách Kiếp Nào Ta Cũng Tìm Thấy Nhau - Brian Weiss\nSách Trở Về Từ Cõi Sáng - Nguyên Phong\nKhung ảnh gỗ sồi cao cấp lưu giữ kỷ niệm\nMáy xông tinh dầu kèm tinh dầu trầm hương thư giãn\nSổ tay viết nhật ký chữa lành tâm hồn","productLink":""},{"stt":17,"category":"Trường Chia Sẻ","title":"Audio 17","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/17cubPSAOmIIn-HupM-B9lW4ZAjyaH8vM/view?usp=drivesdk","youtubeTitle":"Đỉnh Cao Bản Lĩnh Đàn Ông: Nghệ Thuật Từ Chối Và Tư Duy Của Người Thành Công | #TruongChiaSe","youtubeDesc":"Sống ở đời, không nợ ai thì không phải cúi đầu trước ai. Video này chia sẻ những bài học xương máu về cách kiểm soát cảm xúc, giữ vững lý trí trước cám dỗ và nghệ thuật từ chối để giữ lấy phẩm giá. Đừng để sự nể trọng sai chỗ làm suy giảm trí tuệ của bạn. Đã đến lúc thay đổi suy nghĩ để thay đổi cả cuộc đời.\n\n#TruongChiaSe #BaiHocCuocSong #PhatTrienBanThan #TuDuyVang","tiktok":"Bạn có đang quá nể nang mà tự làm khổ mình không? Đàn ông bản lĩnh không chỉ biết kiếm tiền, mà còn phải biết 'lắc đầu' đúng lúc để bảo vệ chính mình. Xem hết video này để nắm vững những nguyên tắc đối nhân sự thế giúp bạn sống kiêu hãnh và trí tuệ hơn. Đừng bỏ lỡ bài học cuối cùng vì nó sẽ thay đổi hoàn toàn cuộc đời bạn!\n\n#TruongChiaSe","facebook":"Nghệ thuật từ chối và giữ bản lĩnh đỉnh cao. Sách hay giúp bạn sống khôn ngoan để không bao giờ phải cúi đầu trước bất kỳ ai.\n\n#TruongChiaSe #kynang #songkhon #phattrien #danong","zalo":"Gửi bạn, sống ở đời bản lĩnh nhất là biết giữ mình trước cám dỗ và biết từ chối khi cần thiết. Đừng vì nể nang mà đánh mất nguyên tắc cá nhân. Hy vọng những chia sẻ chân thành này giúp chúng ta sống tỉnh táo, kỷ luật và hạnh phúc hơn mỗi ngày.\n\n#TruongChiaSe","instagram":"Bản lĩnh là khi bạn làm chủ được cảm xúc và ngôn từ của chính mình. Sống kỷ luật, giữ nguyên tắc để đời thanh thản. ✨\n\n#TruongChiaSe #Mindset #Lifestyle #Wisdom #Success","pinnedComment":"Trong những bài học trên, bạn thấy điều nào khó thực hiện nhất? Chia sẻ cùng mình nhé! Các bạn có thể tìm đọc cuốn sách thay đổi tư duy mình nhắc tới trong video tại giỏ hàng bên dưới để nâng tầm bản thân ngay hôm nay. 👇","affiliateSuggestions":"Sách Thay Đổi Suy Nghĩ Thay Đổi Cuộc Đời - Brian Tracy\nSách Khéo Ăn Nói Sẽ Có Được Thiên Hạ\nSách Nghệ Thuật Từ Chối - Damon Zahariades\nSách Đắc Nhân Tâm - Dale Carnegie\nSách Tâm Lý Học Hành Vi","productLink":""},{"stt":18,"category":"Trường Chia Sẻ","title":"Audio 18","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1eWgZ6s30fdJMuXkhjggVHvzjxANMQK1C/view?usp=drivesdk","youtubeTitle":"Còn Mẹ Là Còn Cả Tuổi Thơ: Bài Học Đắt Giá Về Sự Trân Trọng | Truong Chia Se","youtubeDesc":"Hạnh phúc nhất thế gian không phải là giàu sang, mà là khi 80, 90 tuổi vẫn còn được gọi một tiếng 'Mẹ'. Video này dành cho những ai đang còn mẹ và cả những ai đã mất đi vòng tay ấy. Hãy cùng lắng nghe để thấy mình may mắn đến nhường nào và học cách trân trọng từng phút giây bên đấng sinh thành.\n\n#TruongChiaSe","tiktok":"Bạn có biết mình đang sở hữu khối tài sản lớn nhất thế gian không? Đó chính là Mẹ. Đừng lướt qua nếu bạn vẫn còn cơ hội để yêu thương. Xem hết video để thấu hiểu giá trị của tình mẫu tử và trân trọng người phụ nữ vĩ đại nhất đời mình.\n\n#TruongChiaSe","facebook":"Còn mẹ là còn cả bầu trời tuổi thơ. Đừng để khi mất đi mới thấy tiếc nuối. Trân trọng ngay lúc này.\n\n#TruongChiaSe #Me #GiaDinh #DaoLy #BietOn","zalo":"Một lời nhắc nhở nhẹ nhàng cho ngày hôm nay: Hãy dành thời gian quan tâm đến mẹ nhiều hơn khi còn có thể. Hạnh phúc đôi khi chỉ là một cuộc điện thoại hỏi thăm. Chúc bạn và gia đình luôn bình an, ấm áp.\n\n#TruongChiaSe","instagram":"Mẹ là gốc rễ, con là bông hoa. Chỉ khi còn gốc, ngChiaSe","instagram":"Kiếp này nợ mẹ một đời thành đạt, nợ mẹ một chuyến đi xa. Hy vọng thời gian xin hãy trôi chậm lại để con kịp bù đắp cho người... 🤍\n\n#TruongChiaSe #Gratitude #Family #Healing #Motherhood","pinnedComment":"Nếu có một điều muốn thay đổi ngay lúc này để mẹ hạnh phúc hơn, bạn sẽ làm gì? Hãy chia sẻ câu chuyện của bạn nhé. Đừng quên ghé giỏ hàng để chọn những món quà sức khỏe ý nghĩa dành tặng mẹ ngay hôm nay!","affiliateSuggestions":"Máy massage cổ vai gáy hồng ngoại\nThực phẩm bảo vệ sức khỏe Glucosamine\nSữa hạt dinh dưỡng cho người cao tuổi\nSách Muôn kiếp nhân sinh - Nguyên Phong\nĐèn xông tinh dầu giúp ngủ ngon","productLink":""},{"stt":20,"category":"Trường Chia Sẻ","title":"Audio 20","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1h6NEIXVVwIhvpB1AFXuhFufR8yYDPyPz/view?usp=drivesdk","youtubeTitle":"Sự Thật Trần Trụi Về Nhân Gian Điên Đảo - Đạo Lý Nhân Sinh Thức Tỉnh | Truong Chia Se","youtubeDesc":"Cuộc sống hiện đại đầy rẫy những nghịch lý: con người vất vả hơn trâu ngựa, tiền bạc làm mờ mắt nhân tâm. Video này là hồi chuông cảnh tỉnh về những giá trị đạo đức đang dần mất đi. Hãy cùng suy ngẫm để tìm lại sự thanh tịnh trong tâm hồn giữa chốn bụi trần hối hả.\n\n#TruongChiaSe","tiktok":"Có bao giờ bạn thấy cuộc đời này lạ lùng lắm không? Trâu ngựa thong dong, con người lại vất vả hơn cả chúng. Tiền bạc làm loạn nhân tính, đạo đức đảo điên. Xem hết video này để thấy sự thật trần trụi của nhân gian ngày nay.\n\n#TruongChiaSe","facebook":"Nhân gian đảo điên, giá trị thực nằm ở đâu?\n\n#TruongChiaSe #daoly #cuocsong #nhansinh #trietly","zalo":"Giữa dòng đời hối hả và nhiều nghịch lý, mong bạn vẫn giữ được cho mình một tâm thế bình thản và trái tim thiện lương. Đừng để vật chất làm mờ đi nhân tính, chúc bạn luôn bình yên.\n\n#TruongChiaSe","instagram":"Nhân gian hữu hạn, lòng người vô cùng. Hãy giữ lấy chút thanh tịnh giữa đời biến động. ✨\n\n#TruongChiaSe #life #peace #healing #nhansinh #philosophy","pinnedComment":"Trong những nghịch lý trên, bạn thấy điều nào đáng suy ngẫm nhất? Chia sẻ cùng Trường nhé! Đừng quên ghé giỏ hàng để chọn những cuốn sách nuôi dưỡng tâm hồn tại đây.","affiliateSuggestions":"Sách Hiểu Về Trái Tim - Minh Niệm\nSách Muôn Kiếp Nhân Sinh - Nguyên Phong\nSách Khéo Ăn Nói Sẽ Được Thiên Hạ - Trác Nhã\nMáy xông tinh dầu gốm cao cấp\nTrà hoa cúc trắng thanh nhiệt tĩnh tâm","productLink":""},{"stt":21,"category":"Trường Chia Sẻ","title":"Audio 21","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1OiZw3Jatt5-IkGelBXHMI65hrEKIdO0T/view?usp=drivesdk","youtubeTitle":"Đời Người Có 4 Cái 'Thua' - Ngẫm Lại Để Sống Trọn Vẹn Hơn | Trương Chia Sẻ","youtubeDesc":"Đời người là một hành trình đuổi bắt không ngừng nghỉ: Tuổi thơ thua bài kiểm tra, tuổi trẻ thua đồng tiền, trung niên thua con cái, tuổi già thua bệnh tật. Khi nhận ra chân lý thì tóc đã điểm sương. Video này là thông điệp nhắc nhở chúng ta hãy trân trọng hiện tại, đừng để cuộc sống 'đánh thức' bằng những nỗi đau. Đăng ký kênh  để nhận thêm những bài học nhân sinh sâu sắc mỗi ngày.\n\n#TruongChiaSe","tiktok":"Bạn có bao giờ tự hỏi: Tại sao lúc nhỏ muốn lớn, lớn rồi lại muốn bé lại? 30 giây này sẽ khiến bạn phải lặng người nhìn lại hành trình mình đã đi qua. Xem hết để thấy chính mình trong đó nhé!\n\n#TruongChiaSe","facebook":"Khi hiểu chuyện thì đã không còn trẻ, khi còn trẻ lại chẳng hiểu gì. Bạn đang ở giai đoạn nào của đời người?\n\n#TruongChiaSe #daoly #cuocsong #nhansinh #phattrienbanthan","zalo":"Gửi bạn, đôi khi cuộc sống hối hả khiến ta quên mất bản thân mình. Đừng đợi đến khi thấu hiểu mới bắt đầu sống, hãy thương mình và trân trọng những người thân yêu ngay từ hôm nay. Chúc bạn một đời bình yên.\n\n#TruongChiaSe","instagram":"Nhân gian một cõi, sống sao cho trọn? ⏳\n.\n\n#TruongChiaSe #LifeQuotes #SlowLiving #Mindfulness #Healing #Nhansinh","pinnedComment":"Bạn thấy mình thấm thía nhất ở giai đoạn nào của cuộc đời? Chia sẻ cùng mình bên dưới nhé! Những món quà tinh thần giúp bạn chữa làn enBanThan","zalo":"Đôi khi sự im lặng mới là biểu hiện của một trí tuệ lớn. Chúc bạn một ngày bình yên, luôn sống chân thật với chính mình và không ngừng học hỏi từ thế giới rộng lớn xung quanh. Gửi đến bạn chút chiêm nghiệm về nhân sinh để cùng vững bước.\n\n#TruongChiaSe","instagram":"Sự tĩnh lặng là đỉnh cao của sự thấu hiểu. Đừng để vẻ ngoài hào nhoáng đánh lừa tâm trí bạn. ✨\n\n#TruongChiaSe #Mindfulness #Wisdom #LifeLessons #DeepThoughts","pinnedComment":"Bạn đã bao giờ gặp ai đó nhìn vẻ ngoài rất bình thường nhưng lại có tư duy cực kỳ đáng nể chưa? Hãy chia sẻ câu chuyện của bạn nhé! Để nâng tầm tư duy và thấu hiểu nhân sinh hơn, mời bạn tham khảo các tựa sách mình đã chọn lọc trong link bio/giỏ hàng bên dưới nhé! 👇","affiliateSuggestions":"Sách Tâm Lý Học Về Tiền - Morgan Housel\nSách Đắc Nhân Tâm - Dale Carnegie\nSách Hiểu Về Trái Tim - Thích Minh Niệm\nSách Sức Mạnh Của Sự Tĩnh Lặng - Eckhart Tolle\nSách Càng Kỷ Luật Càng Tự Do - Ca Tây","productLink":""},{"stt":32,"category":"Trường Chia Sẻ","title":"Audio 32","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1IO1U2wkxYYwOAModaxV6wW9IGb6cHdqK/view?usp=drivesdk","youtubeTitle":"Đừng Trách Người Lúc Sa Cơ, Đừng Quá Dễ Dãi Khi Thành Công | Bài Học Nhân Sinh Thấm Thía","youtubeDesc":"Cuộc đời là những vòng lặp của thành và bại. Khi vấp ngã, hãy tự đứng lên bằng đôi chân mình thay vì mong chờ sự thương hại. Khi thành công, hãy sống bản lĩnh để không ai có thể coi thường bạn thêm lần nữa. Hãy cùng  chiêm nghiệm đạo lý đối nhân xử thế, lấy lòng mình đặt vào lòng người để đổi lấy chân tâm giữa cuộc đời này.\n\n#TruongChiaSe","tiktok":"Tại sao khi thành công, bạn không nên dễ dàng tha thứ cho kẻ từng khinh thường mình? Đừng trách móc ai khi mình tay trắng, nhưng cũng đừng quên cách họ đối xử với bạn khi bạn chẳng có gì. Xem hết video này để thấu hiểu đạo lý 'đặt lòng mình vào lòng người' cực thấm thía nhé!\n\n#TruongChiaSe","facebook":"Khi sa cơ đừng trách người, lúc thành công đừng quá dễ dãi. S         document.getElementById("previewTypeLabel").innerText = "Khung Xem Ảnh Gốc:";
      }

      // Luôn đưa về bài chưa đăng đầu tiên của tab đó
      findAndSetFirstPendingIndex();
      loadCurrentItem();
      renderTable();
      updateStats();
    }

    function findAndSetFirstPendingIndex() {
      var items = getItems();
      for (var i = 0; i < items.length; i++) {
        if (!isDone(items[i])) {
          currentIndex = i;
          return;
        }
      }
      currentIndex = 0;
    }

    function loadCurrentItem() {
      var items = getItems();
      if (!items || items.length === 0) {
        document.getElementById("currStt").innerText = "#0";
        document.getElementById("currCategory").innerText = "Chưa có dữ liệu";
        document.getElementById("currTitle").innerText = "Chưa có bài viết nào trong tab này";
        document.getElementById("previewMediaBox").innerHTML = "<div class='preview-placeholder'><span class='icon'>📁</span><span>Không có dữ liệu</span></div>";
        return;
      }

      if (currentIndex < 0) currentIndex = 0;
      if (currentIndex >= items.length) currentIndex = items.length - 1;

      var it = items[currentIndex];
      document.getElementById("currStt").innerText = "#" + it.stt;
      document.getElementById("currCategory").innerText = it.category || "Phúc Học Điều Hay";
      document.getElementById("currTitle").innerText = it.title;

      // Cập nhật Nút Đánh Dấu Đã Đăng (Hàng 5)
      var d = isDone(it);
      var btnMark = document.getElementById("btnMarkPosted");
      var lblMark = document.getElementById("lblMarkPosted");

      if (d) {
        btnMark.className = "btn-mark-posted state-done";
        lblMark.innerText = "✅ ĐÃ ĐĂNG (Hoàn tác)";
      } else {
        btnMark.className = "btn-mark-posted state-pending";
        lblMark.innerText = "🔴 ĐÁNH DẤU: ĐÃ ĐĂNG BÀI";
      }

      // TỰ ĐỘNG NẠP VÀO KHUNG XEM TRỰC TIẾP
      renderPreviewMedia(it);
    }

    function renderPreviewMedia(it) {
      var box = document.getElementById("previewMediaBox");
      box.innerHTML = "";

      if (currentTab === "video") {
        var vidUrl = it.videoUrl || it.zipUrl || "";
        var fileId = extractDriveId(vidUrl);

        if (fileId) {
          var previewSrc = "https://drive.google.com/file/d/" + fileId + "/preview";
          var iframe = document.createElement("iframe");
          iframe.src = previewSrc;
          iframe.allow = "autoplay; fullscreen";
          iframe.setAttribute("allowfullscreen", "true");
          box.appendChild(iframe);
        } else {
          box.innerHTML = "<div class='preview-placeholder'><span class='icon'>🎬</span><b>Chưa có link video Drive</b><span class='hint'>Hãy cập nhật cột 'Link Video Drive' trong sheet</span></div>";
        }
      } else {
        // TAB ẢNH - TUYỆT ĐỐI KHÔNG DÙNG AVATAR
        var imgUrl = it.imageUrl || ("Image/A (" + it.stt + ").jpg");
        var imgId = extractDriveId(imgUrl);
        var directImgSrc = imgId ? ("https://lh3.googleusercontent.com/d/" + imgId) : imgUrl;

        var img = document.createElement("img");
        img.src = directImgSrc;
        img.title = "Nhấp để phóng to toàn màn hình";
        img.onclick = function() { openLightbox(this.src); };
        img.onerror = function() {
          if (imgId && this.src.indexOf("googleusercontent") !== -1) {
            this.src = "https://drive.google.com/thumbnail?id=" + imgId + "&sz=w1000";
          } else {
            box.innerHTML = "<div class='preview-placeholder'><span class='icon'>📸</span><b>Không thể tải trước ảnh</b><span class='hint'>Bấm 'Tải Drive' để tải ảnh gốc</span></div>";
          }
        };
        box.appendChild(img);
      }
    }

    function triggerViewInFrame() {
      var it = getItems()[currentIndex];
      if (!it) return;
      renderPreviewMedia(it);
      showToast("👁️ Đang mở trình phát trong khung xem!");
    }

    function triggerDownloadDrive() {
      var it = getItems()[currentIndex];
      if (!it) return;
      var rawUrl = (currentTab === "video") ? (it.videoUrl || it.zipUrl) : it.imageUrl;
      var fileId = extractDriveId(rawUrl);

      if (fileId) {
        var dlUrl = "https://drive.google.com/uc?export=download&id=" + fileId;
        window.open(dlUrl, "_blank");
        showToast("📥 Đang tải file từ Google Drive...");
      } else if (rawUrl && rawUrl.indexOf("http") === 0) {
        window.open(rawUrl, "_blank");
      } else {
        showToast("⚠️ Chưa có URL Google Drive cho bài này!");
      }
    }

    function openDriveExternalTab() {
      var it = getItems()[currentIndex];
      if (!it) return;
      var rawUrl = (currentTab === "video") ? (it.videoUrl || it.zipUrl) : it.imageUrl;
      if (rawUrl && rawUrl.indexOf("http") === 0) {
        window.open(rawUrl, "_blank");
      } else {
        showToast("⚠️ Chưa có đường link Google Drive!");
      }
    }

    function copyAffiliateLink() {
      if (currentTab !== "video") { showToast("⚠️ Link AFF chỉ áp dụng cho video"); return; }
      var it = getItems()[currentIndex];
      var url = it && it.productLink ? String(it.productLink).trim() : "";
      if (!/^https?:\/\//i.test(url)) { showToast("⚠️ Chưa có Link AFF cho video này"); return; }
      copyText(url, "Link AFF");
    }

    function copyAffiliateSuggestions() {
      if (currentTab !== "video") { showToast("⚠️ Gợi ý AFF chỉ áp dụng cho video"); return; }
      copyCurrentField("affiliateSuggestions", "Gợi Ý Sản Phẩm AFF");
    }

    function copyCurrentField(key, label) {
      var it = getItems()[currentIndex];
      if (!it) return;
      var txt = it[key] || "";
      if (!txt) {
        showToast("⚠️ Chưa có nội dung " + label);
        return;
      }
      copyText(txt, label);
    }

    function copyRow4Col1() {
      var it = getItems()[currentIndex];
      if (!it) return;
      if (currentTab === "video") {
        copyCurrentField("youtubeTitle", "Tiêu Đề YouTube");
      } else {
        copyCurrentField("tiktok", "Caption Instagram");
      }
    }

    function copyRow4Col2() {
      var it = getItems()[currentIndex];
      if (!it) return;
      if (currentTab === "video") {
        copyCurrentField("youtubeDesc", "Mô Tả YouTube");
      } else {
        copyCurrentField("prompt", "Prompt AI Tạo Ảnh");
      }
    }

    function nextItem() {
      var items = getItems();
      if (currentIndex < items.length - 1) {
        currentIndex++;
        loadCurrentItem();
        renderTable();
      } else {
        showToast("Đã đến bài cuối cùng!");
      }
    }

    function prevItem() {
      if (currentIndex > 0) {
        currentIndex--;
        loadCurrentItem();
        renderTable();
      } else {
        showToast("Đang ở bài đầu tiên!");
      }
    }

    function toggleCurrentDone() {
      if (statusSyncPending) return;
      var it = getItems()[currentIndex];
      if (!it) return;
      var newDone = !isDone(it);
      var button = document.getElementById("btnMarkPosted");
      statusSyncPending = true;
      if (button) button.disabled = true;
      showToast("⏳ Đang ghi trạng thái vào Google Sheet...");
      callPostingApi("markPosted", { type: currentTab, stt: String(it.stt), title: it.title || "", isDone: String(newDone) }, function(error, result) {
        statusSyncPending = false;
        if (button) button.disabled = false;
        if (error || !result || !result.success || !result.updated) {
          var syncError = result && result.error ? result.error : (error && error.message ? error.message : "Không xác nhận được trạng thái từ Google Sheet.");
          showToast("⚠️ " + syncError);
          return;
        }
        it.status = newDone ? "Đã đăng" : (currentTab === "image" ? "Đã làm ảnh" : "Đã làm video");
        if (newDone && currentFilter === "pending") findAndSetFirstPendingIndex();
        loadCurrentItem();
        renderTable();
        updateStats();
        showToast(newDone ? "✅ Sheet đã ghi: ĐÃ ĐĂNG BÀI" : "⚪ Sheet đã ghi: CHƯA ĐĂNG");
      });
    }

    function setFilter(f) {
      currentFilter = f;
      document.querySelectorAll(".filter-chip").forEach(function(c) { c.classList.remove("active"); });
      if (f === "pending") document.getElementById("chipPending").classList.add("active");
      else if (f === "done") document.getElementById("chipDone").classList.add("active");
      else document.getElementById("chipAll").classList.add("active");

      // Nếu bài hiện tại không thuộc bộ lọc mới, nhảy về bài đầu tiên thỏa mãn
      var items = getItems();
      var validIndex = -1;
      for (var i = 0; i < items.length; i++) {
        var d = isDone(items[i]);
        if (f === "all" || (f === "pending" && !d) || (f === "done" && d)) {
          validIndex = i;
          break;
        }
      }
      if (validIndex !== -1) {
        currentIndex = validIndex;
        loadCurrentItem();
      }

      renderTable();
    }

    function renderTable() {
      var q = (document.getElementById("searchInput").value || "").toLowerCase().trim();
      var items = getItems();
      var tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      items.forEach(function(it, idx) {
        var d = isDone(it);
        if (currentFilter === "pending" && d) return;
        if (currentFilter === "done" && !d) return;

        var sttMatch = ("#" + it.stt).toLowerCase().indexOf(q) !== -1;
        var titleMatch = it.title.toLowerCase().indexOf(q) !== -1;
        if (q && !sttMatch && !titleMatch) return;

        var tr = document.createElement("tr");
        if (idx === currentIndex) tr.className = "active";
        tr.onclick = function() {
          currentIndex = idx;
          loadCurrentItem();
          renderTable();
          window.scrollTo({ top: 120, behavior: "smooth" });
        };

        tr.innerHTML = 
          '<td><b>#' + it.stt + '</b></td>' +
          '<td>' + it.title + '</td>' +
          '<td><span class="badge-status ' + (d ? "done" : "pending") + '">' + (d ? "Đã đăng" : "Chưa") + '</span></td>';
        tbody.appendChild(tr);
      });
    }

    function updateStats() {
      var items = getItems();
      var total = items.length;
      var doneCount = 0;
      var pendingCount = 0;

      items.forEach(function(it) {
        if (isDone(it)) doneCount++;
        else pendingCount++;
      });

      document.getElementById("vCount").innerText = VIDEO_ITEMS.length;
      document.getElementById("iCount").innerText = IMAGE_ITEMS.length;

      document.getElementById("countPending").innerText = pendingCount;
      document.getElementById("countDone").innerText = doneCount;
      document.getElementById("countAll").innerText = total;

      var pct = total > 0 ? Math.round((doneCount / total) * 100) : 0;
      document.getElementById("statText").innerText = "Đã đăng: " + doneCount + " / " + total;
      document.getElementById("statPercent").innerText = pct + "%";
      document.getElementById("progressBar").style.width = pct + "%";
    }

    function copyText(txt, label) {
      if (!txt) {
        showToast("⚠️ Nội dung trống");
        return;
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(function() {
          showToast("✓ Đã sao chép: " + label);
        }).catch(function() {
          fallbackCopy(txt, label);
        });
      } else {
        fallbackCopy(txt, label);
      }
    }

    function fallbackCopy(txt, label) {
      var t = document.createElement("textarea");
      t.value = txt;
      t.style.position = "fixed";
      t.style.opacity = "0";
      document.body.appendChild(t);
      t.select();
      document.execCommand("copy");
      document.body.removeChild(t);
      showToast("✓ Đã sao chép: " + label);
    }

    function showToast(m) {
      var t = document.getElementById("toastMsg");
      t.innerText = m;
      t.style.display = "block";
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(function() { t.style.display = "none"; }, 1800);
    }

    function openLightbox(src) {
      document.getElementById("lightboxImg").src = src;
      document.getElementById("lightbox").style.display = "flex";
    }

    // KHỞI ĐỘNG MẶC ĐỊNH LÀ VIDEO & CHƯA ĐĂNG
    switchTab("video");
  </script>
</body>
</html>
