uongChiaSe #Me #GiaDinh #DaoLy #HieuThao","zalo":"Nửa đời mẹ vì con mà sống, dành hết bao dung để nuôi con thành người. Đừng đợi đến khi tuổi già làm còng lưng mẹ mới nhớ đến việc báo hiếu. Hãy dành lời chúc bình an và sự quan tâm chân thành nhất đến mẹ ngay lúc này nhé.\n\n#TruongChiaSe","instagram":"Dành hết dịu dàng cho con, giữ lại vất vả cho mình. Cảm ơn mẹ vì đã là mẹ của con. ✨🤍\n\n#TruongChiaSe #Me #Family #Gratitude #Healing","pinnedComment":"Đã bao lâu rồi bạn chưa nắm lấy đôi bàn tay gầy của mẹ? Hãy để lại một lời chúc bình an dành cho mẹ ở phía dưới nhé! Nếu bạn đang tìm kiếm những món quà chăm sóc sức khỏe ý nghĩa cho mẹ, mời bạn tham khảo tại link bio/giỏ hàng của mình.","affiliateSuggestions":"Máy massage cổ vai gáy\nThực phẩm bảo vệ sức khỏe Glucosamine hỗ trợ xương khớp\nMáy ngâm chân massage hồng ngoại\nSữa hạt dinh dưỡng dành cho người cao tuổi\nĐèn xông tinh dầu giúp ngủ ngon","productLink":""},{"stt":40,"category":"Trường Chia Sẻ","title":"Video 40","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1FG364ZcGQbCLQN_ifc21yWHEg3LVufeo/view?usp=drivesdk","youtubeTitle":"Đừng Cố Làm Hài Lòng Thiên Hạ: Bài Học Để Sống Một Đời Tự Tại | Truong Chia Se","youtubeDesc":"Cuộc đời mỗi người chỉ có một lần duy nhất. Đừng lãng phí thời gian để lấy lòng những kẻ không xứng đáng hay nhẫn nhịn những người khiến bạn khó chịu. Hãy học cách thiết lập giới hạn, sẵn sàng trở mặt khi cần thiết và đặt bản thân lên vị trí ưu tiên số một. Chúc bạn tìm thấy sự bình yên trong tâm hồn sau video này.\n\n#TruongChiaSe","tiktok":"Bạn có đang mệt mỏi vì cố gắng làm hài lòng tất cả mọi người? Đừng tự dằn vặt mình thêm nữa. Video này là dấu hiệu để bạn bắt đầu ưu tiên chính mình. Xem hết để biết cách đáp trả kẻ đểu cáng!\n\n#TruongChiaSe","facebook":"Sống cho mình, đừng sống cho người khác. Chân lý để đời giúp bạn bớt khổ.\n\n#TruongChiaSe #songchominh #daoly #baihoc #phattrienbanthan","zalo":"Gửi bạn, người luôn nỗ lực vì người khác: Đừng quên yêu thương chính mình nhé. Đôi khi biết từ chối và sống thật với cảm xúc mới là cách tốt nhất để bảo vệ bình yên cho chính mình. Chúc bạn một ngày nhẹ lòng!\n\n#TruongChiaSe","instagram":"Sống rực rỡ cho chính mình, không phải cho ánh nhìn của người khác. ✨\n\n#TruongChiaSe #minimalism #lifestyle #mindset #innerpeace","pinnedComment":"Bạn đã bao giờ cảm thấy kiệt sức vì cố gắng làm vừa lòng một ai đó chưa? Hãy chia sẻ câu chuyện của bạn phía dưới nhé! 👇 Đừng quên ghé link Bio/Giỏ hàng để tìm những công cụ giúp bạn chữa lành và yêu bản thân hơn mỗi ngày.","affiliateSuggestions":"Sách Dám Bị Ghét\nSách Yêu Mình Trước Đã, Yêu Đời Sẽ Theo Sau\nSách Nghệ Thuật Từ Chối\nSách Thiết Lập Giới Hạn\nSổ tay lập kế hoạch 6 phút mỗi ngày","productLink":""},{"stt":41,"category":"Trường Chia Sẻ","title":"Video 41","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1ATc0QFcsQmM7Q8pRcS9alb9C2wBZUXjS/view?usp=drivesdk","youtubeTitle":"Sự Thật Phũ Phàng: Đàn Ông Không Có Tiền Và Cái Kết | Bài Học Nhân Sinh Đắt Giá","youtubeDesc":"Trong thế giới này, thực tế đôi khi rất tàn nhẫn. Khi đàn ông không có tiền, họ mất đi sự ủng hộ. Nhưng gốc rễ của cái nghèo đôi khi không nằm ở túi tiền, mà ở việc họ bỏ quên chính mình. Hãy cùng chiêm nghiệm bài học sâu sắc này để thay đổi tư duy và làm chủ cuộc đời. Đừng quên đăng ký kênh và thương thảo dưới bình luận nhé!\n\n#TruongChiaSe","tiktok":"Tại sao đàn ông nghèo thường bị bỏ rơi? Sự thật phũ phàng về đồng tiền trong tình yêu mà ai cũng phải thấu. Xem hết video này để nhận ra sai lầm lớn nhất của phái mạnh nhé!\n\n#TruongChiaSe","facebook":"Nghèo không đáng sợ, đáng sợ là không biết thương lấy mình. Đừng để tiền bạc làm mờ đi giá trị bản thân.\n\n#TruongChiaSe #DaoLy #NhanSinh #BaiHoc #CuocSong","zalo":"Gửi những người đang nỗ lực ngoài kia, tiền bạc quan trọng nhưng đừng quên trân trọng chính mình trước tiên. Chúc bạn luôn vững vàng và sớm tìm thấy sự an yên trong tâm hồn.\n\n#TruongChiaSe","instagram":"Giá trị của một người không nằm ở ví tiền, mà ở cách họ biết yêu thương và trân trọng bản thân. ✨\n\n#TruongChiaSe #LifeLessons #Mindset #SelfLove #NhanSinh","pinnedComment":"Bạn nghĩ sao về sự khác biệt này giữa nam và nữ trong tình yêu? Liệu đồng tiền có phải là thước đo duy nhất? Hãy chia sẻ góc nhìn của bạn bên dưới nhé! Tham khảo thêm những món đồ giúp bạn nâng tầm giá trị bản thân tại link bio/giỏ hàng nha.","affiliateSuggestions":"Sách Đàn Ông Sao Hỏa Đàn Bà Sao Kim\nSách Tư Duy Ngược - Nguyễn Anh Dũng\nSách Hiểu Về Trái Tim - Minh Niệm\nSách Đọc Vị Bất Kỳ Ai - David J. Lieberman\nVí Da Nam Cầm Tay Cao Cấp","productLink":""},{"stt":42,"category":"Trường Chia Sẻ","title":"Video 42","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/19f8oRrFmQUvixB69XLTfa0VKwjBH4Jnn/view?usp=drivesdk","youtubeTitle":"Tình Mẹ Là Cuộc Chia Ly Dần Xa | Bài Học Nhân Sinh Cảm Động | Truong Chia Se","youtubeDesc":"Mọi tình yêu trên đời đều hướng đến sự sum vầy, chỉ có tình mẹ là luôn hướng về sự chia xa. Từ lần cắt dây rốn đầu tiên đến khi con bước vào trường học, mỗi bước con đi là một lần mẹ đứng lại nhìn theo. Chúng ta dùng cả đời để nói lời tạm biệt, còn mẹ dùng cả đời để dặn dò con cẩn thận. Hãy trân trọng từng phút giây bên mẹ khi còn có thể. Đăng ký kênh để nhận thêm nhiều bài học ý nghĩa về cuộc sống.\n\n#TruongChiaSe","tiktok":"Bạn có biết, tình mẹ thực chất là một cuộc chia ly kéo dài suốt đời không? Từ lúc cắt dây rốn đến khi bạn trưởng thành, mẹ luôn là người đứng sau nhìn bạn xa dần. Đừng để đến khi quá muộn mới nhận ra sự hy sinh thầm lặng đó. Xem hết video này để thấy mình còn may mắn đến nhường nào khi còn mẹ bên cạnh.\n\n#TruongChiaSe","facebook":"Mọi tình yêu là để gần lại, riêng tình mẹ là để xa dần. Hãy trân trọng khi mẹ còn ở bên.\n\n#TruongChiaSe #TinhMe #GiaDinh #DaoLy #SongDep","zalo":"Con càng lớn khôn, mẹ càng già đi. Mỗi bước chân ta đi xa là một lần mẹ đứng lại thầm lặng nhìn theo. Gửi đoạn video này đến người thân yêu để cùng nhắc nhở nhau: Hãy yêu thương và trân trọng mẹ mỗi ngày, đừng đợi đến lúc chia xa mới hối tiếc.\n\n#TruongChiaSe","instagram":"Tình mẹ là cuộc chia ly dịu dàng nhất. Cả đời mẹ là những lần tiễn bước chân con đi xa. 🤍\n\n#TruongChiaSe #Mom #Healing #LifeLessons #GiaDinh","pinnedComment":"Lần cuối cùng bạn ôm mẹ hay nói lời cảm ơn là khi nào? Hãy chia sẻ cảm xúc của bạn xuống phía dưới nhé. Đừng quên ghé thăm giỏ hàng của mình để chọn những món quà sức khỏe ý nghĩa dành tặng mẹ ngay hôm nay! 👇","affiliateSuggestions":"Máy massage cổ vai gáy hồng ngoại\nThực phẩm chức năng Glucosamine hỗ trợ xương khớp\nSách Cho Tôi Xin Một Vé Đi Tuổi Thơ\nTrà thảo mộc ngũ cốc tâm sen dưỡng tâm an thần\nMáy đo huyết áp điện tử Microlife","productLink":""},{"stt":43,"category":"Trường Chia Sẻ","title":"Video 43","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1u81Y8uRJlBiUKuMFXrQ4NzGEOxfE5il7/view?usp=drivesdk","youtubeTitle":"Nghệ Thuật Im Lặng & 10 Bài Học Vàng Để Tu Dưỡng Khẩu Đức | Truong Chia Se","youtubeDesc":"Càng trưởng thành, chúng ta càng nhận ra rằng im lặng không phải là yếu đuối, mà là sự tu dưỡng cao nhất của một người bản lĩnh. Video hôm nay chia sẻ về lộ trình rèn luyện tâm tính: từ việc học cách một mình để nuôi dưỡng tinh thần đến việc dựa vào chính mình để đạt 100% thành công. Hãy cùng Truong Chia Se chiêm nghiệm và áp dụng để cuộc sống bớt thị phi, thêm vững chãi.\n\n#TruongChiaSe","tiktok":"Bạn có biết tại sao càng nói nhiều, vận may càng dễ mất đi không? 🤫 Video này sẽ tiết lộ công thức 'phần trăm' bí mật để bạn làm chủ cuộc đời, từ việc giữ im lặng đến sự kỷ luật sắt đá. Đừng bỏ lỡ giây cuối cùng nếu bạn muốn nắm chắc 100% phần thắng trong tay. Xem ngay để thay đổi nhé!\n\n#TruongChiaSe","facebook":"Càng im lặng, nội lực càng mạnh mẽ. Bạn đã nắm giữ được bao nhiêu % chiến thắng cuộc đời?\n\n#TruongChiaSe #imlang #khenngoi #baihoccuocsong #phattrienbanthan","zalo":"Gửi bạn lời nhắc nhở nhẹ nhàng cho ngày hôm nay: Đôi khi im lặng là vàng, tự lập là kim cương. Hãy dành thời gian quay về bên trong, rèn luyện kỷ luật và sự quyết đoán để cuộc sống thêm phần bình yên và vững vàng bạn nhé. Chúc bạn một đời an nhiên!\n\n#TruongChiaSe","instagram":"Im lặng để thấu hiểu, kỷ luật để tự do. Hành trình 100% làm chủ cuộc đời bắt đầu từ chính bản lĩnh của bạn. ✨\n\n#TruongChiaSe #Mindset #Silence #Growth #LifeLessons","pinnedComment":"Trong 10 điều trên, bạn thấy điều nào là khó thực hiện nhất với bản thân mình? Hãy cùng thảo luận bên dưới nhé! Và đừng quên ghé thăm link bio/giỏ hàng để chọn những công cụ hỗ trợ bạn rèn luyện kỷ luật và nuôi dưỡng tinh thần mỗi ngày nha! 👇","affiliateSuggestions":"Sách Khéo Ăn Nói Sẽ Có Được Thiên Hạ\nSổ Tay Lập Kế Hoạch Daily Planner\nTai Nghe Chống Ồn Bluetooth\nMáy Xông Tinh Dầu Phun Sương\nĐồng Hồ Bấm Giờ Pomodoro","productLink":""},{"stt":44,"category":"Trường Chia Sẻ","title":"Video 44","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/16zkBwgc_MIzQ4KDzYoyrwzaMExTqnnRq/view?usp=drivesdk","youtubeTitle":"4 Sai Lầm Nguy Hại Khiến Con Cố Gắng Mấy Cũng Trở Nên Vô Dụng | Truong Chia Se","youtubeDesc":"Thành tích học tập không chỉ nằm ở trí thông minh mà còn nằm ở thói quen hàng ngày. Video này sẽ chỉ ra 4 lỗi sai nghiêm trọng mà nếu không sửa đổi, trẻ sẽ khó lòng thành công trong tương lai: từ sự trì hoãn đến việc chìm đắm vào internet. Hãy cùng khám phá bài học đắt giá từ tỷ phú Rockefeller để trang bị hành trang vững chắc nhất cho con bước vào đời.\n\n#TruongChiaSe","tiktok":"Bạn có biết 4 thói quen đang âm thầm 'giết chết' tương lai của con mình không? Đừng để sự thông minh bị lãng phí bởi điện thoại và sự trì hoãn. Xem hết video này để biết cách cứu vãn tương lai của con trước khi quá muộn nhé!\n\n#TruongChiaSe","facebook":"Đừng để 4 thói quen này hủy hoại tương lai của con, dù con có thông minh đến mấy. Hãy tỉnh táo để uốn nắn kịp thời!\n\n#TruongChiaSe #daycon #kynang #baihoc #phattrien","zalo":"Gửi các bậc phụ huynh, dạy con thành người khó hơn dạy con thành tài. Hãy giúp con tránh xa 4 thói quen nguy hại này để tương lai con rộng mở hơn. Chia sẻ video này để cùng nhau nuôi dạy những đứa trẻ tự giác và bản lĩnh nhé!\n\n#TruongChiaSe","instagram":"Kỷ luật là nền tảng của thành công. Đừng để những thói quen lười nhác lấy đi tương lai rạng rỡ của con trẻ. ✨\n\n#TruongChiaSe #parenting #discipline #growth #family","pinnedComment":"Trong 4 sai lầm này, bạn thấy con trẻ hiện nay dễ mắc phải lỗi nào nhất? Hãy cùng thảo luận bên dưới nhé! Các bậc phụ huynh đừng quên tham khảo cuốn 38 lá thư của Rockefeller ở giỏ hàng để có thêm bí kíp dạy con nha 👇","affiliateSuggestions":"38 Lá Thư Rockefeller Gửi Cho Con Trai\nVô Cùng Tàn Nhẫn Vô Cùng Yêu Thương\nKỷ Luật Không Nước Mắt\nRèn Luyện Tính Tự Giác Cho Trẻ\nDạy Con Làm Giàu (Tập 1)","productLink":""},{"stt":45,"category":"Trường Chia Sẻ","title":"Video 45","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1Nd9XpEm3E2dV6XfE2KjTioHtOoW8dJ78/view?usp=drivesdk","youtubeTitle":"Đàn Ông Mệt, Nhưng Phụ Nữ Không Có Lựa Chọn Khác | Bài Học Hôn Nhôn","youtubeDesc":"Trong hôn nhân, sự mệt mỏi thường được đem ra so sánh, nhưng ít ai thấu hiểu cho nỗi vất vả không tên của người phụ nữ. Đàn ông có thể chọn cách nghỉ ngơi sau giờ làm, còn phụ nữ thường không có lựa chọn nào khác ngoài việc tiếp tục lo toan việc nhà và con cái. Hy vọng video này giúp những người chồng biết trân trọng và sẻ chia hơn với người bạn đời của mình.\n\n#TruongChiaSe #BaiHocCuocDoi #HonNhanGiaDinh","tiktok":"Bạn nói bạn mệt, vậy cô ấy có được nghỉ ngơi không? Đàn ông tan làm là nghỉ ngơi, phụ nữ tan làm là bắt đầu 'ca hai'. Nếu bạn vẫn lướt điện thoại khi vợ đang vất vả, hãy xem hết video này để tỉnh ngộ.\n\n#TruongChiaSe #GiaDinh #HonNhan #ThauHieu","facebook":"Anh mệt, nhưng cô ấy cũng không hề rảnh tay. Đừng để sự vô tâm làm nguội lạnh mái ấm.\n\n#TruongChiaSe #HonNhan #GiaDinh #ThauHieu #CuocSong","zalo":"Hôn nhân không phải là nơi để so bì ai mệt hơn, mà là nơi để nâng đỡ nhau lúc mỏi mệt. Chúc bạn luôn biết trân trọng và sẻ chia cùng người đồng hành của mình để tổ ấm luôn trọn vẹn.\n\n#TruongChiaSe","instagram":"Thấu hiểu là chìa khóa của hạnh phúc. Đừng để sự vô tâm làm rạn nứt một mái ấm vốn dĩ rất cần sự sẻ chia. ✨\n\n#TruongChiaSe #Mindfulness #LifeLessons #FamilyFirst #HonNhan","pinnedComment":"Theo bạn, sự vô tâm hay áp lực cơm áo gạo tiền là thứ dễ làm tan vỡ hôn nhân nhất? Hãy cùng thảo luận nhé! Đừng quên ghé link bio để tìm những món quà ý nghĩa thay lời cảm ơn gửi đến người phụ nữ của bạn.","affiliateSuggestions":"Robot hút bụi lau nhà thông minh\nSách 5 Ngôn Ngữ Tình Yêu của Gary Chapman\nMáy massage cổ vai gáy giảm căng thẳng\nNến thơm tinh dầu thư giãn phòng ngủ\nSách Đàn Ông Đến Từ Sao Hỏa Đàn Bà Đến Từ Sao Kim","productLink":""},{"stt":46,"category":"Trường Chia Sẻ","title":"Video 46","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1o_rWfW2UVODEfCft0TmuW3HrhMJC4xxk/view?usp=drivesdk","youtubeTitle":"Cách đối diện với kẻ nói xấu sau lưng: Bài học bản lĩnh để sống kiêu hãnh | Truong Chia Se","youtubeDesc":"Kẻ vô dụng thường dùng lời nói xấu để tìm kiếm cảm giác chiến thắng ảo. Khi bạn bị kẻ khác âm thầm nói xấu, điều đó chứng tỏ bạn đang sở hữu những giá trị mà họ khao khát nhưng không có được. Đừng để tâm hồn mình bị vẩn đục bởi sự nhỏ nhen của người khác. Hãy cùng Truong Chia Se chiêm nghiệm về nghệ thuật phớt lờ và sống cuộc đời rực rỡ nhất của chính mình.\n\n#TruongChiaSe #BaiHocNhanSinh #PhatTrienBanThan","tiktok":"Bạn có biết vì sao họ luôn nói xấu sau lưng bạn không? Vì đơn giản là họ không thể theo kịp bạn! Đừng tức giận, hãy xem hết video này để biết cách biến sự ghen tị của kẻ khác thành động lực tận hưởng cuộc sống của chính mình. Xem ngay kẻo lỡ bài học đắt giá này nhé!\n\n#TruongChiaSe","facebook":"Bị nói xấu sau lưng? Đó là lúc bạn nên mỉm cười vì bạn đang dẫn đầu.\n\n#TruongChiaSe #BaiHocCuocDoi #PhatTrienBanThan #SongHanhPhuc #TuDuy","zalo":"Gửi tặng bạn lời nhắn nhủ: Đừng để lời nói của kẻ khác làm mất đi sự bình yên trong tâm hồn mình. Nếu ai đó nói xấu sau lưng, hãy cứ mỉm cười và bước tiếp thật rạng rỡ. Sự thành công của bạn chính là câu trả lời tốt nhất. Chúc bạn luôn an nhiên!\n\n#TruongChiaSe","instagram":"Kẻ đứng sau chỉ nhìn thấy lưng của người dẫn đầu. Hãy tận hưởng sự ghen tị của họ như một lời khen gián tiếp cho giá trị của bạn. ✨\n.\n\n#TruongChiaSe #Mindset #Growth #LifeLessons #Peace","pinnedComment":"Bạn đã bao giờ 'cảm ơn' những kẻ nói xấu mình vì đã giúp bạn nhận ra mình tuyệt vời thế nào chưa? Chia sẻ câu chuyện của bạn bên dưới nhé! Đừng quên ghé link bio để chọn những cuốn sách rèn luyện bản lĩnh và tư duy vượt trội.","affiliateSuggestions":"Sách Đắc Nhân Tâm - Dale Carnegie\nSách Khéo Ăn Khéo Nói Sẽ Có Được Thiên Hạ - Trác Nhã\nSách Tư Duy Ngược - Nguyễn Anh Dũng\nSách Không Diệt Không Sinh Đừng Sợ Hãi - Thích Nhất Hạnh\nSách Càng Kỷ Luật Càng Tự Do - Ca Tây","productLink":""},{"stt":47,"category":"Trường Chia Sẻ","title":"Video 47","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1wxPGGv6gfSSRVQsHd_ZDouE_GVIVMhkh/view?usp=drivesdk","youtubeTitle":"Tiêu Chuẩn Kép Của Cha Mẹ: Khi Sự Thấu Hiểu Bị Bỏ Quên | Truong Chia Se","youtubeDesc":"Chúng ta thường đòi hỏi con cái phải hoàn hảo, trong khi chính mình cũng đầy khiếm khuyết. Người lớn đi làm về lướt điện thoại thì gọi là thư giãn, trẻ con đi học về xem TV lại bị coi là ham chơi. Một xã hội chỉ trọng điểm số đã vô tình khiến những đứa trẻ không có thành tích cao cảm thấy sự tồn tại của mình là sai trái. Hãy cùng Truong Chia Se nhìn nhận lại sự bình đẳng và lòng thấu hiểu trong gia đình qua video này.\n\n#TruongChiaSe #baihoccuocdoi #nuoidaycon #tamly","tiktok":"Tại sao bạn được nằm lướt điện thoại, còn con bạn xem TV lại là sai? Chúng ta thường nhân danh áp lực để bao biện cho mình, nhưng lại dùng điểm số để ép buộc con cái. Video này sẽ khiến bạn phải giật mình nhìn lại cách đối xử với con bấy lâu nay. Đừng để sự mệt mỏi của mình trở thành gánh nặng của trẻ. Hãy xem hết để thấu hiểu và thay đổi nhé!\n\n#TruongChiaSe","facebook":"Bạn được mệt, nhưng trẻ con thì không? Đừng lấy quyền làm cha mẹ để áp đặt sự bất công lên con trẻ.\n\n#TruongChiaSe #daycon #giadinh #nuoidaycon #baihoccuocdoi","zalo":"Gửi những người làm cha mẹ: Đôi khi chúng ta quá khắt khe với con mà quên mất mình cũng từng là một đứa trẻ. Đừng để tiêu chuẩn thay đổi theo tâm trạng của mình. Hãy yêu thương con bằng sự bình đẳng và thấu hiểu chân thành nhất.\n\n#TruongChiaSe","instagram":"Góc nhìn bình đẳng là chìa khóa của sự thấu hiểu. Đừng để tâm trạng cá nhân định nghĩa tiêu chuẩn đúng sai đối với con trẻ. ✨\n.\n\n#TruongChiaSe #parenting #healing #family #mindset","pinnedComment":"Bạn đã bao giờ vô tình trút giận lên con chỉ vì mình đang mệt chưa? Hãy cùng chia sẻ góc nhìn của bạn nhé. Nếu muốn tìm những công cụ giúp thấu hiểu tâm lý con trẻ và cân bằng cảm xúc, mời bạn tham khảo tại link bio/giỏ hàng của mình nhé!","affiliateSuggestions":"Sách Vô cùng tàn nhẫn vô cùng yêu thương\nSách Nuôi con không phải là cuộc chiến\nSách Cha mẹ am hiểu con phi thường\nSách Yêu thương thôi chưa đủ\nSách Hiểu về trái tim","productLink":""},{"stt":48,"category":"Trường Chia Sẻ","title":"Video 48","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1_ehk0-tn8Dts38JzLK26dyNwmQshs-Ii/view?usp=drivesdk","youtubeTitle":"Nỗi Lòng Đàn Ông: Tại Sao Họ Thường Đứng Lặng Trước Cửa Nhà? | Bài Học Cuộc Đời","youtubeDesc":"Đời người đàn ông, thân thể thuộc về cha mẹ, trái tim thuộc về vợ, thời gian thuộc về sếp và tiền bạc dành cho con cái. Liệu có phút giây nào họ thực sự sống cho riêng mình? Video này gửi gắm sự thấu hiểu sâu sắc dành cho những người trụ cột đang gồng gánh cả thế giới trên vai. Hãy cùng lắng lại để trân trọng những hy sinh thầm lặng ấy.\n\n#TruongChiaSe","tiktok":"Tại sao đàn ông thường đứng trước cửa nhà rất lâu trước khi vào? Đằng sau điếu thuốc là một gánh nặng không tên. Xem hết video này để thấu hiểu người đàn ông của bạn hơn nhé!\n\n#TruongChiaSe","facebook":"Đàn ông cả đời làm công cho gia đình, nhưng mấy ai thực sự thấu hiểu nỗi lòng họ? Đừng để sự im lặng làm xa cách.\n\n#TruongChiaSe #danong #thauhieu #giadinh #cuocsong","zalo":"Gửi những người đàn ông đang nỗ lực mỗi ngày: Bạn đã vất vả rồi. Đàn ông cũng cần một điểm tựa, đừng chỉ mải mê làm chỗ dựa cho người khác mà quên đi chính mình. Mong mọi gia đình luôn thấu hiểu nhau.\n\n#TruongChiaSe","instagram":"Ranh giới giữa lý tưởng và hiện thực đôi khi chỉ là một cánh cửa. Thấu hiểu để yêu thương nhiều hơn.\n\n#TruongChiaSe #danong #trietly #cuocsong #mensworld","pinnedComment":"Bạn đã bao giờ thấy người đàn ông của mình đứng lặng thinh trước hiên nhà chưa? Hãy chia sẻ cảm xúc của bạn nhé. Nếu muốn hiểu hơn về tâm lý đối phương, mời bạn tham khảo cuốn sách ở giỏ hàng nha!","affiliateSuggestions":"Tâm Lý Đàn Bà Lý Trí Đàn Ông\nĐàn Ông Sao Hỏa Đàn Bà Sao Kim\nHiểu Về Trái Tim\n5 Ngôn Ngữ Yêu Thương\nNghệ Thuật Thấu Hiểu Tâm Lý","productLink":""},{"stt":49,"category":"Trường Chia Sẻ","title":"Video 49","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1rzUznLoLJkjQu_6hxzfdHNHIBVjK-Emq/view?usp=drivesdk","youtubeTitle":"Nỗi Đau Lớn Nhất Đời Người Không Phải Là Ly Biệt | Bài Học Nhân Sinh Sâu Sắc","youtubeDesc":"Khoảnh khắc mất đi một người chỉ diễn ra trong giây lát, nhưng nỗi nhớ về họ lại kéo dài cả một đời. Những nơi quen thuộc vẫn còn đó, nhưng người xưa nay đã ở một thế giới khác vĩnh viễn không thể chạm tới. Video này dành cho những ai đang mang trong mình một nỗi nhớ không tên, để chúng ta biết trân trọng hơn những người đang còn ở bên cạnh mình khi còn có thể. Đừng để lớp đất mỏng trở thành ranh giới không thể vượt qua.\n\n#TruongChiaSe #TrietLyCuocSong #YNghiaCuocSong #BaiHocCuocDoi #GiaDinh","tiktok":"Nếu được gặp lại một người đã khuất, bạn sẽ nói gì? Nỗi đau lớn nhất không phải là lúc họ rời đi, mà là những ngày tháng sau này nhìn đâu cũng thấy bóng dáng ấy. Đừng để đến lúc âm dương cách biệt mới thấy hối tiếc. Xem hết video để thấu hiểu giá trị của sự hiện diện.\n\n#TruongChiaSe #TamTrang #NhanSinh #TrietLy #NoiNho","facebook":"Khoảnh khắc đau nhất không phải là lúc biệt ly, mà là nỗi nhớ dai dẳng sau này. Bạn đang nhớ ai?\n\n#TruongChiaSe #NoiNho #BaiHocCuocDoi #TrietLy #SongCham","zalo":"Cuộc đời vô thường, có những lần biệt ly là vĩnh viễn. Đừng để đến lúc chỉ còn nhìn thấy nhau qua một lớp đất mỏng mới thấy hối tiếc. Hãy dành thời gian cho người thân yêu khi còn có thể, gửi lời yêu thương ngay hôm nay bạn nhé!\n\n#TruongChiaSe","instagram":"Người ngủ yên dưới tấc đất, người nhớ nhung suốt một đời dài. Khoảng cách xa nhất chính là âm dương cách biệt. 🥀\n\n#TruongChiaSe #Healing #Quotes #Life #Memories #NhanSinh","pinnedComment":"Nếu có 1 phút để gửi lời nhắn đến người ấy, bạn sẽ nói điều gì? Chia sẻ cùng Trường ở bên dưới nhé. Tham khảo những món quà tinh thần ý nghĩa để trân trọng người thương tại link bio/giỏ hàng của mình nha! 👇","affiliateSuggestions":"Sách Muôn Kiếp Nhân Sinh - Nguyên Phong\nSách Kiếp Nào Ta Cũng Tìm Thấy Nhau - Brian Weiss\nSách Hành Trình Về Phương Đông - Nguyên Phong\nSổ tay ghi chép nhật ký biết ơn\nNến thơm tinh dầu thư giãn tự nhiên","productLink":""},{"stt":50,"category":"Trường Chia Sẻ","title":"Video 50","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1okfvJtvy5Swzzkuw5yTVyj4P_PeurUnT/view?usp=drivesdk","youtubeTitle":"Cách Từ Chối Cho Vay Tiền Khéo Léo: Đừng Để Sự Cả Nể Hủy Hoại Bạn | Truong Chia Se","youtubeDesc":"Bạn cảm thấy khó xử khi người quen hỏi vay tiền? Sự lương thiện của bạn cần có \"gai\" để bảo vệ chính mình. Video này chia sẻ nghệ thuật từ chối tinh tế nhưng quyết đoán, giúp bạn giữ được tiền và giữ được cả sự tôn nghiêm. Hãy nhớ: Bạn không có nghĩa vụ phải làm hài lòng tất cả mọi người.\n\n#TruongChiaSe #Kỹ_Năng_Sống #Tài_Chính","tiktok":"Bạn có đang \"nuôi\" kẻ vô ơn bằng sự nể nang của mình không? Giúp 10 lần không ai nhớ, từ chối 1 lần cả thế giới hay. Đừng để sự lương thiện bị lợi dụng. Xem hết video này để biết cách nói \"Không\" mà không sợ mất lòng nhé!\n\n#TruongChiaSe #VayTien #GiaoTiep #TamLy #SongChat","facebook":"Càng nể nang, càng dễ mất tiền và mất luôn cả bạn. Hãy học cách đặt giới hạn cho sự lương thiện của mình.\n\n#TruongChiaSe #TuChoi #KyNang #GiaoTiep #TamLy","zalo":"Đôi khi lời từ chối đúng lúc lại là cách bảo vệ tình bạn tốt nhất. Đừng quá khắt khe với bản thân, hãy học cách nói không khi cảm thấy không thoải mái. Chúc bạn luôn bình yên và quyết đoán!\n\n#TruongChiaSe","instagram":"Kindness with thorns. 🌹 Sự lương thiện phải đi kèm với ranh giới rõ ràng. Đừng để sự mềm lòng làm khổ chính mình.\n\n#TruongChiaSe #SelfLove #Boundaries #Mindset #LifeQuotes","pinnedComment":"Bạn đã từng vì nể mà cho vay rồi mất luôn cả bạn chưa? Chia sẻ câu chuyện của bạn bên dưới nhé! 👇 Để nâng cao kỹ năng giao tiếp và bảo vệ ranh giới cá nhân, hãy tham khảo các đầu sách tại link bio/giỏ hàng của mình nhé! #TruongChiaSe","affiliateSuggestions":"Sách Khéo Ăn Khéo Nói Sẽ Có Được Thiên Hạ\nSách Nghệ Thuật Từ Chối\nSách Thiết Lập Ranh Giới\nSách Lòng Tốt Của Bạn Cần Thêm Đôi Phần Sắc Sảo\nSách Tâm Lý Học Về Tiền","productLink":""},{"stt":51,"category":"Trường Chia Sẻ","title":"Video 51","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/10fW3gU1sGbFeFEvWftvKCZbMCCzZvy09/view?usp=drivesdk","youtubeTitle":"Đừng Đợi Cuộc Đời 'Vả' Mới Học Cách Cư Xử Với Bố Mẹ | Bài Học Đắt Giá","youtubeDesc":"Một người dám quát bố mẹ ở nhà, ra ngoài xã hội chắc chắn sẽ bị đời quát lại. Thái độ quan trọng hơn trình độ, và thái độ bắt đầu từ chính cách cư xử trong gia đình. Đừng để sự dung túng ở nhà biến bạn thành kẻ thất bại ngoài xã hội. Hãy học cách hạ giọng để bảo vệ tương lai của chính mình.\n\n#TruongChiaSe","tiktok":"Bạn nghĩ mình mạnh mẽ khi quát lại bố mẹ? Lầm to rồi! Ra đời, không ai nhịn bạn như gia đình đâu. Một lần người ta nhịn, ba lần người ta 'xử'. Xem hết video để thấy cái giá phải trả khi mang cái tôi sai chỗ nhé!\n\n#TruongChiaSe","facebook":"Quát bố mẹ không phải bản lĩnh, đó là thói quen nguy hiểm. Đừng để đời dạy bạn bằng những cú tát đau đớn.\n\n#TruongChiaSe #GiaDinh #DaoDuc #PhatTrienBanThan #BaiHocCuocDoi","zalo":"Gửi những người trẻ đang nỗ lực khẳng định mình: Ở nhà bố mẹ có thể nhường, nhưng ra đời chẳng ai có nghĩa vụ phải chịu đựng cái tôi của mình. Học cách giữ lễ với người thân là hành trang lớn nhất để thành công. Chúc bạn luôn tỉnh táo để rèn mình mỗi ngày.\n\n#TruongChiaSe","instagram":"Bản lĩnh không nằm ở âm lượng giọng nói, mà ở cách bạn kiềm chế cảm xúc trước người thân yêu. Đừng để thói quen xấu hủy hoại tương lai. ✨\n\n#TruongChiaSe #Mindset #LifeLessons #Rockefeller #Growth","pinnedComment":"Theo bạn, thái độ với bố mẹ ảnh hưởng thế nào đến sự nghiệp sau này? Chia sẻ góc nhìn bên dưới nhé! 👇 Để rèn luyện tư duy và sự đối đãi tinh tế như những người thành công, đừng bỏ lỡ cuốn sách Rockefeller nhắn nhủ con trai ở giỏ hàng.","affiliateSuggestions":"Sách 38 Lá Thư Rockefeller Gửi Cho Con Trai\nSách Đắc Nhân Tâm - Dale Carnegie\nSách Khéo Ăn Nói Sẽ Có Được Thiên Hạ\nSách Hiểu Về Trái Tim - Minh Niệm\nSách Cổ Học Tinh Hoa","productLink":""},{"stt":52,"category":"Trường Chia Sẻ","title":"Video 52","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1srGNbmx75Z9T1pergDsINOM4ZElYjhMp/view?usp=drivesdk","youtubeTitle":"Kẻ Bản Lĩnh Chọn Thực Lực, Kẻ Yếu Hèn Chọn Thủ Đoạn | Bài Học Cuộc Đời Sâu Sắc","youtubeDesc":"Người khôn ngoan chưa bao giờ sống bằng cách hãm hại người khác. Video hôm nay chia sẻ về triết lý sống chính trực: Tại sao những người có tầm nhìn hạn hẹp thường dùng thủ đoạn với người thân cận, và tại sao thực lực mới là chìa khóa duy nhất để đứng vững ở đỉnh cao. Hãy cùng suy ngẫm để nâng tầm khí chất bản thân và tránh xa những cạm bẫy của sự tầm thường.\n\n#TruongChiaSe #PhatTrienBanThan #BaiHocCuocDoi #SongChinhTruc","tiktok":"Tại sao kẻ kém cỏi luôn thích giở trò với người thân cận? Thật ra, người có bản lĩnh thật sự không bao giờ chọn đường ngang lối tắt. Xem hết video để hiểu lý do vì sao 'tâm hại người' chính là rào cản lớn nhất của sự thành công bền vững.\n\n#TruongChiaSe #BaiHocCuocDoi #PhatTrienBanThan #TriTue #TikTokGiaiTri","facebook":"Kẻ thực lực sống bằng bản lĩnh, kẻ yếu hèn dựa vào mưu mô. Đừng để thủ đoạn đánh mất khí chất.\n\n#TruongChiaSe #DaoLy #BaiHoc #TriTue #Song","zalo":"Gửi bạn lời nhắc nhở chân thành: Người có bản lĩnh thật sự sẽ dùng năng lực để khẳng định mình, chứ không dùng thủ đoạn để hạ thấp người khác. Chúc bạn luôn giữ được tâm sáng và khí chất kiên cường trên hành trình của mình.\n\n#TruongChiaSe #LoiChuc #SongDep #TriTue","instagram":"Khí chất được tôi luyện từ thực lực, không phải từ những mưu mô hèn kém. ✨\n\n#TruongChiaSe #Wisdom #Mindset #Lifestyle #Inspiration","pinnedComment":"Theo bạn, điều gì tạo nên khí chất của một người thành công: Thực lực hay Mưu mô? Chia sẻ góc nhìn của bạn nhé! Đừng quên rèn luyện tư duy và bản lĩnh mỗi ngày qua danh sách sản phẩm gợi ý ở link bio/giỏ hàng của mình nhé! 👇","affiliateSuggestions":"Sách Đắc Nhân Tâm - Dale Carnegie\nSách Hiểu Về Trái Tim - Minh Niệm\nSách Cổ Học Tinh Hoa - Nguyễn Văn Ngọc\nSách Tư Duy Ngược - Nguyễn Anh Dũng\nSổ tay ghi chép Focus Planner rèn luyện tính kỷ luật","productLink":""},{"stt":53,"category":"Trường Chia Sẻ","title":"Video 53","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1oV60XKb8-aYQ3ZWWiKV0OeMQY2_PjIEk/view?usp=drivesdk","youtubeTitle":"Đừng Để Sự An Nhàn Giết Chết Bạn - Bài Học Cảnh Tỉnh Từ Con Sói Trên Băng | Truong Chia Se","youtubeDesc":"Bạn đang tận hưởng sự thoải mái hay đang dần tự đánh mất chính mình? Câu chuyện về con sói liếm máu trên lưỡi dao giữa trời tuyết lạnh là lời cảnh tỉnh đắt giá cho bất kỳ ai đang ngủ quên trong vùng an toàn. Đừng để đến lúc kiệt quệ mới nhận ra cái giá của sự an nhàn. Hãy cùng Truong Chia Se suy ngẫm và tìm lại động lực bứt phá ngay hôm nay!\n\n#TruongChiaSe #daoly #nhansinh #phattrienbanthan #dongluc","tiktok":"Bạn có biết điều gì hủy hoại một người nhanh nhất không? Không phải khó khăn, mà chính là sự thoải mái quá mức. Câu chuyện về con sói và lưỡi dao tuyết này sẽ khiến bạn phải giật mình tỉnh ngộ. Đừng để đến lúc gục ngã mới nhận ra sự thật. Hãy xem hết video để thấy mình trong đó!     -tinh\n\n#TruongChiaSe #baihoccuocdoi #phattrienbanthan #dongluc #thuc","facebook":"Sự an nhàn là liều thuốc độc bọc đường. Đừng để vùng an toàn giết chết tương lai của bạn.\n\n#TruongChiaSe #baihoccuocdoi #phattrienbanthan #dongluc #thaydoi","zalo":"Gửi bạn, đôi khi sự thuận lợi quá mức lại là một cái bẫy êm ái. Đừng mải mê với những điều dễ dàng mà quên mất việc rèn luyện bản thân mỗi ngày. Mong bạn luôn tỉnh táo và vững vàng trên hành trình phía trước. Thương gửi!\n\n#TruongChiaSe","instagram":"Vùng an toàn là một nơi tuyệt đẹp, nhưng chẳng có gì lớn lên ở đó cả. Đừng để sự thoải mái ru ngủ ý chí của bạn. ❄️✨\n\n#TruongChiaSe #mindset #growth #wisdom #lifelessons #phattrienbanthan","pinnedComment":"Theo bạn, làm sao để nhận ra mình đang rơi vào cái bẫy của sự 'an nhàn'? Chia sẻ góc nhìn của bạn bên dưới nhé! Nếu muốn tìm thêm công cụ và tri thức để bứt phá giới hạn, đừng quên ghé link Bio/Giỏ hàng của mình nha! 👇","affiliateSuggestions":"Sách Đừng lựa chọn an nhàn khi còn trẻ - Cảnh Thiên\nSách Kỷ luật tự giác - Brian Tracy\nSách Atomic Habits - Thay đổi tí hon hiệu quả bất ngờ\nSổ tay lập kế hoạch Daily Planner\nĐồng hồ Pomodoro hỗ trợ tập trung","productLink":""},{"stt":54,"category":"Trường Chia Sẻ","title":"Video 54","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1ft5L6IIff-p5NxXk1zPiXfGeYOPxLMCI/view?usp=drivesdk","youtubeTitle":"3 Bước Xử Lý Khi Con Trợn Mắt, Nói Trống Không - Con Tự Nhận Sai Không Tự Ái | Truong Chia Se","youtubeDesc":"Con cái chính là tấm gương phản chiếu của cha mẹ. Thay vì gào thét để xưng uy hay nhẫn nhịn để tước đi quyền làm cha mẹ, hãy áp dụng Nghệ Thuật Im Lặng. Video này chia sẻ 3 bước tâm lý: Dừng lại chỉ rõ hành động, Tách biệt thái độ với con người và Mở đường lui cho con.\n\nBài học sâu sắc từ cuốn sách '38 lá thư Rockefeller gửi cho con trai' sẽ là hành trang đắt giá giúp trẻ phát triển bản thân và học cách đối nhân xử thế. Hãy cùng 'Truong Chia Se' kiến tạo sự tử tế từ chính ngôi nhà của mình.\n\n#TruongChiaSe","tiktok":"Con cứ hễ nói một câu là trợn mắt, vùng vằng bỏ đi? Đừng vội quát mắng hay nhẫn nhịn trong bất lực! Khám phá ngay 3 bước 'phanh gấp' khiến con tự giác xin lỗi mà vẫn thấy được tôn trọng. Bí kíp này không chỉ dạy con mà còn là cách cha mẹ tu dưỡng khẩu đức. Xem hết video để thay đổi không khí gia đình ngay hôm nay!\n\n#TruongChiaSe","facebook":"Con bướng bỉnh, cãi lời? Áp dụng ngay 3 bước để con tự nhận sai mà không tự ái.\n\n#TruongChiaSe #DayCon #NuoiDayCon #GiaoDuc #TamLy","zalo":"Gửi các bậc phụ huynh, khi con bướng bỉnh, sự điềm tĩnh của cha mẹ chính là liều thuốc tốt nhất. Đừng quát mắng, hãy thử 3 bước: Dừng lại - Tách bạch - Mở lối để con tự nhận sai trong sự yêu thương. Chúc cả nhà mình luôn tìm thấy tiếng nói chung với các con.\n\n#TruongChiaSe","instagram":"Nuôi dạy con là hành trình tu sửa chính mình. Khi con 'nổi loạn', hãy là bến đỗ bình yên nhưng kiên định. ✨\n\n#TruongChiaSe #DayCon #Parenting #Mindfulness #GiaoDuc","pinnedComment":"Bạn thường làm gì khi con có thái độ chưa đúng mực? Hãy chia sẻ kinh nghiệm của bạn phía dưới nhé! Đừng quên ghé giỏ hàng tham khảo cuốn '38 Lá Thư Rockefeller' - món quà tinh thần tuyệt vời cho hành trình trưởng thành của con. 👇","affiliateSuggestions":"38 Lá Thư Rockefeller Gửi Cho Con Trai\nVô Cùng Tàn Nhẫn Vô Cùng Yêu Thương\nCách Nói Để Trẻ Chịu Nghe Và Nghe Để Trẻ Chịu Nói\nCha Mẹ Đọc Con Thành Tài\nNuôi Con Không Phải Là Cuộc Chiến","productLink":""},{"stt":55,"category":"Trường Chia Sẻ","title":"Video 55","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1SNwN1xIY3bNZZhHlofTMOE3Q3-7VhDEZ/view?usp=drivesdk","youtubeTitle":"Đừng Làm Phiền Người Không Trân Trọng Bạn | Bài Học Tỉnh Ngộ Về Giá Trị Bản Thân","youtubeDesc":"Nếu họ muốn, họ sẽ tìm cách. Nếu không muốn, họ sẽ tìm lý do. Đừng phí hoài tâm tư cho người không dành chỗ cho bạn trong lòng họ. Hãy học cách trân trọng chính mình trước khi mong chờ người khác trân trọng bạn. Video này dành cho những ai đang loay hoay trong một mối quan hệ một chiều. Đừng quên nhấn Like và Đăng ký kênh để nhận thêm bài học sâu sắc mỗi ngày.\n\n#TruongChiaSe","tiktok":"Bạn có đang là 'kẻ phiền phức' trong mắt người khác? Đừng tự lừa dối bản thân bằng những lý do họ 'bận' hay 'mệt' nữa. Sự thật nằm ngay trong video này, xem hết để tỉnh ngộ nhé!\n\n#TruongChiaSe","facebook":"Ngừng làm phiền người không coi trọng bạn. Giá trị của bạn nằm ở cách bạn rời đi.\n\n#TruongChiaSe #baihoc #trietly #cuocsong #nhansinh","zalo":"Cuộc đời ngắn ngủi, đừng phí thời gian cho những mối quan hệ một chiều. Hãy dành tình cảm cho những người thực sự trân trọng sự hiện diện của bạn. Chúc bạn luôn an yên và sáng suốt trên hành trình tìm kiếm hạnh phúc.\n\n#TruongChiaSe","instagram":"Người thực lòng muốn bên bạn, Đông Tây Nam Bắc đều thuận đường. ✨\n\n#TruongChiaSe #healing #minimalism #lifequotes #deep","pinnedComment":"Bạn đã bao giờ rơi vào cảm giác là người duy nhất cố gắng trong một mối quan hệ chưa? Hãy chia sẻ để cùng vơi bớt nỗi lòng nhé. Nếu bạn cần một nơi để xoa dịu tâm hồn, tham khảo các món quà tại link bio nha! 👇","affiliateSuggestions":"Sách Yêu mình trước đã rồi đời sẽ yêu ta\nSách Không tự khinh bỉ, không tự phí hoài\nNến thơm tinh dầu thư giãn tâm hồn\nSổ tay ghi chép thấu hiểu bản thân\nSách Người khôn ngoan không bao giờ nói lời tổn thương","productLink":""},{"stt":56,"category":"Trường Chia Sẻ","title":"Video 56","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1dE1551lc3qFxDjTZMUvO3iRP1kyVYKjG/view?usp=drivesdk","youtubeTitle":"Sự Thật Về 'Say Rượu Mất Kiểm Soát': Bản Lĩnh Hay Sự Hèn Nhát? | Truong Chia Se","youtubeDesc":"Rượu không có lỗi, lỗi ở cách con người mượn nó để làm những việc bình thường không dám. Video này sẽ giúp bạn nhìn nhận lại về trách nhiệm và tu dưỡng khẩu đức trong cuộc sống. Đừng để cơn say làm mờ đi nhân cách.\n\n#TruongChiaSe #TuThan #TriTue #SongDep","tiktok":"Bạn tin 'say rượu nên không biết gì'? Thực tế cay đắng hơn bạn tưởng nhiều. Xem hết video này để thấu hiểu bản chất thật đằng sau những cơn say.\n\n#TruongChiaSe #TamLy #GocNhin #PhatTrienBanThan","facebook":"Đừng đổ lỗi cho rượu khi bản chất mới là câu trả lời. Bạn tỉnh hay say?\n\n#TruongChiaSe #TamLy #GocNhin #SongTinhThuc #BaiHoc","zalo":"Rượu nhạt uống lắm cũng say, người khôn nói lắm dẫu hay cũng nhàm. Mong chúng ta luôn giữ được sự tỉnh táo và bản lĩnh để bảo vệ những người thân yêu.\n\n#TruongChiaSe #LoiKhuyen #GiaDinh","instagram":"Say là một lựa chọn, không phải cái cớ. Hãy để sự im lặng và tỉnh táo thể hiện bản lĩnh của bạn. ✨\n\n#TruongChiaSe #Minimalism #Mindset #Wisdom #Lifestyle","pinnedComment":"Theo bạn, sau cơn say là bản chất thật hay chỉ là sự cố ý? Chia sẻ quan điểm của bạn nhé! Mời bạn ghé link bio để tìm những cuốn sách giúp tu tâm dưỡng tính hiệu quả. 👇","affiliateSuggestions":"Sách Nghệ Thuật Im Lặng\nSách Hiểu Về Trái Tim\nSách Khéo Ăn Khéo Nói Sẽ Có Được Thiên Hạ\nSách Sức Mạnh Của Sự Tĩnh Lặng\nMáy đo nồng độ cồn cầm tay cá nhân","productLink":""},{"stt":57,"category":"Trường Chia Sẻ","title":"Video 57","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/13_5-2ObDBe0nAOu6imtM-AM3p_gI0dIZ/view?usp=drivesdk","youtubeTitle":"Gánh Nặng Trưởng Thành: Khi Cuộc Sống Chỉ Còn Là Những Chuyến Xe Đi Làm Và Tan Làm","youtubeDesc":"Trưởng thành không chỉ là lớn lên về tuổi tác, mà là khi gánh nặng trên vai ngày một nặng thêm nhưng ta không còn ai để dựa dẫm. Đừng để cơm áo gạo tiền vắt kiệt tâm hồn bạn. Video này là lời ủi an dành cho những trái tim đang mệt mỏi ngoài kia. Đăng ký kênh để cùng chia sẻ những bài học nhân sinh giá trị mỗi ngày.\n\n#TruongChiaSe","tiktok":"Có những ngày mệt mỏi đến mức không dám ốm, không dám lười... Bạn có đang gồng mình như vậy không? Đừng bỏ cuộc, hãy xem hết video này để tìm thấy sự đồng cảm và động lực cho chính mình nhé!\n\n#TruongChiaSe","facebook":"Trưởng thành là khi mệt mỏi chỉ dám im lặng gánh vác. Bạn có đang ổn không?\n\n#TruongChiaSe #cuocsong #noluoc #truongthanh #dongluc","zalo":"Cuộc sống người trưởng thành vốn không dễ dàng. Nếu mệt quá, hãy nghỉ ngơi một chút rồi lại tiếp tục nhé. Đừng quá khắt khe với bản thân, bạn đã làm rất tốt rồi. Gửi lời chúc bình an và sức khỏe đến bạn!\n\n#TruongChiaSe","instagram":"Giữa bộn bề cơm áo, mong lòng bạn vẫn đủ bình yên để mỉm cười. ✨\n\n#TruongChiaSe #healing #lifequotes #motivation #chill","pinnedComment":"Bạn cảm thấy điều gì khó khăn nhất trong cuộc sống hiện tại? Cùng chia sẻ với mình nhé! Đừng quên ghé link bio để chọn một món quà tinh thần vỗ về bản thân sau những ngày vất vả nha! 👇","affiliateSuggestions":"Sách Hiểu Về Trái Tim - Thích Minh Niệm\nSách Càng Độc Lập Càng Hạnh Phúc\nMáy Massage Cổ Vai Gáy Cầm Tay\nSách Lớn Lên Trong Cô Đơn\nNến Thơm Tinh Dầu Thư Giãn","productLink":""},{"stt":58,"category":"Trường Chia Sẻ","title":"Video 58","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1a9l9TENAAvJqHWVPnhDVf1uOyRWGUxYF/view?usp=drivesdk","youtubeTitle":"3 Sai Lầm \"Hủy Diệt\" Cuộc Đời Khi Bạn Đang Khó Khăn | Trương Chia Sẻ","youtubeDesc":"Khi ở dưới đáy xã hội, lòng tốt hay sự sĩ diện sai chỗ chính là xiềng xích kéo bạn xuống sâu hơn. Video này chỉ ra 3 tư duy sai lệch khiến nhiều người mãi không ngóc đầu lên được: nghèo mà si tình, nghèo mà sĩ diện, và nghèo mà hay lo cho người khác. Hãy học cách yêu thương và xây dựng bản thân trước khi lo cho thiên hạ. Chúc bạn sớm tìm thấy lối đi riêng!\n\n#TruongChiaSe","tiktok":"Bạn có biết vì sao càng nghèo lại càng khó thoát khổ không? Không phải do thiếu tiền, mà do 3 sai lầm chí mạng này. Xem hết video để thức tỉnh và thay đổi vận mệnh ngay hôm nay nhé!\n\n#TruongChiaSe","facebook":"Càng nghèo càng dễ mắc 3 cái \"bẫy\" tâm lý này. Bạn có dính cái nào không?\n\n#TruongChiaSe #BaiHocCuocSong #PhatTrienBanThan #TuDuy #SongGiaTri","zalo":"Gửi bạn, đôi khi sự tử tế hay lòng kiêu hãnh không đúng lúc lại chính là gánh nặng kh à lời hứa. Mong chúng ta luôn giữ được sự chân thành và uy tín để cuộc sống luôn bình an, tốt đẹp. Chúc bạn một ngày thật ý nghĩa!\n\n#TruongChiaSe","instagram":"Trân trọng để trường tồn. Đừng để những lời đùa cợt làm phai nhạt giá trị chân chính của bản thân. ✨\n\n#TruongChiaSe #LifeLessons #Mindset #Values #Healing","pinnedComment":"Trong 4 điều trên, bạn thấy điều nào là thử thách lớn nhất đối với mình hiện nay? Hãy chia sẻ cùng mọi người nhé! Đừng quên ghé Link Bio để tham khảo những cuốn sách rèn luyện tâm tính và tư duy cực hay nha. 👇","affiliateSuggestions":"Sách Đắc Nhân Tâm - Dale Carnegie\nSách Hiểu Về Trái Tim - Minh Niệm\nSách Quản Lý Thời Gian Thông Minh\nSách Khéo Ăn Khéo Nói Sẽ Có Được Thiên Hạ\nSách Đừng Bao Giờ Đi Ăn Một Mình","productLink":""},{"stt":60,"category":"Trường Chia Sẻ","title":"Video 60","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1XsiB6SILcw21UiU_AFhLLdAu2XyxpIPE/view?usp=drivesdk","youtubeTitle":"Tại Sao Người Nghèo Làm Việc Cật Lực, Còn Người Giàu Lại Thong Dong? | Bài Học Đắt Giá","youtubeDesc":"Xem thế giới động vật, ta học được bài học sâu sắc về quy luật sinh tồn và sự phân hóa giàu nghèo trong xã hội. Không phải cứ làm việc 24 giờ mỗi ngày là sẽ giàu có, đôi khi sự thong dong để quan sát và quyết đoán đúng lúc mới là chìa khóa của sự thịnh vượng. Hãy cùng  nhìn lại hành trình của chính mình qua video này.\n\n#TruongChiaSe","tiktok":"Bạn đang nỗ lực như một con trâu hay đang săn mồi như một con hổ? Tại sao người nghèo càng làm càng mệt, còn người giàu lại thong dong mà vẫn hốt bạc? Bí mật nằm ở sự khác biệt giữa \"cày cuốc\" và \"chớp thời cơ\". Đừng để sự chăm chỉ mù quáng cản bước bạn đến thành công. Xem hết video này để thay đổi vận mệnh ngay hôm nay!\n\n#TruongChiaSe","facebook":"Tại sao làm việc cật lực vẫn nghèo? Bí mật nằm ở \"tư duy săn mồi\". Đừng chỉ chăm chỉ, hãy học cách nắm bắt thời cơ.\n\n#TruongChiaSe #TuDuy #GiauCo #BaiHoc #ThanhCong","zalo":"Gửi đến bạn một góc nhìn về sự chăm chỉ và sự nhạy bén trong cuộc sống. Hy vọng chúng ta không chỉ biết cúi đầu nỗ lực, mà còn biết ngẩng đầu tìm kiếm cơ hội để cuộc sống bớt phần khắc nghiệt và thêm phần an yên. Chúc bạn một ngày làm việc hiệu quả và sớm đạt được những thành tựu lớn.\n\n#TruongChiaSe","instagram":"Sự thong dong của kẻ mạnh là kết quả của những lần chớp thời cơ chuẩn xác. Đừng chỉ là kẻ ăn cỏ luôn cúi đầu, hãy rèn luyện bản lĩnh của kẻ săn mồi đại tài. ✨\n.\n\n#TruongChiaSe #Mindset #Success #LifeLessons #Wisdom","pinnedComment":"Bạn thuộc nhóm người nỗ lực bền bỉ hay nhóm người chờ đợi thời cơ để bứt phá? Hãy để lại ý kiến của mình nhé! Ngoài ra, mình có để những công cụ giúp thay đổi tư duy tài chính ở link bio, mời bạn tham khảo.","affiliateSuggestions":"Sách Cha Giàu Cha Nghèo - Robert Kiyosaki\nSách Tuần Làm Việc 4 Giờ - Timothy Ferriss\nSách Thay Đổi Tư Duy Thay Đổi Vận Mệnh - Brian Tracy\nSổ tay lập kế hoạch hành động 90 ngày\nĐồng hồ Pomodoro quản lý thời gian tập trung","productLink":""},{"stt":62,"category":"Trường Chia Sẻ","title":"Video 62","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1rpv4SwG1mOrA3NKqY8-30gTaRenwne8x/view?usp=drivesdk","youtubeTitle":"Đừng Để Sự Nghèo Khó Lấy Đi Sự Tự Tôn Của Bạn | Bài Học Đắt Giá #TruongChiaSe","youtubeDesc":"Một ngày mới lại bắt đầu, bạn chọn than vãn hay chọn hành động? Hãy nhớ rằng, sóng to gió lớn là để thử thách bản lĩnh, không phải để quật ngã chúng ta. Chỉ khi bạn tự đứng trên đôi chân của mình, bạn mới thực sự làm chủ cuộc đời. Chúc bạn một ngày mới đầy năng lượng và quyết tâm!\n\n#TruongChiaSe","tiktok":"Bạn có biết vì sao hôm nay dù mệt mỏi bạn vẫn phải thức dậy không? Vì thế giới này không có chỗ cho sự yếu đuối. Tiền không phải tất cả, nhưng nó là tấm khiên để bạn không phải cúi đầu trước bất kỳ ai. Đừng bỏ lỡ thông điệp ở cuối video để biết cách lấy lại năng lượng ngay lúc này nhé!\n\n#TruongChiaSe","facebook":"Dậy đi, chỉ có tiền mới giúp bạn ngẩng cao đầu. Tự mình gánh vác, tự mình vươn lên!\n\n#TruongChiaSe #dongluc #kiemtien #phattrienbanthan #cuocsong","zalo":"Chào buổi sáng bạn tôi. Đời người đắng cay tự mình thấu, sóng gió tự mình gánh. Hãy cứ lạc quan, ngẩng cao đầu mà tiến về phía trước. Chúc bạn một ngày làm việc năng suất và sớm đạt được thành quả như ý!\n\n#TruongChiaSe","instagram":"Tự thân vận động, tự mình kiên cường. Đừng đợi thương hại, hãy chọn tự tôn. ✨\n\n#TruongChiaSe #motivation #mindset #growth #success","pinnedComment":"Khó khăn hiện tại của bạn là gì? Chia sẻ cùng mình để cùng nhau vượt qua nhé! Đừng quên ghé giỏ hàng để tìm những 'vũ khí' giúp bạn vững vàng hơn trên con đường phát triển bản thân. 👇","affiliateSuggestions":"Sách Đừng Lựa Chọn An Nhàn Khi Còn Trẻ\nSách Tâm Lý Học Về Tiền\nSách Thay Đổi Tư Duy Thay Đổi Vận Mệnh\nSổ tay lập kế hoạch 6 tháng Action Planner\nSách Đời Thay Đổi Khi Chúng Ta Thay Đổi","productLink":""},{"stt":63,"category":"Trường Chia Sẻ","title":"Video 63","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1oZe_1bo7XhgBC81-0PJGZbMxVKlMu1Zv/view?usp=drivesdk","youtubeTitle":"Nghịch Lý Cuộc Đời: Tại Sao Chúng Ta Càng Cố Gắng Lại Càng Áp Lực? | Bài Học Tỉnh Thức","youtubeDesc":"Chúng ta thường bắt đầu một việc với ý định tốt đẹp, nhưng kết quả lại nhận về sự mệt mỏi. Mua nhà để ổn định nhưng lại nợ nần, kết hôn để hạnh phúc nhưng lại áp lực hơn. Đã bao giờ bạn tự hỏi: Liệu mình có đang đi sai hướng so với mục đích ban đầu? Video này là lời cảnh tỉnh giúp bạn nhìn nhận lại giá trị đích thực của cuộc sống và tìm cách thoát khỏi những vòng lặp mệt mỏi.\n\n#TruongChiaSe","tiktok":"Bạn có bao giờ thấy cuộc đời mình đang đi ngược lại hoàn toàn với mong đợi không? Mua nhà để an cư lại phải bôn ba vì nợ, kết hôn để sẻ chia lại gánh thêm áp lực. Tại sao vậy? Video này sẽ giúp bạn nhận ra những nghịch lý đang bào mòn hạnh phúc của mình. Xem hết video để tìm lại sự bình yên nhé!\n\n#TruongChiaSe","facebook":"Đừng để mục đích ban đầu trở thành xiềng xích trói buộc bạn. Hãy tỉnh thức để sống trọn vẹn hơn.\n\n#TruongChiaSe #baihoccuocdoi #songtinhthuc #trietly #nhansinh","zalo":"Cuộc sống đôi khi không như ý vì chúng ta lỡ quên mất mục đích ban đầu. Đừng để những lo toan cuốn đi niềm vui thực sự nhé. Chúc bạn luôn bình yên và tỉnh táo giữa những bộn bề cuộc đời.\n\n#TruongChiaSe","instagram":"Đừng để mục đích trở thành gánh nặng. Sống tỉnh thức giữa những nghịch lý của nhân sinh. 🌿\n\n#TruongChiaSe #Mindfulness #LifeLessons #DeepQuotes #SongGiaTri","pinnedComment":"Bạn thấy nghịch lý nào trong video này đúng nhất với mình lúc này? Hãy chia sẻ phía dưới nhé! Đừng quên ghé thăm giỏ hàng/bio để tìm những món đồ giúp cuộc sống của bạn trở nên tinh tế và nhẹ nhàng hơn nha. 👇","affiliateSuggestions":"Hộp nhựa đựng thực phẩm Inochi cao cấp\nSách Hiểu Về Trái Tim - Minh Niệm\nSách Muôn Kiếp Nhân Sinh - Nguyên Phong\nMáy xông tinh dầu phun sương thư giãn\nSổ tay quản lý tài chính cá nhân Kakeibo","productLink":""},{"stt":64,"category":"Trường Chia Sẻ","title":"Video 64","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1MNDl8bfmILyXi1zRA-jWiUzZfAXP9_Wo/view?usp=drivesdk","youtubeTitle":"Nghệ Thuật Từ Chối Vay Tiền: Đừng Để Lòng Tốt Biến Bạn Thành Kẻ Ngốc | #TruongChiaSe","youtubeDesc":"Tiền bạc phân minh, ái tình dứt khoát. Video này chia sẻ góc nhìn thực tế về cái bẫy tâm lý khi cho người khác vay tiền và sự trớ trêu khi phải đi đòi lại 'mồ hôi xương máu' của chính mình. Hãy cùng học cách từ chối khéo léo để bảo vệ thành quả lao động và giữ gìn các mối quan hệ một cách văn minh nhất. Đừng quên Đăng ký kênh để nhận thêm nhiều bài học giá trị từ .\n\n#TruongChiaSe","tiktok":"Bạn đã từng phải \"xin lỗi\" để đòi lại chính tiền của mình chưa? Cảnh tượng trớ trêu: người cho vay còn phải kể khổ hơn kẻ đi mượn. Xem hết video này để biết cách bảo vệ túi tiền và sự tự tôn của chính mình nhé!\n\n#TruongChiaSe","facebook":"Cho vay là dại, cho vay lần 2 khi chưa trả là đại dại. Đừng để bản thân phải kể khổ chỉ để đòi lại tiền của mình!\n\n#TruongChiaSe #TienBac #BaiHoc #TuChoi #TaiChinh","zalo":"Tiền bạc kiếm được vốn chẳng dễ dàng. Đôi khi từ chối không phải là ích kỷ, mà là cách để giữ gìn mối quan hệ bền lâu và bảo vệ công sức của chính mình. Hy vọng chúng ta luôn tỉnh táo để lòng tốt được đặt đúng chỗ. Thương gửi cả nhà bài học ý nghĩa này!\n\n#TruongChiaSe","instagram":"Lòng tốt cần đi kèm sự tỉnh táo. Đừng để bản thân rơi vào thế khó khi đồng tiền mồ hôi xương máu bị xem nhẹ. ✨\n\n#TruongChiaSe #Mindset #Money #Lifestyle #Success","pinnedComment":"Bạn đã bao giờ rơi vào tình cảnh \"đòi tiền như đi ăn xin\" chưa? Chia sẻ câu chuyện của bạn bên dưới để chúng ta cùng rút kinh nghiệm nhé! Đừng quên ghé link bio/giỏ hàng để tìm các đầu sách giúp rèn luyện tư duy tài chính và kỹ năng từ chối khéo léo. 👇","affiliateSuggestions":"Sách Khéo Ăn Nói Sẽ Có Được Thiên Hạ\nSách Tâm Lý Học Về Tiền\nSách Nghệ Thuật Từ Chối\nSổ Tay Quản Lý Tài Chinh Cá Nhân\nVí Da Nam Nữ Cao Cấp","productLink":""},{"stt":65,"category":"Trường Chia Sẻ","title":"Video 65","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1BOhdwwYvpv7qA6G_Dy5Ulh8PdeRRXeB_/view?usp=drivesdk","youtubeTitle":"Sự Thật Đau Lòng Về Tình Yêu Xa: Tại Sao Sự Chờ Đợi Thường Không Có Kết Quả? | Truong Chia Se","youtubeDesc":"\"Chữ đợi, thật ra đã chẳng có kết thúc.\" Những tin nhắn lúc đêm khuya suy cho cùng cũng chẳng thể thắng nổi một bữa sáng được đặt trên bàn. Một câu chúc ngủ ngon qua màn hình rốt cuộc cũng không ấm bằng một cái ôm thật sự. Video này là lời nhắc nhở về giá trị của sự hiện diện và hơi ấm của thực tại. Đừng để khoảng cách làm mờ đi những giá trị chân thực nhất của tình yêu. Hãy trân trọng người đang ở bên cạnh bạn ngay lúc này.\n\n#TruongChiaSe #baihoccuocdoi #trietlynhansinh #yeuxa","tiktok":"Bạn tin vào tình yêu xa, hay tin vào người luôn có mặt mỗi khi bạn cần? Đừng để hai chữ \"đợi chờ\" trở thành kết thúc buồn nhất của một mối quan hệ. Video này dành cho những ai đang loay hoay trong nỗi nhớ qua màn hình điện thoại. Hãy xem hết để hiểu vì sao chúng ta lại thua trước thực tại.\n\n#TruongChiaSe","facebook":"Màn hình điện thoại chẳng thể ấm bằng một cái ôm thực sự. Đừng để sự chờ đợi lấy đi thanh xuân của bạn.\n\n#TruongChiaSe #yeuxa #baihoccuocdoi #tinhyeu #khoangcach","zalo":"Gửi bạn, đôi khi chúng ta mải mê đuổi theo những thứ xa vời mà quên mất rằng hạnh phúc thật sự nằm ở sự hiện diện. Đừng để người mình thương phải chờ đợi quá lâu, vì một cái ôm trong thực tại mới là thứ sưởi ấm trái tim tốt nhất. Chúc bạn luôn có một người kề cạnh sẻ chia vui buồn.\n\n#TruongChiaSe","instagram":"Khoảng cách không đáng sợ, đáng sợ là khi chúng ta thua cả hơi ấm của thực tại. Chữ đợi vốn dĩ đã chẳng có kết thúc. 🌙✨\n\n#TruongChiaSe #healing #quotes #tinhyeu #cuocsong","pinnedComment":"Bạn chọn một người nói lời yêu qua màn hình hay một người luôn xuất hiện khi bạn cần? Chia sẻ quan điểm của bạn nhé! Đừng quên ghé giỏ hàng/link bio để tìm những món quà ý nghĩa sưởi ấm cho người thương đang ở ngay bên cạnh bạn nhé! 👇","affiliateSuggestions":"Máy xông tinh dầu tạo không gian ấm áp\nCốc sứ giữ nhiệt cao cấp làm quà tặng\nSổ tay ghi chép nhật ký hành trình yêu thương\nĐèn ngủ ánh sáng vàng ấm chống mỏi mắt\nBộ bài hướng dẫn kết nối và thấu hiểu đối phương","productLink":""},{"stt":66,"category":"Trường Chia Sẻ","title":"Video 66","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1L0XZeCWyD6Z7YKfJ1oIqbLUp1DZXO4xb/view?usp=drivesdk","youtubeTitle":"Bí Quyết Kiếm 18 Tỷ/Năm Từ 50K: Đỉnh Cao Tư Duy Kinh Doanh Đánh Vào Nhân Tính | Truong Chia Se","youtubeDesc":"Bạn đang làm việc bán sống bán chết nhưng vẫn nghèo? Đó là vì bạn đang dùng sức lực thay vì dùng tư duy. Video này kể về câu chuyện thức tỉnh của một kỹ sư vỡ nợ trước lời dạy của ông cụ chơi cờ tướng. Bài học về cách biến nhu cầu thiết yếu thành phễu khách hàng, dùng tiền đặt cọc để xoay vốn và chiếm lĩnh thị trường lưu lượng. Thời đại 'lông cừu dứt trên thân lợn nhưng chó trả tiền' đã đến, hãy thay đổi tư duy để thay đổi vận mệnh tài chính của bạn ngay hôm nay!\n\n#TruongChiaSe","tiktok":"Bạn nợ nần, bế tắc và nghĩ rằng chỉ có chăm chỉ mới thoát nghèo? Sai rồi! Bí mật của 18 tỷ/năm nằm ở chiến lược 'miễn phí' đánh trúng tử huyệt nhân tính. Xem hết video này để thấy ông cụ 70 tuổi 'dạy bảo' anh kỹ sư vỡ nợ cách xoay chuyển dòng tiền cực đỉnh. Đừng bỏ lỡ 3 chiêu thức thay đổi hoàn toàn tư duy của bạn!\n\n#TruongChiaSe","facebook":"Tư duy kiếm tiền tỉ từ 50k. Đừng chăm chỉ mù quáng, hãy học cách thấu hiểu nhân tính để thành công!\n\n#TruongChiaSe #KinhDoanh #TuDuy #TaiChinh #LamGiau","zalo":"Đôi khi chúng ta mải miết chạy theo đồng tiền lẻ mà quên mất việc xây dựng một hệ thống bền vững. Gửi tặng bạn câu chuyện ý nghĩa này, hy vọng sẽ giúp bạn có cái nhìn mới hơn về kinh doanh và dòng tiền. Chúc bạn luôn vững vàng và thành công!\n\n#TruongChiaSe","instagram":"Đừng chỉ làm việc chăm chỉ, hãy làm việc thông minh. 💡 Thấu hiểu nhân tính chính là chìa khóa của mọi thương vụ bạc tỷ. ✨\n\n#TruongChiaSe #BusinessMindset #Wealth #Success #Strategy #Knowledge","pinnedComment":"Theo bạn, trong kinh doanh, 'Sự lười biếng' của khách hàng là cơ hội hay rủi ro? Chia sẻ góc nhìn bên dưới nhé! 👇 Nếu muốn nâng tầm tư duy tài chính như anh chàng kỹ sư trong clip, đừng quên ghé giỏ hàng hoặc link bio để tìm cuốn sách phù hợp nhất cho mình!","affiliateSuggestions":"Sách Đắc Tài Trí\nSách Đắc Nhân Tâm\nSách Bí Mật Tư Duy Triệu Phú\nSách Chiến Lược Đại Dương Xanh\nSách Dạy Con Làm Giàu","productLink":""},{"stt":67,"category":"Trường Chia Sẻ","title":"Video 67","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1A-CVL6VM2QeXs3G-4iLd7Ri-3NCtGhLD/view?usp=drivesdk","youtubeTitle":"Tại Sao Bạn Nên Trân Trọng Người Hay Rủ Mình Đi Uống Nước? | Bài Học Nhân Sinh Sâu Sắc","youtubeDesc":"Tiền bạc với ai cũng không bao giờ là đủ, nhưng có những người sẵn sàng chi tiền và dành thời gian chỉ để ngồi uống nước cùng bạn. Đó không phải là sự lãng phí, mà là minh chứng rằng trong lòng họ, bạn quan trọng hơn cả vật chất. Cùng  chiêm nghiệm về những mối quan h     var IMAGE_ITEMS = [];
    var WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwmHZDP7eCdbDU_rSMGiKD3fg7yNeUWA_K2krdh5CjNFoNnaCLSrsZKfyUfdi_h9KvfRQ/exec";

    var currentTab = "video";
    var currentIndex = 0;
    var currentFilter = "pending"; // MẶC ĐỊNH LUÔN LÀ CHƯA ĐĂNG THEO YÊU CẦU
    var statusSyncPending = false;
    function callPostingApi(action, params, callback) {
      if (!WEB_APP_URL || WEB_APP_URL.indexOf("https://") !== 0) { callback(new Error("Web App URL chưa được cấu hình.")); return; }
      var callbackName = "postingStatusCallback_" + Date.now() + "_" + Math.floor(Math.random() * 1000000);
      var script = document.createElement("script");
      var finished = false;
      var timeoutId = setTimeout(function() { finish(new Error("Apps Script không phản hồi.")); }, 90000);
      function finish(error, result) {
        if (finished) return;
        finished = true;
        clearTimeout(timeoutId);
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
        callback(error, result);
      }
      window[callbackName] = function(result) { finish(null, result); };
      script.onerror = function() { finish(new Error("Không kết nối được Apps Script.")); };
      var query = ["action=" + encodeURIComponent(action), "callback=" + encodeURIComponent(callbackName), "_=" + Date.now()];
      Object.keys(params || {}).forEach(function(key) { query.push(encodeURIComponent(key) + "=" + encodeURIComponent(params[key])); });
      script.src = WEB_APP_URL + (WEB_APP_URL.indexOf("?") === -1 ? "?" : "&") + query.join("&");
      document.head.appendChild(script);
    }

    function getItems() {
      return currentTab === "video" ? VIDEO_ITEMS : IMAGE_ITEMS;
    }

    function getItemKey(item) {
      return currentTab + "_" + (item ? item.stt : 0);
    }

    function isDone(item) {
      return !!item && String(item.status || "").toLowerCase().indexOf("đã đăng") !== -1;
    }

    function extractDriveId(url) {
      if (!url) return "";
      var s = String(url).trim();
      var m = s.match(/\/d\/([a-zA-Z0-9_-]{25,})/);
      if (m && m[1]) return m[1];
      var m2 = s.match(/id=([a-zA-Z0-9_-]{25,})/);
      if (m2 && m2[1]) return m2[1];
      if (/^[a-zA-Z0-9_-]{25,}$/.test(s)) return s;
      return "";
    }

    function switchTab(t) {
      currentTab = t;
      document.getElementById("tabVideoBtn").classList.toggle("active", t === "video");
      document.getElementById("tabImageBtn").classList.toggle("active", t === "image");

      // Cập nhật nhãn nút Hàng 4 phù hợp với Tab
      if (t === "video") {
        document.getElementById("lblRow4Col1").innerText = "▶️ Caption YouTube";
        document.getElementById("lblRow4Col2").innerText = "📄 Mô Tả YouTube";
        document.getElementById("lblDownloadDrive").innerText = "📥 Tải Video";
        document.getElementById("previewTypeLabel").innerText = "Khung Xem Video Drive:";
      } else {
        document.getElementById("lblRow4Col1").innerText = "📸 Caption Insta";
        document.getElementById("lblRow4Col2").innerText = "🎨 Prompt AI";
        document.getElementById("lblDownloadDrive").innerText = "📥 Tải Ảnh";
        document.getElementById("previewTypeLabel").innerText = "Khung Xem Ảnh Gốc:";
      }

      // Luôn đưa về bài chưa đăng đầu tiên của tab đó
      findAndSetFirstPendingIndex();
      loadCurrentItem();
      renderTable();
      updateStats();
    }

    function findAndSetFirstPendingIndex() {
      var items = getItems();
      for (var i = 0; i < items.length; i++) {
        if (!isDone(items[i])) {
          currentIndex = i;
          return;
        }
      }
      currentIndex = 0;
    }

    function loadCurrentItem() {
      var items = getItems();
      if (!items || items.length === 0) {
        document.getElementById("currStt").innerText = "#0";
        document.getElementById("currCategory").innerText = "Chưa có dữ liệu";
        document.getElementById("currTitle").innerText = "Chưa có bài viết nào trong tab này";
        document.getElementById("previewMediaBox").innerHTML = "<div class='preview-placeholder'><span class='icon'>📁</span><span>Không có dữ liệu</span></div>";
        return;
      }

      if (currentIndex < 0) currentIndex = 0;
      if (currentIndex >= items.length) currentIndex = items.length - 1;

      var it = items[currentIndex];
      document.getElementById("currStt").innerText = "#" + it.stt;
      document.getElementById("currCategory").innerText = it.category || "Phúc Học Điều Hay";
      document.getElementById("currTitle").innerText = it.title;

      // Cập nhật Nút Đánh Dấu Đã Đăng (Hàng 5)
      var d = isDone(it);
      var btnMark = document.getElementById("btnMarkPosted");
      var lblMark = document.getElementById("lblMarkPosted");

      if (d) {
        btnMark.className = "btn-mark-posted state-done";
        lblMark.innerText = "✅ ĐÃ ĐĂNG (Hoàn tác)";
      } else {
        btnMark.className = "btn-mark-posted state-pending";
        lblMark.innerText = "🔴 ĐÁNH DẤU: ĐÃ ĐĂNG BÀI";
      }

      // TỰ ĐỘNG NẠP VÀO KHUNG XEM TRỰC TIẾP
      renderPreviewMedia(it);
    }

    function renderPreviewMedia(it) {
      var box = document.getElementById("previewMediaBox");
      box.innerHTML = "";

      if (currentTab === "video") {
        var vidUrl = it.videoUrl || it.zipUrl || "";
        var fileId = extractDriveId(vidUrl);

        if (fileId) {
          var previewSrc = "https://drive.google.com/file/d/" + fileId + "/preview";
          var iframe = document.createElement("iframe");
          iframe.src = previewSrc;
          iframe.allow = "autoplay; fullscreen";
          iframe.setAttribute("allowfullscreen", "true");
          box.appendChild(iframe);
        } else {
          box.innerHTML = "<div class='preview-placeholder'><span class='icon'>🎬</span><b>Chưa có link video Drive</b><span class='hint'>Hãy cập nhật cột 'Link Video Drive' trong sheet</span></div>";
        }
      } else {
        // TAB ẢNH - TUYỆT ĐỐI KHÔNG DÙNG AVATAR
        var imgUrl = it.imageUrl || ("Image/A (" + it.stt + ").jpg");
        var imgId = extractDriveId(imgUrl);
        var directImgSrc = imgId ? ("https://lh3.googleusercontent.com/d/" + imgId) : imgUrl;

        var img = document.createElement("img");
        img.src = directImgSrc;
        img.title = "Nhấp để phóng to toàn màn hình";
        img.onclick = function() { openLightbox(this.src); };
        img.onerror = function() {
          if (imgId && this.src.indexOf("googleusercontent") !== -1) {
            this.src = "https://drive.google.com/thumbnail?id=" + imgId + "&sz=w1000";
          } else {
            box.innerHTML = "<div class='preview-placeholder'><span class='icon'>📸</span><b>Không thể tải trước ảnh</b><span class='hint'>Bấm 'Tải Drive' để tải ảnh gốc</span></div>";
          }
        };
        box.appendChild(img);
      }
    }

    function triggerViewInFrame() {
      var it = getItems()[currentIndex];
      if (!it) return;
      renderPreviewMedia(it);
      showToast("👁️ Đang mở trình phát trong khung xem!");
    }

    function triggerDownloadDrive() {
      var it = getItems()[currentIndex];
      if (!it) return;
      var rawUrl = (currentTab === "video") ? (it.videoUrl || it.zipUrl) : it.imageUrl;
      var fileId = extractDriveId(rawUrl);

      if (fileId) {
        var dlUrl = "https://drive.google.com/uc?export=download&id=" + fileId;
        window.open(dlUrl, "_blank");
        showToast("📥 Đang tải file từ Google Drive...");
      } else if (rawUrl && rawUrl.indexOf("http") === 0) {
        window.open(rawUrl, "_blank");
      } else {
        showToast("⚠️ Chưa có URL Google Drive cho bài này!");
      }
    }

    function openDriveExternalTab() {
      var it = getItems()[currentIndex];
      if (!it) return;
      var rawUrl = (currentTab === "video") ? (it.videoUrl || it.zipUrl) : it.imageUrl;
      if (rawUrl && rawUrl.indexOf("http") === 0) {
        window.open(rawUrl, "_blank");
      } else {
        showToast("⚠️ Chưa có đường link Google Drive!");
      }
    }

    function copyAffiliateLink() {
      if (currentTab !== "video") { showToast("⚠️ Link AFF chỉ áp dụng cho video"); return; }
      var it = getItems()[currentIndex];
      var url = it && it.productLink ? String(it.productLink).trim() : "";
      if (!/^https?:\/\//i.test(url)) { showToast("⚠️ Chưa có Link AFF cho video này"); return; }
      copyText(url, "Link AFF");
    }

    function copyAffiliateSuggestions() {
      if (currentTab !== "video") { showToast("⚠️ Gợi ý AFF chỉ áp dụng cho video"); return; }
      copyCurrentField("affiliateSuggestions", "Gợi Ý Sản Phẩm AFF");
    }

    function copyCurrentField(key, label) {
      var it = getItems()[currentIndex];
      if (!it) return;
      var txt = it[key] || "";
      if (!txt) {
        showToast("⚠️ Chưa có nội dung " + label);
        return;
      }
      copyText(txt, label);
    }

    function copyRow4Col1() {
      var it = getItems()[currentIndex];
      if (!it) return;
      if (currentTab === "video") {
        copyCurrentField("youtubeTitle", "Tiêu Đề YouTube");
      } else {
        copyCurrentField("tiktok", "Caption Instagram");
      }
    }

    function copyRow4Col2() {
      var it = getItems()[currentIndex];
      if (!it) return;
      if (currentTab === "video") {
        copyCurrentField("youtubeDesc", "Mô Tả YouTube");
      } else {
        copyCurrentField("prompt", "Prompt AI Tạo Ảnh");
      }
    }

    function nextItem() {
      var items = getItems();
      if (currentIndex < items.length - 1) {
        currentIndex++;
        loadCurrentItem();
        renderTable();
      } else {
        showToast("Đã đến bài cuối cùng!");
      }
    }

    function prevItem() {
      if (currentIndex > 0) {
        currentIndex--;
        loadCurrentItem();
        renderTable();
      } else {
        showToast("Đang ở bài đầu tiên!");
      }
    }

    function toggleCurrentDone() {
      if (statusSyncPending) return;
      var it = getItems()[currentIndex];
      if (!it) return;
      var newDone = !isDone(it);
      var button = document.getElementById("btnMarkPosted");
      statusSyncPending = true;
      if (button) button.disabled = true;
      showToast("⏳ Đang ghi trạng thái vào Google Sheet...");
      callPostingApi("markPosted", { type: currentTab, stt: String(it.stt), title: it.title || "", isDone: String(newDone) }, function(error, result) {
        statusSyncPending = false;
        if (button) button.disabled = false;
        if (error || !result || !result.success || !result.updated) {
          var syncError = result && result.error ? result.error : (error && error.message ? error.message : "Không xác nhận được trạng thái từ Google Sheet.");
          showToast("⚠️ " + syncError);
          return;
        }
        it.status = newDone ? "Đã đăng" : (currentTab === "image" ? "Đã làm ảnh" : "Đã làm video");
        if (newDone && currentFilter === "pending") findAndSetFirstPendingIndex();
        loadCurrentItem();
        renderTable();
        updateStats();
        showToast(newDone ? "✅ Sheet đã ghi: ĐÃ ĐĂNG BÀI" : "⚪ Sheet đã ghi: CHƯA ĐĂNG");
      });
    }

    function setFilter(f) {
      currentFilter = f;
      document.querySelectorAll(".filter-chip").forEach(function(c) { c.classList.remove("active"); });
      if (f === "pending") document.getElementById("chipPending").classList.add("active");
      else if (f === "done") document.getElementById("chipDone").classList.add("active");
      else document.getElementById("chipAll").classList.add("active");

      // Nếu bài hiện tại không thuộc bộ lọc mới, nhảy về bài đầu tiên thỏa mãn
      var items = getItems();
      var validIndex = -1;
      for (var i = 0; i < items.length; i++) {
        var d = isDone(items[i]);
        if (f === "all" || (f === "pending" && !d) || (f === "done" && d)) {
          validIndex = i;
          break;
        }
      }
      if (validIndex !== -1) {
        currentIndex = validIndex;
        loadCurrentItem();
      }

      renderTable();
    }

    function renderTable() {
      var q = (document.getElementById("searchInput").value || "").toLowerCase().trim();
      var items = getItems();
      var tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      items.forEach(function(it, idx) {
        var d = isDone(it);
        if (currentFilter === "pending" && d) return;
        if (currentFilter === "done" && !d) return;

        var sttMatch = ("#" + it.stt).toLowerCase().indexOf(q) !== -1;
        var titleMatch = it.title.toLowerCase().indexOf(q) !== -1;
        if (q && !sttMatch && !titleMatch) return;

        var tr = document.createElement("tr");
        if (idx === currentIndex) tr.className = "active";
        tr.onclick = function() {
          currentIndex = idx;
          loadCurrentItem();
          renderTable();
          window.scrollTo({ top: 120, behavior: "smooth" });
        };

        tr.innerHTML = 
          '<td><b>#' + it.stt + '</b></td>' +
          '<td>' + it.title + '</td>' +
          '<td><span class="badge-status ' + (d ? "done" : "pending") + '">' + (d ? "Đã đăng" : "Chưa") + '</span></td>';
        tbody.appendChild(tr);
      });
    }

    function updateStats() {
      var items = getItems();
      var total = items.length;
      var doneCount = 0;
      var pendingCount = 0;

      items.forEach(function(it) {
        if (isDone(it)) doneCount++;
        else pendingCount++;
      });

      document.getElementById("vCount").innerText = VIDEO_ITEMS.length;
      document.getElementById("iCount").innerText = IMAGE_ITEMS.length;

      document.getElementById("countPending").innerText = pendingCount;
      document.getElementById("countDone").innerText = doneCount;
      document.getElementById("countAll").innerText = total;

      var pct = total > 0 ? Math.round((doneCount / total) * 100) : 0;
      document.getElementById("statText").innerText = "Đã đăng: " + doneCount + " / " + total;
      document.getElementById("statPercent").innerText = pct + "%";
      document.getElementById("progressBar").style.width = pct + "%";
    }

    function copyText(txt, label) {
      if (!txt) {
        showToast("⚠️ Nội dung trống");
        return;
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(function() {
          showToast("✓ Đã sao chép: " + label);
        }).catch(function() {
          fallbackCopy(txt, label);
        });
      } else {
        fallbackCopy(txt, label);
      }
    }

    function fallbackCopy(txt, label) {
      var t = document.createElement("textarea");
      t.value = txt;
      t.style.position = "fixed";
      t.style.opacity = "0";
      document.body.appendChild(t);
      t.select();
      document.execCommand("copy");
      document.body.removeChild(t);
      showToast("✓ Đã sao chép: " + label);
    }

    function showToast(m) {
      var t = document.getElementById("toastMsg");
      t.innerText = m;
      t.style.display = "block";
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(function() { t.style.display = "none"; }, 1800);
    }

    function openLightbox(src) {
      document.getElementById("lightboxImg").src = src;
      document.getElementById("lightbox").style.display = "flex";
    }

    // KHỞI ĐỘNG MẶC ĐỊNH LÀ VIDEO & CHƯA ĐĂNG
    switchTab("video");
  </script>
</body>
</html>
