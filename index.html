<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>TRẠM ĐĂNG BÀI • Phúc Học Điều Hay</title>
  <link rel="icon" type="image/png" href="Avatar.png">
  <link rel="apple-touch-icon" href="Avatar.png">
  <meta name="theme-color" content="#090d16">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --card-inner: #0d1322;
      --border: #1f293d;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #f59e0b;
      --emerald: #10b981;
      --cyan: #06b6d4;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Plus Jakarta Sans", sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 10px; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 520px; background: var(--card-bg); border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); overflow: hidden; display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.06); }

    /* HEADER */
    header { background: linear-gradient(180deg, rgba(245, 158, 11, 0.16) 0%, rgba(17, 24, 39, 0) 100%); padding: 14px 16px 10px 16px; text-align: center; border-bottom: 1px solid var(--border); }
    .brand-wrap { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 6px; }
    .brand-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }
    .header-title { font-size: 19px; font-weight: 900; background: linear-gradient(135deg, #fbbf24, #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.2px; }
    .header-subtitle { font-size: 11px; color: var(--text-muted); font-weight: 600; }

    /* 2 TAB SWITCHER */
    .tab-switcher { display: grid; grid-template-columns: 1fr 1fr; background: #090d16; margin: 10px 14px 4px 14px; border-radius: 14px; padding: 4px; border: 1px solid var(--border); gap: 6px; }
    .tab-btn { border: none; background: transparent; color: var(--text-muted); font-size: 13px; font-weight: 800; padding: 11px 8px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s; }
    .tab-btn.active { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.35); }
    .tab-btn.tab-img.active { background: linear-gradient(135deg, #06b6d4, #0891b2); color: #fff; box-shadow: 0 4px 12px rgba(6, 182, 212, 0.35); }

    /* STATS & PROGRESS */
    .stats-bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 16px 2px 16px; font-size: 12px; color: var(--text-muted); font-weight: 700; }
    .progress-bar-bg { width: 100%; height: 5px; background: rgba(255,255,255,0.06); border-radius: 6px; overflow: hidden; margin-top: 4px; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #f59e0b, #10b981); width: 0%; transition: width 0.3s; }

    /* ACTIVE CARD */
    .current-card { margin: 10px 14px 12px 14px; background: var(--card-inner); border: 1px solid var(--border); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    
    /* CARD HEADER */
    .card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .stt-group { display: flex; align-items: center; gap: 8px; }
    .badge-stt { font-size: 12px; font-weight: 900; background: rgba(245, 158, 11, 0.2); color: #fbbf24; padding: 3px 9px; border-radius: 8px; border: 1px solid rgba(245, 158, 11, 0.35); font-family: 'JetBrains Mono', monospace; }
    .badge-category { font-size: 11px; font-weight: 700; color: var(--text-muted); max-width: 170px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .nav-buttons { display: flex; align-items: center; gap: 6px; }
    .btn-nav { background: #162035; border: 1px solid var(--border); color: #cbd5e1; font-size: 11.5px; font-weight: 800; padding: 4px 10px; border-radius: 8px; cursor: pointer; transition: all 0.15s; }
    .btn-nav:hover { background: #223150; color: #fff; }
    .btn-nav:active { transform: scale(0.95); }

    .current-title { font-size: 15.5px; font-weight: 800; color: #fff; line-height: 1.45; }

    /* 5-ROW ACTION BUTTONS GRID */
    .actions-grid { display: flex; flex-direction: column; gap: 8px; width: 100%; }
    .btn-row-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    
    .btn-act { height: 42px; border: none; border-radius: 12px; padding: 0 10px; font-size: 12.5px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.15s; user-select: none; }
    .btn-act:active { transform: scale(0.97); }

    /* ROW 1: XEM DRIVE & TẢI DRIVE */
    .btn-view-drive { background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.35); color: #38bdf8; }
    .btn-view-drive:hover { background: rgba(56, 189, 248, 0.25); }
    .btn-download-drive { background: rgba(16, 185, 129, 0.18); border: 1px solid rgba(16, 185, 129, 0.4); color: #34d399; }
    .btn-download-drive:hover { background: rgba(16, 185, 129, 0.28); }

    /* ROW 2: CAPTION FB & BÌNH LUẬN */
    .btn-copy-fb { background: rgba(24, 119, 242, 0.18); border: 1px solid rgba(24, 119, 242, 0.45); color: #60a5fa; }
    .btn-copy-fb:hover { background: rgba(24, 119, 242, 0.28); }
    .btn-copy-pinned { background: rgba(168, 85, 247, 0.18); border: 1px solid rgba(168, 85, 247, 0.4); color: #c084fc; }
    .btn-copy-pinned:hover { background: rgba(168, 85, 247, 0.28); }

    /* ROW 3: CAPTION TIKTOK & CAPTION ZALO */
    .btn-copy-tiktok { background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.35); color: #fb7185; }
    .btn-copy-tiktok:hover { background: rgba(244, 63, 94, 0.25); }
    .btn-copy-zalo { background: rgba(14, 165, 233, 0.15); border: 1px solid rgba(14, 165, 233, 0.35); color: #38bdf8; }
    .btn-copy-zalo:hover { background: rgba(14, 165, 233, 0.25); }

    /* ROW 4: YOUTUBE TIÊU ĐỀ & MÔ TẢ (HOẶC INSTA & PROMPT AI Ở TAB ẢNH) */
    .btn-copy-yt-title { background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.35); color: #fbbf24; }
    .btn-copy-yt-title:hover { background: rgba(245, 158, 11, 0.25); }
    .btn-copy-yt-desc { background: rgba(203, 213, 225, 0.1); border: 1px solid var(--border); color: #cbd5e1; }
    .btn-copy-yt-desc:hover { background: rgba(203, 213, 225, 0.18); }

    /* ROW 5: NÚT ĐÁNH DẤU ĐÃ ĐĂNG - FULL WIDTH, NỔI BẬT */
    .btn-mark-posted { width: 100%; height: 46px; border-radius: 13px; font-size: 13.5px; font-weight: 900; letter-spacing: 0.3px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; border: none; }
    .btn-mark-posted.state-pending { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35); }
    .btn-mark-posted.state-pending:hover { background: linear-gradient(135deg, #dc2626, #b91c1c); }
    .btn-mark-posted.state-done { background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.45); color: #34d399; }
    .btn-mark-posted.state-done:hover { background: rgba(16, 185, 129, 0.3); }

    /* PREVIEW FRAME (DƯỚI 5 HÀNG NÚT, KÍCH THƯỚC BẰNG NHAU CHO CẢ VIDEO & ẢNH) */
    .preview-section { width: 100%; display: flex; flex-direction: column; gap: 6px; }
    .preview-header-label { display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; color: var(--text-muted); font-weight: 700; padding: 0 2px; }
    .preview-box { width: 100%; height: 260px; background: #050811; border-radius: 14px; border: 1px solid var(--border); overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; }
    .preview-box iframe { width: 100%; height: 100%; border: none; border-radius: 14px; }
    .preview-box img { width: 100%; height: 100%; object-fit: contain; cursor: zoom-in; }
    .preview-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--text-muted); padding: 16px; text-align: center; }
    .preview-placeholder .icon { font-size: 38px; }
    .preview-placeholder .hint { font-size: 11.5px; color: #64748b; }

    /* LIST & SEARCH SECTION (DƯỚI CÙNG) */
    .list-section { padding: 12px 14px 16px 14px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; background: rgba(11, 17, 32, 0.5); }
    .search-input { width: 100%; background: #090d16; border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; font-size: 13px; color: #fff; outline: none; transition: border-color 0.2s; }
    .search-input:focus { border-color: var(--primary); }

    .filter-chips { display: flex; gap: 6px; overflow-x: auto; }
    .filter-chip { background: #090d16; border: 1px solid var(--border); color: var(--text-muted); font-size: 11.5px; font-weight: 800; padding: 6px 12px; border-radius: 18px; cursor: pointer; white-space: nowrap; transition: all 0.15s; }
    .filter-chip.active { background: var(--primary); color: #000; border-color: var(--primary); }
    .filter-chip.chip-pending.active { background: #ef4444; color: #fff; border-color: #ef4444; }
    .filter-chip.chip-done.active { background: #10b981; color: #000; border-color: #10b981; }

    .table-container { max-height: 240px; overflow-y: auto; border: 1px solid var(--border); border-radius: 12px; background: #090d16; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { background: #131d31; padding: 8px 10px; text-align: left; color: var(--text-muted); font-size: 11px; font-weight: 800; position: sticky; top: 0; border-bottom: 1px solid var(--border); }
    td { padding: 9px 10px; border-bottom: 1px solid rgba(255,255,255,0.04); cursor: pointer; vertical-align: middle; }
    tr:hover { background: rgba(255,255,255,0.04); }
    tr.active { background: rgba(245, 158, 11, 0.15); font-weight: 700; }
    .badge-status { font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 6px; }
    .badge-status.pending { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .badge-status.done { background: rgba(16, 185, 129, 0.2); color: #34d399; }

    /* TOAST */
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #10b981; color: #000; font-weight: 900; font-size: 13px; padding: 10px 22px; border-radius: 20px; z-index: 999; display: none; box-shadow: 0 6px 20px rgba(0,0,0,0.6); }

    /* LIGHTBOX */
    .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 14px; }
    .lightbox img { max-width: 100%; max-height: 92vh; border-radius: 12px; object-fit: contain; }
      .btn-copy-aff { background: rgba(234, 179, 8, 0.16); border: 1px solid rgba(234, 179, 8, 0.42); color: #fde047; }
    .btn-copy-aff:hover { background: rgba(234, 179, 8, 0.27); }
    .btn-link-aff { background: rgba(16, 185, 129, 0.16); border: 1px solid rgba(16, 185, 129, 0.42); color: #34d399; }
    .btn-link-aff:hover { background: rgba(16, 185, 129, 0.27); }
    .btn-mark-posted { width: 100%; height: 46px; border-radius: 13px; font-size: 13.5px; }
</style>
</head>
<body>
  <div class="app-container">
    <header>
      <div class="brand-wrap">
        <img src="Avatar.png" class="brand-avatar" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><circle cx=\'50\' cy=\'50\' r=\'50\' fill=\'%23f59e0b\'/><text x=\'50\' y=\'60\' font-size=\'40\' text-anchor=\'middle\' fill=\'white\'>PH</text></svg>'">
        <div>
          <h1 class="header-title">Phúc Học Điều Hay</h1>
          <div class="header-subtitle">Trạm Đăng Bài Mobile • Cả Video & Ảnh Dạy Con</div>
        </div>
      </div>
    </header>

    <!-- SWITCH 2 TAB CHÍNH -->
    <div class="tab-switcher">
      <button class="tab-btn active" id="tabVideoBtn" onclick="switchTab('video')">🎬 ĐĂNG VIDEO (<span id="vCount">0</span>)</button>
      <button class="tab-btn tab-img" id="tabImageBtn" onclick="switchTab('image')">📸 ĐĂNG ẢNH (<span id="iCount">0</span>)</button>
    </div>

    <!-- STATS & PROGRESS BAR -->
    <div class="stats-bar">
      <span id="statText">Đang tải...</span>
      <span id="statPercent">0%</span>
    </div>
    <div style="padding: 0 14px;"><div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar"></div></div></div>

    <!-- ACTIVE CARD -->
    <div class="current-card">
      <div class="card-top">
        <div class="stt-group">
          <span class="badge-stt" id="currStt">#---</span>
          <span class="badge-category" id="currCategory">Phúc Học Điều Hay</span>
        </div>
        <div class="nav-buttons">
          <button class="btn-nav" onclick="prevItem()" title="Bài trước">⬅️ Trước</button>
          <button class="btn-nav" onclick="nextItem()" title="Bài tiếp theo">Sau ➡️</button>
        </div>
      </div>

      <div class="current-title" id="currTitle">Đang nạp bài viết...</div>

      <!-- 5 HÀNG NÚT BẤM CÂN XỨNG -->
      <div class="actions-grid">
        <!-- HÀNG 1: XEM DRIVE (TRÊN KHUNG XEM) & TẢI VỀ MÁY -->
        <div class="btn-row-2col">
          <button class="btn-act btn-view-drive" id="btnViewDrive" onclick="triggerViewInFrame()">
            <span>👁️ Xem Drive</span>
          </button>
          <button class="btn-act btn-download-drive" id="btnDownloadDrive" onclick="triggerDownloadDrive()">
            <span id="lblDownloadDrive">📥 Tải Drive</span>
          </button>
        </div>

        <!-- HÀNG 2: CAPTION FACEBOOK & BÌNH LUẬN -->
        <div class="btn-row-2col">
          <button class="btn-act btn-copy-fb" onclick="copyCurrentField('facebook', 'Caption Facebook')">
            <span>📘 Caption Facebook</span>
          </button>
          <button class="btn-act btn-copy-pinned" onclick="copyCurrentField('pinnedComment', 'Bình Luận')">
            <span>📌 Bình Luận</span>
          </button>
        </div>

        <!-- HÀNG 3: CAPTION TIKTOK & CAPTION ZALO -->
        <div class="btn-row-2col">
          <button class="btn-act btn-copy-tiktok" onclick="copyCurrentField('tiktok', 'Caption TikTok')">
            <span>🎵 Caption TikTok</span>
          </button>
          <button class="btn-act btn-copy-zalo" onclick="copyCurrentField('zalo', 'Caption Zalo')">
            <span>💬 Caption Zalo</span>
          </button>
        </div>

        <!-- HÀNG 4: CAPTION YOUTUBE & MÔ TẢ YOUTUBE (HOẶC INSTA & PROMPT AI Ở TAB ẢNH) -->
        <div class="btn-row-2col">
          <button class="btn-act btn-copy-yt-title" id="btnRow4Col1" onclick="copyRow4Col1()">
            <span id="lblRow4Col1">▶️ Caption YouTube</span>
          </button>
          <button class="btn-act btn-copy-yt-desc" id="btnRow4Col2" onclick="copyRow4Col2()">
            <span id="lblRow4Col2">📄 Mô Tả YouTube</span>
          </button>
        </div>

        <!-- HÀNG 5: NÚT ĐÁNH DẤU ĐÃ ĐĂNG - DÀI, MÀU ĐỎ NỔI BẬT -->
        <div class="btn-row-2col">
  <button class="btn-act btn-link-aff" id="btnCopyAffiliateLink" onclick="copyAffiliateLink()">
    <span>🔗 Link AFF</span>
  </button>
  <button class="btn-act btn-copy-aff" id="btnCopyAffiliate" onclick="copyAffiliateSuggestions()">
    <span>🛒 Gợi ý AFF</span>
  </button>
</div>
<button class="btn-mark-posted state-pending" id="btnMarkPosted" onclick="toggleCurrentDone()">
  <span id="lblMarkPosted">🔴 ĐÃ ĐĂNG BÀI</span>
</button>
      </div>

      <!-- KHUNG XEM TRỰC TIẾP VIDEO & ẢNH (ĐẶT DƯỚI 5 HÀNG NÚT, KÍCH THƯỚC BẰNG NHAU) -->
      <div class="preview-section">
        <div class="preview-header-label">
          <span id="previewTypeLabel">Khung Xem Trực Tiếp:</span>
          <span id="previewActionHint" style="font-size:11px;color:#38bdf8;cursor:pointer;" onclick="openDriveExternalTab()">Mở tab Drive ↗</span>
        </div>
        <div class="preview-box" id="previewMediaBox">
          <!-- Video Iframe hoặc Thẻ Img sẽ được render tại đây -->
        </div>
      </div>
    </div>

    <!-- LIST & SEARCH SECTION (DƯỚI CÙNG - MẶC ĐỊNH LỌC CHƯA ĐĂNG) -->
    <div class="list-section">
      <div class="filter-chips">
        <button class="filter-chip chip-pending active" id="chipPending" onclick="setFilter('pending')">⏳ Chưa đăng (<span id="countPending">0</span>)</button>
        <button class="filter-chip chip-done" id="chipDone" onclick="setFilter('done')">✅ Đã đăng (<span id="countDone">0</span>)</button>
        <button class="filter-chip" id="chipAll" onclick="setFilter('all')">Tất cả (<span id="countAll">0</span>)</button>
      </div>

      <input type="text" class="search-input" id="searchInput" placeholder="🔍 Tìm theo STT (#1) hoặc từ khóa..." oninput="renderTable()">

      <div class="table-container">
        <table>
          <thead><tr><th style="width:46px;">STT</th><th>Tiêu đề bài viết</th><th style="width:75px;">Trạng thái</th></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="toast" id="toastMsg">✓ Đã sao chép!</div>
  <div class="lightbox" id="lightbox" onclick="this.style.display='none'"><img id="lightboxImg" src=""></div>

i","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1elg7QywVIZsMTOFyKmLI5yLv3eCCBkBb/view?usp=drivesdk","youtubeTitle":"Con Gái Là Phước Báu Lớn Nhất Đời Người: Tài Sản Vô Giá Không Phải Tiền Bạc","youtubeDesc":"Tài sản lớn nhất đời người không nằm ở sổ đỏ hay xe sang, mà chính là cô con gái nhỏ - nguồn linh khí và sự bình an của cả gia đình. Video này là lời nhắc nhở về giá trị của tình thân và niềm hạnh phúc khi có một \"chiếc áo bông nhỏ\" bên cạnh. Dù giàu hay nghèo, chỉ cần có con, bạn đã là người giàu có nhất thế gian. Hãy cùng Truong Chia Se trân trọng món quà tuyệt vời này.\n\n#TruongChiaSe","tiktok":"Bạn có biết ai mới là \"thần tài\" thực sự mang lại linh khí và may mắn cho gia đình mình không? Không phải xe sang hay nhà lầu đâu. Xem hết video này để thấy mình đang giàu có đến nhường nào nhé!\n\n#TruongChiaSe","facebook":"Con gái là linh khí và phước báu lớn nhất đời người. Bạn đã nhận ra kho báu này chưa?\n\n#TruongChiaSe #congai #giadinh #phuocbau #hanhphuc","zalo":"Có con gái chính là có được phước báu và sự bình an lớn nhất trong đời. Chúc cho những \"thiên thần nhỏ\" luôn mạnh khỏe, tỏa sáng và là niềm tự hào của gia đình. Gửi lời chúc này đến những người bạn đang có con gái nhé!\n\n#TruongChiaSe","instagram":"Con gái là linh khí, là bình an, là món quà tuyệt vời nhất của tạo hóa. ✨💖\n\n#TruongChiaSe #daughter #family #love #peace","pinnedComment":"Trong nhà bạn có một \"ngôi sao may mắn\" như vậy không? Hãy chia sẻ khoảnh khắc đáng yêu của con gái dưới đây nhé! Đừng quên ghé giỏ hàng chọn những món quà xinh xắn dành tặng công chúa nhỏ của mình tại đây.","affiliateSuggestions":"Váy công chúa cho bé gái\nSách Nuôi dạy con gái\nBộ đồ chơi nấu ăn cho bé\nKẹp tóc nơ xinh xắn cho bé\nĐèn ngủ trang trí phòng bé","productLink":""},{"stt":3,"category":"Trường Chia Sẻ","title":"Video 3","status":"Đã đăng","videoUrl":"https://drive.google.com/file/d/17U7n7VBk2dPUna1Q9LQSiu6-CQDeLWVj/view?usp=drivesdk","youtubeTitle":"Đàn Ông Nhất Định Phải N  Của Thể Diện: Đừng Để Bản Thân Là Gánh Nặng | Trương Chia Sẻ","youtubeDesc":"Sống một đời thanh sạch, ra đi một cách nhẹ lòng. Video này là lời tâm sự sâu sắc về sự lựa chọn cuối đời - không phải vì hết hy vọng, mà vì tình yêu thương vô điều kiện dành cho gia đình. Đừng cứu chữa bằng mọi giá nếu điều đó làm kiệt quệ người ở lại. Hãy cùng thấu hiểu và trân trọng giá trị của sự tự tôn cuối cùng qua thông điệp ý nghĩa này.\n\n#TruongChiaSe #BaiHocCuocDoi","tiktok":"Bạn có bao giờ tự hỏi, giới hạn cuối cùng của sự thể diện là gì không? Nếu một ngày tôi ngã xuống, đây là 3 điều tôi mong người thân hãy thực hiện để tôi được rời đi trong thanh thản. Đừng để yêu thương trở thành gánh nặng đau đớn. Hãy xem hết video này để thấu hiểu về sự tự tôn cuối cùng của một kiếp người.\n\n#TruongChiaSe","facebook":"Sống trọn vẹn, ra đi thanh thản. Đừng để bản thân trở thành gánh nặng cho người mình yêu thương nhất.\n\n#TruongChiaSe #DaoLy #NhanSinh #BaiHocCuocDoi #GiaDinh","zalo":"Gửi bạn, đôi khi buông tay đúng lúc lại là cách thể hiện tình yêu cao cả nhất. Sống không làm phiền lòng cha mẹ, đi không làm khổ con cháu. Mong chúng ta đều có một hành trình trọn vẹn, an yên và luôn giữ được sự thanh thản trong tâm hồn.\n\n#TruongChiaSe","instagram":"Đến thanh sạch, đi thanh thản. Sự tử tế cuối cùng là không để người ở lại phải gánh vác gánh nặng quá lớn. 🕊️\n.\n\n#TruongChiaSe #Mindfulness #LifeLessons #Peace #Philosophy","pinnedComment":"Nếu là bạn, bạn sẽ chọn cố gắng bằng mọi giá hay chọn sự thanh thản như trong video? Hãy chia sẻ góc nhìn của bạn nhé! Nếu bạn đang tìm kiếm sự bình an trong tâm hồn, mời bạn tham khảo các sản phẩm ý nghĩa tại link bio/giỏ hàng của mình nhé. 👇","affiliateSuggestions":"Sách Khi Hơi Thở Hóa Thinh Không - Paul Kalanithi\nSách Muôn Kiếp Nhân Sinh - Nguyên Phong\nSách Tìm Lại Chính Mình - Thích Thánh Nghiêm\nMáy Đo Huyết Áp Điện Tử Omron\nThực Phẩm Bảo Vệ Sức Khỏe Tăng Cường Đề Kháng","productLink":""},{"stt":5,"category":"Trường Chia Sẻ","title":"Video 5","status":"Đã đăng","videoUrl":"https://drive.google.com/file/d/1ndtatz-Jj278RbbC_zsrUeiCAO7Eyv0o/view?usp=drivesdk","youtubeTitle":"Sự Thật Đau Lòng Về Áp Lực Của Đàn Ông Và Phụ Nữ | Trương Chia Sẻ","youtubeDesc":"Phụ nữ khổ ai cũng thấy, đàn ông khổ chỉ mình họ hay. Video này chia sẻ về góc khuất trong cuộc sống và cách chúng ta nhìn nhận giá trị của mỗi người qua lăng kính vật chất. Bài học sâu sắc về sự thấu hiểu và lòng bao dung trong cuộc sống.\n\n#TruongChiaSe #baihoccuocdoi #giatrisong","tiktok":"Tại sao xã hội lại khắc nghiệt với đàn ông đến vậy? Một ly trà sữa 50k xếp hàng toàn phụ nữ, nhưng cơm hộp 30k lại chỉ thấy đàn ông. Sự thật trần trụi về nỗi khổ của phái mạnh sẽ khiến bạn phải suy ngẫm lại. Xem hết video này để thấu hiểu nỗi lòng chưa bao giờ kể.\n\n#TruongChiaSe #baihoccuocdoi #danong #tamly #xahoi","facebook":"Đàn ông khổ ở túi tiền, phụ nữ khổ ở cái nhìn. Sự thật phũ phàng bạn cần biết.\n\n#TruongChiaSe #danong #phunu #trietly #cuocsong","zalo":"Đời người ai cũng có nỗi niềm riêng. Đàn ông hay phụ nữ đều cần được thấu hiểu thay vì phán xét qua vẻ ngoài hay túi tiền. Gửi đến bạn chút suy ngẫm để chúng ta sống bao dung và trân trọng nhau hơn. Chúc bạn một ngày bình yên!\n\n#TruongChiaSe","instagram":"Thế giới nhìn vào sự vất vả của phụ nữ, nhưng lại chỉ nhìn vào cái túi của đàn ông. Hãy học cách trân trọng những nỗ lực thầm lặng. ✨\n\n#TruongChiaSe #deepquotes #lifequotes #danong #phunu","pinnedComment":"Giữa cơm hộp 30k và trà sữa 50k, bạn chọn sự ổn định hay niềm vui tức thời? Hãy chia sẻ quan điểm của bạn bên dưới nhé! Đừng quên ghé link bio để tìm thấy những công cụ giúp bạn cân bằng cuộc sống tốt hơn. 👇","affiliateSuggestions":"Ví da nam cao cấp khóa số\nHộp cơm giữ nhiệt văn phòng 3 tầng\nSách Đàn Ông Sao Hỏa Đàn Bà Sao Kim\nBình giữ nhiệt Inox 304 cao cấp\nSách Đọc Vị Bất Kỳ Ai","productLink":""},{"stt":6,"category":"Trường Chia Sẻ","title":"Video 6","status":"Đã đăng","videoUrl":"https://drive.google.com/file/d/1vfpPbfAapWTfgAP6yrDMZV_Nv6sGgShd/view?usp=drivesdk","youtubeTitle":"Bí Quyết Để Không Bao Giờ Rỗng Túi: Kiếm Tiền Là Gốc, Tiết Kiệm Là Nền | Truong Chia Se","youtubeDesc":"Hôm nay bạn có tiền, không có nghĩa là ngày mai cũng vậy. Video này chia sẻ triết lý sâu sắc về sự cân bằng giữa việc kiếm tiền và tích lũy. Đừng để đến lúc cần mới hối hận vì đã tiêu xài hoang phí lúc trẻ. Siêng năng là cây sinh tiền, tiết kiệm là kho tích của cải. Hãy cùng Truong Chia Se chiêm nghiệm bài học để tự chủ tài chính và bớt phải dựa dẫm vào người khác khi về già.\n\n#TruongChiaSe","tiktok":"Bạn kiếm được nhiều tiền, nhưng tại sao túi vẫn rỗng? Sự thật là: Kiếm tiền chỉ là gốc, tiết kiệm mới thực sự là nền tảng của sự giàu có. Đừng để hôm nay rủng rỉnh mà ngày mai phải đi vay mượn. Xem hết video này để biết cách giữ đôi tay luôn vững vàng trước sóng gió tài chính!\n\n#TruongChiaSe","facebook":"Kiếm tiền giỏi, giữ tiền chắc mới là bản lĩnh thực sự. Đừng để túi rỗng khi giông bão kéo đến.\n\n#TruongChiaSe #TaiChinh #KiemTien #TietKiem #BaiHocCuocDoi","zalo":"Gửi bạn lời nhắn: Lúc còn trẻ và còn sức, hãy tranh thủ tích lũy thêm một chút. Kiếm được tiền đã khó, giữ được tiền còn khó hơn. Mong chúng ta đều có một tương lai vững vàng, tâm an yên vì không phải nhìn sắc mặt người khác mà sống. Chúc bạn luôn bình an!\n\n#TruongChiaSe","instagram":"Kiếm tiền là bản năng, giữ tiền là bản lĩnh. Hai tay đều vững, đời mới an yên. ✨\n.\n\n#TruongChiaSe #Mindset #Finance #Lifestyle #Growth","pinnedComment":"Theo bạn, giữa kiếm tiền và tiết kiệm, điều nào khó thực hiện nhất ở thời điểm hiện tại? Chia sẻ quan điểm của bạn phía dưới nhé! Ngoài ra, bạn có thể tham khảo các công cụ quản lý tài chính thông minh tại link bio để bắt đầu tích lũy ngay hôm nay. 👇","affiliateSuggestions":"Sách Tâm lý học về tiền - Morgan Housel\nSổ tay quản lý tài chính cá nhân Kakeibo\nVí da cao cấp có ngăn phân loại tài chính\nSách Người giàu có nhất thành Babylon\nỐng heo tiết kiệm gốm sứ có bảng mục tiêu","productLink":""},{"stt":7,"category":"Trường Chia Sẻ","title":"Video 7","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1vZqZ4qmwhZXs3zDM3q0MBf2tvepWHOmd/view?usp=drivesdk","youtubeTitle":"May mắn 3 đời mới cưới được người vợ thế này: Đàn ông có biết mình đang sở hữu báu vật?","youtubeDesc":"Trong cuộc sống hối hả, chúng ta thường mải mê tìm kiếm những giá trị xa hoa mà quên mất rằng hạnh phúc thật sự nằm ở sự giản đơn. Một người vợ biết lo toan, không tệ nạn và thấu hiểu chính là phúc phận lớn nhất của người đàn ông. Hãy cùng Truong Chia Se chiêm nghiệm bài học về sự trân trọng này.\n\n#TruongChiaSe #GiaDinh #HanhPhuc","tiktok":"Bạn có biết 99% đàn ông đang khao khát điều gì không? Không phải tiền bạc, mà là một người phụ nữ như thế này. Xem hết video để biết bạn có đang sở hữu 'báu vật' mà bao người mơ ước không nhé!\n\n#TruongChiaSe #BaiHocCuocDoi #HonNhan #PhatTrienBanThan","facebook":"Gặp được người vợ thế này là phúc ba đời, đàn ông nhớ trân trọng nhé!\n\n#TruongChiaSe #HonNhan #GiaDinh #PhuNu #DaoLy","zalo":"Gửi những người đàn ông: Sự giàu có lớn nhất đời người không nằm ở ví tiền, mà ở người phụ nữ đồng hành cùng mình. Nếu cô ấy giản đơn, chân thành và yêu gia đình, hãy dành cho cô ấy sự trân trọng tuyệt đối nhé. Chúc gia đình bạn luôn ấm áp!\n\n#TruongChiaSe","instagram":"Bình yên là khi trở về nhà có một người thấu hiểu chờ đợi. Trân trọng những giá trị giản đơn nhưng bền vững. ✨\n\n#TruongChiaSe #SimpleLife #Love #Healing #FamilyTime","pinnedComment":"Vợ của bạn có những 'đặc điểm' tuyệt vời này không? Hãy cùng chia sẻ câu chuyện của bạn nhé! Đừng quên ghé giỏ hàng/link bio để chọn những món quà ý nghĩa vun vén thêm hạnh phúc cho tổ ấm của mình nha! 👇","affiliateSuggestions":"Sách Khéo Ăn Nói Sẽ Có Được Thiên Hạ\nMáy xông tinh dầu giúp thư giãn nhà cửa\nBộ nồi inox cao cấp cho căn bếp gia đình\nĐèn ngủ ánh sáng ấm tạo không gian thư giãn\nTạp dề phong cách tối giản cho người nội trợ","productLink":""},{"stt":8,"category":"Trường Chia Sẻ","title":"Video 8","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1Cdmkpb8U-kxr7JdUBZ_8bGKaA-Pfu19R/view?usp=drivesdk","youtubeTitle":"Thà Vất Vả Kiếm Tiền Còn Hơn Để Người Đời Xem Thường | Bài Học Triệu Đô","youtubeDesc":"Trong cuộc đời này, mái hiên của người khác dù lớn đến đâu cũng không bằng tự mình có một chiếc ô. Muốn đứng trước người đời trong sự vẻ vang, trước hết phải chịu khổ sau lưng họ. Video này sẽ giúp bạn thức tỉnh về giá trị của sự tự lập và nỗ lực. Đừng quên Đăng ký kênh để nhận thêm nhiều bài học giá trị.\n\n#TruongChiaSe #baihoccuocdoi #trietlý","tiktok":"Bạn có biết, ngay cả người thân nhất cũng có thể coi thường bạn nếu bạn tay trắng? Đừng để bản thân gục ngã trong nghèo khó. Mái hiên người khác dù to cũng không bằng chiếc ô tự mình cầm. Xem hết video để thấu hiểu cái giá của sự vẻ vang và thay đổi tư duy ngay hôm nay!\n\n#TruongChiaSe","facebook":"Đừng đợi đến khi bị coi thường mới lo làm giàu. Tự mình cầm ô mới là vững chãi nhất.\n\n#TruongChiaSe #baihoccuocdoi #dongluc #kiemtien #phattrien","zalo":"Gửi bạn tâm niệm này: Đôi khi cuộc đời ép ta phải nỗ lực đến kiệt cùng, nhưng hãy nhớ, tự mình làm chỗ dựa cho chính mình mới là sự bảo đảm bền vững nhất. Chúc bạn luôn kiên cường để gặt hái thành quả xứng đáng nhé!\n\n#TruongChiaSe","instagram":"Tự mình cầm ô, tự mình vững bước. Vẻ vang nào cũng bắt đầu từ gian khổ. 🕊️✨\n\n#TruongChiaSe #phongcachsong #dongluc #phattrienbanthan #growth","pinnedComment":"Bạn chọn chịu khổ lúc này để thành công về sau, hay chọn sự an phận để rồi bị xem thường? Hãy chia sẻ quan điểm của bạn nhé! Tham khảo những công cụ giúp bạn nâng tầm bản thân tại link Bio/Giỏ hàng của mình nhé! 👇","affiliateSuggestions":"Sách Cha Giàu Cha Nghèo - Robert Kiyosaki\nSách Thay Đổi Tư Duy Thay Đổi Vận Mệnh\nSổ tay lập kế hoạch hành động Daily Planner\nSách Đắc Nhân Tâm\nSách Khéo Ăn Nói Sẽ Có Được Thiên Hạ","productLink":""},{"stt":9,"category":"Trường Chia Sẻ","title":"Video 9","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1ndpJmfg26cTcSJ75PBxFzKTFXmHOAn4M/view?usp=drivesdk","youtubeTitle":"10 Quy Tắc Vàng Của Cổ Nhân: Trí Tuệ Ngàn Đời Để Có Đời Bình An | Truong Chia Se","youtubeDesc":"Trí tuệ của cha ông để lại qua những câu nói ngắn gọn nhưng chứa đựng bài học sâu sắc về cách sống, cách đối nhân xử thế và giữ gìn sức khỏe. Từ chuyện chọn vợ gả chồng đến thói quen sinh hoạt hằng ngày, tất cả đều là kim chỉ nam giúp chúng ta sống thuận tự nhiên, tránh xa tai ương. Hãy cùng Truong Chia Se chiêm nghiệm và áp dụng vào cuộc sống hiện đại nhé.\n\n#TruongChiaSe","tiktok":"Tại sao nửa đêm tuyệt đối không được phơi quần áo hay thổi còi? Những quy tắc ngầm từ thời ông bà ta để lại không chỉ là tâm linh mà còn là trí tuệ sống. Xem hết video này để tránh rước họa vào thân bạn nhé!\n\n#TruongChiaSe","facebook":"Cổ nhân dạy không bao giờ thừa, ngẫm lại thấy đúng đến lạ kỳ. Đừng bỏ lỡ!\n\n#TruongChiaSe #DaoLy #NhanSinh #BaiHoc #SongDep","zalo":"Gửi cả nhà mình những lời dạy quý báu của cha ông. Mong mọi người luôn giữ gìn sức khỏe, sống tỉnh thức và bình an mỗi ngày. Những điều này rất thiết thực, cả nhà cùng xem nhé!\n\n#TruongChiaSe","instagram":"Trí tuệ tiền nhân, kim chỉ nam cho hậu thế. Sống chậm lại để thấu hiểu và bình yên. ✨\n\n#TruongChiaSe #Wisdom #LifeLessons #Tradition #Mindfulness","pinnedComment":"Trong những lời dạy trên, bạn thấy điều nào đúng nhất với cuộc sống hiện nay? Hãy cùng thảo luận bên dưới nhé! Mình có để sẵn một số món đồ chăm sóc sức khỏe và sách hay tại link bio/giỏ hàng, mời cả nhà ghé xem nha! 👇","affiliateSuggestions":"Sách Cổ Học Tinh Hoa\nTrà thảo mộc an thần\nMáy sấy quần áo khử khuẩn\nTinh dầu gừng giữ ấm cơ thể\nSách Hiểu Về Trái Tim","productLink":""},{"stt":10,"category":"Trường Chia Sẻ","title":"Video 10","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1It5CCeBza4tEnZK0Ce36jw7uttxOIXxX/view?usp=drivesdk","youtubeTitle":"Sự Thật Phũ Phàng Về Sự Hoàn Hảo Của Phụ Nữ | Trương Chia Sẻ","youtubeDesc":"Cuộc đời vốn dĩ không cho ai tất cả. Nếu bạn gặp một người hội tụ mọi ưu điểm một cách quá mức, hãy cẩn trọng vì đó có thể là một kịch bản tinh vi. Video này chia sẻ góc nhìn thực tế về quy luật bù trừ ở đời. Bài học: Đừng để vẻ ngoài hoàn mỹ đánh lừa lý trí.\n\n#TruongChiaSe","tiktok":"Bạn đang tìm kiếm một người phụ nữ 'mười phân vẹn mười'? Hãy dừng lại ngay nếu không muốn rơi vào bẫy! Thế gian luôn có sự bù trừ, cái gì quá hoàn hảo thường ẩn chứa sự thật khó lường. Xem hết video này để tỉnh táo hơn trong các mối quan hệ nhé!\n\n#TruongChiaSe","facebook":"Đừng mơ về một cô gái hoàn hảo nếu chưa biết quy luật bù trừ này.\n\n#TruongChiaSe #DaoLy #PhuNu #BaiHoc #TamLy","zalo":"Gửi bạn, đừng quá mải mê theo đuổi những gì hoàn mỹ một cách cực đoan. Hãy học cách trân trọng cả những khiếm khuyết, vì đó mới là nét thực tế của con người. Chúc bạn luôn tỉnh táo và bình an trong mọi lựa chọn.\n\n#TruongChiaSe","instagram":"Thế gian vốn không có sự hoàn hảo tuyệt đối. Mọi món quà của tạo hóa đều có cái giá của nó. ✨\n\n#TruongChiaSe #LifeLessons #Mindset #Woman #DeepThoughts","pinnedComment":"Bạn đã bao giờ gặp một ai đó 'quá hoàn hảo' chưa? Chia sẻ trải nghiệm của bạn ở dưới nhé! Đừng quên ghé link bio hoặc giỏ hàng để chọn những cuốn sách giúp bạn thấu hiểu tâm lý và lòng người hơn nhé 👇","affiliateSuggestions":"Sách Đọc Vị Bất Kỳ Ai\nSách Tâm Lý Học Tội Phạm\nSách Khéo Ăn Nói Sẽ Có Được Thiên Hạ\nSách Hiểu Về Trái Tim\nSách Phi Lý Trí","productLink":""},{"stt":11,"category":"Trường Chia Sẻ","title":"Video 11","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1hweFuLpIzGcIxNnRCaovuA68aWPspMz6/view?usp=drivesdk","youtubeTitle":"3 Thứ Tuyệt Đối Đừng Tham Nếu Muốn Trở Thành Người Khôn Ngoan Nhất | Bài Học Cuộc Đời","youtubeDesc":"Người khôn ngoan không phải người có tất cả, mà là người biết buông bỏ đúng lúc. Video này sẽ chỉ ra 3 cạm bẫy về cờ bạc, các mối quan hệ xã giao và sắc dục - những thứ dễ dàng kéo bạn xuống vực thẳm nếu không giữ được mình. Hãy cùng nghiền ngẫm bài học từ cuốn sách thay đổi tư duy để làm ó đang \"kết hôn\" với chiếc điện thoại của mình không? 📱 Sáng nhìn, tối nhìn, đi đâu cũng có nhau. Xem hết video này để thấy hình ảnh của chính mình và thức tỉnh trước khi quá muộn nhé!\n\n#TruongChiaSe","facebook":"\"Vợ chồng\" thực sự của bạn là ai? 📱 Đừng để vật vô tri chi phối cuộc đời.\n\n#TruongChiaSe #BaiHoc #SongCham #ThoiQuen #DienThoai","zalo":"Đừng để chiếc điện thoại ngăn cách chúng ta với những người thân yêu thực sự. Hãy dành thời gian cho nhau nhiều hơn là nhìn vào màn hình, bạn nhé. Gửi lời chúc bình an đến cả nhà!\n\n#TruongChiaSe","instagram":"Sự lệ thuộc đôi khi lại được gắn mác là gắn kết. Bạn chọn công nghệ hay chọn cuộc sống thật? ✨📱\n\n#TruongChiaSe #Mindfulness #SongTinhThuc #DigitalDetox #NhanSinh","pinnedComment":"Một ngày bạn thiếu điện thoại trong bao lâu thì thấy 'khổ'? Hãy comment chia sẻ cùng mình nhé! 👇 Để cai nghiện điện thoại và sống hiệu quả hơn, bạn có thể tham khảo các công cụ hỗ trợ ở giỏ hàng/link bio nha.","affiliateSuggestions":"Sách Kỷ Luật Tự Giác\nSách Deep Work - Làm Ra Làm Chơi Ra Chơi\nHộp khóa điện thoại hẹn giờ\nSách Sống Tối Giản Cho Đời Thanh Thản\nGiá đỡ điện thoại bằng gỗ decor","productLink":""},{"stt":13,"category":"Trường Chia Sẻ","title":"Video 13","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1fHZbi77rWQI0yoL5v7yr6WHVLDcRxKAo/view?usp=drivesdk","youtubeTitle":"Đời Người Chỉ Đến Một Lần: Đừng Đợi Đến Già Mới Biết Trân Trọng | Bài Học Nhân Sinh Sâu Sắc","youtubeDesc":"Chúng ta thường mải mê chạy theo tiền bạc, thể diện và những mối quan hệ xã giao mà quên mất rằng sự sống là hữu hạn. Video này là lời nhắc nhở chân thành về giá trị của thời gian và hơi thở. Hãy học cách buông bỏ muộn phiền để sống một cuộc đời ý nghĩa nhất. Đăng ký kênh 'Truong Chia Se' để cùng chiêm nghiệm những bài học cuộc đời.\n\n#TruongChiaSe","tiktok":"Bạn có chắc mình còn nhiều thời gian không? Có người 30, có người 50 đã phải dừng lại. Thế giới này ta chỉ đến một lần, đừng để áp lực và tiền bạc cướp mất niềm vui. Xem hết video này để biết điều gì mới thực sự quan trọng nhất cuộc đời bạn nhé!\n\n#TruongChiaSe","facebook":"Đừng đợi đến già mới thấy đời ngắn ngủi. Trân trọng từng phút giây hiện tại bạn nhé!\n\n#TruongChiaSe #songvui #daoly #baihoc #songtronven","zalo":"Gửi bạn lời nhắn nhủ chân tình: Cuộc đời vốn vô thường, có những người ra đi khi còn rất trẻ. Đừng để áp lực hay những chuyện không vui lấp đầy tâm trí. Hãy trân trọng bản thân, yêu thương người thân và sống thật hạnh phúc mỗi ngày bạn nhé!\n\n#TruongChiaSe","instagram":"Thế giới này, ta chỉ ghé thăm duy nhất một lần. Hãy để mỗi ngày trôi qua đều là một món quà vô giá. ✨\n\n#TruongChiaSe #songcham #binhan #mindfulness #songtronven","pinnedComment":"Nếu ngày mai là ngày cuối cùng, bạn có hối tiếc điều gì chưa kịp làm không? Hãy chia sẻ bên dưới để cùng trân trọng nhau hơn nhé. Mình có để vài món quà tinh thần giúp bạn sống bình an hơn ở link bio/giỏ hàng, mời bạn tham khảo!","affiliateSuggestions":"Sách Muôn Kiếp Nhân Sinh - Nguyên Phong\nSách Hiểu Về Trái Tim - Thích Minh Niệm\nMáy xông tinh dầu phun sương tạo ẩm\nTrà thảo mộc ngũ cốc tâm an\nThảm tập Yoga định tuyến cao cấp","productLink":""},{"stt":14,"category":"Trường Chia Sẻ","title":"Video 14","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1oyZoMRpRD-rg8p4NLmUdzrXVQobz8ARY/view?usp=drivesdk","youtubeTitle":"Lời Cha Dặn Con Gái Về Việc Sống Thử: Bài Học Thức Tỉnh Mọi Cô Gái | Trương Chia Sẻ","youtubeDesc":"Sống thử trước hôn nhân: Được hay mất? Video này là lời tâm sự đầy xót xa nhưng vô cùng thực tế của một người cha dành cho con gái trước ngưỡng cửa tình yêu. Hãy hiểu rằng sự tự trọng và làm đúng thời điểm mới là chìa khóa của hạnh phúc bền vững. Cuốn sách '38 Lá Thư Rockefeller' chính là hành trang quý giá giúp các con trưởng thành và bản lĩnh hơn trong cuộc đời. Xem ngay để không bỏ lỡ những bài học nhân sinh sâu sắc.\n\n#TruongChiaSe","tiktok":"Đừng dại mà dọn về sống chung khi chưa cưới nếu bạn chưa nghe 3 cái kết đắng này từ người cha. Con gái nhất định phải xem hết video để biết cách bảo vệ giá trị bản thân và không phải hối hận về sau nhé!\n\n#TruongChiaSe","facebook":"Con gái đòi sống thử và lời dạy thấu tình đạt lý của người cha khiến ai cũng thức tỉnh. Đừng để thanh xuân là sự chờ đợi vô nghĩa.\n\n#TruongChiaSe #DaoLy #SongThu #GiaDinh #PhuNu","zalo":"Gửi những người con gái đang đứng trước ngưỡng cửa tình yêu: Hãy biết tự trọng và yêu lấy mình trước khi mong người khác trân trọng. Một bài học sâu sắc từ người cha mà bất kỳ bậc phụ huynh hay người trẻ nào cũng nên nghe qua một lần để suy ngẫm.\n\n#TruongChiaSe","instagram":"Sự tự trọng là món trang sức lộng lẫy nhất của người phụ nữ. Hãy trân trọng thanh xuân và giá trị của chính mình. ✨\n\n#TruongChiaSe #GiaTriBanThan #PhuNu #FamilyFirst #SongGiaTri","pinnedComment":"Bạn nghĩ sao về quan điểm 'Sống thử để hiểu nhau' của giới trẻ hiện nay? Đồng tình hay phản đối lời dạy của người cha? Hãy để lại ý kiến của bạn bên dưới nhé! 👇 Mời bạn tham khảo cuốn sách tinh hoa được nhắc tới trong video tại link bio/giỏ hàng.","affiliateSuggestions":"38 Lá Thư Rockefeller Gửi Cho Con Trai\nVô Cùng Tàn Nhẫn Vô Cùng Yêu Thương\nDạy Con Trong Hoang Mang\nPhụ Nữ Thông Minh Không Đợi Đến Ngày Mai\nKhéo Ăn Khéo Nói Sẽ Có Được Thiên Hạ","productLink":""},{"stt":15,"category":"Trường Chia Sẻ","title":"Video 15","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1ih2ZmLGbeoqi1HmPzX6wZRPRXgEQM3lA/view?usp=drivesdk","youtubeTitle":"Đừng Để Sự Lười Biếng Đánh Cắp Tương Lai | Bài Học Đắt Giá Về Sự Nỗ Lực","youtubeDesc":"Cha mẹ cho ta mạng sống, nhưng chính ta phải tự bước đi trên đôi chân mình. Nếu chưa thể kiếm tiền lớn, hãy bắt đầu từ những việc nhỏ nhất với sự tận tâm tuyệt đối. Sự chăm chỉ hôm nay là vốn liếng cho thành công ngày mai. Đừng bao giờ nhận thua trước số phận vì cuộc đời luôn có cơ hội cho người không bỏ cuộc.\n\n#TruongChiaSe #PhatTrienBanThan #DongLuc","tiktok":"Bạn chấp nhận nghèo hay chấp nhận lười? Đừng để sự trì hoãn cướp đi tương lai của chính mình. Video này dành riêng cho những ai đang muốn lật ngược thế cờ cuộc đời và tìm lại động lực chiến đấu. Hãy xem đến giây cuối cùng để hiểu tại sao chăm chỉ là con đường duy nhất!\n\n#TruongChiaSe","facebook":"Nghèo không đáng sợ, lười biếng mới đáng lo. Đừng để bản thân bị bỏ lại phía sau chỉ vì thiếu nỗ lực.\n\n#TruongChiaSe #NỗLực #KiênTrì #ThànhCông #PhátTriển","zalo":"Gửi bạn, khó khăn chỉ là tạm thời, lười biếng mới là mãi mãi. Hãy cùng nhau nỗ lực mỗi ngày vì một tương lai tốt đẹp hơn cho chính mình và người thân nhé!\n\n#TruongChiaSe","instagram":"Đừng dừng lại khi mệt mỏi, hãy dừng lại khi đã hoàn thành. Hành trình vạn dặm bắt đầu từ những bước chân nhỏ nhất. ✨\n\n#TruongChiaSe #Motivation #Success #LifeLessons #Growth","pinnedComment":"Trong hành trình này, bạn chọn kiên trì nỗ lực hay chấp nhận lùi bước? Hãy chia sẻ góc nhìn của bạn nhé! Đừng quên ghé giỏ hàng tham khảo các bộ sách rèn luyện tư duy để nạp thêm năng lượng mỗi ngày! 👇","affiliateSuggestions":"Sách Đừng Lựa Chọn An Nhàn Khi Còn Trẻ\nSách Nghĩ Giàu Và Làm Giàu\nSách Tâm Lý Học Về Tiền\nSổ tay Planner lập kế hoạch mỗi ngày\nSách Đời Thay Đổi Khi Chúng Ta Thay Đổi","productLink":""},{"stt":16,"category":"Trường Chia Sẻ","title":"Video 16","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1Akj74I3mDlnbhQyLYDfhGFsLf3sT94SX/view?usp=drivesdk","youtubeTitle":"Khoảnh Khắc Cha Nhường Lại Gánh Vác Gia Đình Cho Con | Bài Học Trưởng Thành Sâu Sắc","youtubeDesc":"Khi những nếp nhăn hằn sâu trên gương mặt cha, cũng là lúc gánh nặng gia đình lặng lẽ chuyển sang đôi vai bạn. Cha không còn trách mắng, cha hỏi ý kiến bạn nhiều hơn - đó chính là lúc năm tháng hoàn thành sự chuyển giao. Hãy cùng  nhìn lại hành trình trưởng thành để biết rằng từ nay, bạn chính là người che mưa chắn gió cho gia đình mình.\n\n#TruongChiaSe","tiktok":"Bạn có nhận ra dạo này cha không còn trách mắng mỗi khi bạn về muộn? Sự im lặng ấy không phải là thờ ơ, mà là một sự chuyển giao thầm lặng đầy đau lòng. Xem hết video này để thấu hiểu gánh nặng mà cha đã lặng lẽ đặt lên vai bạn.\n\n#TruongChiaSe #baihoccuocdoi #giadinh #cha #truongthanh","facebook":"Khi cha thôi trách mắng, là lúc đôi vai bạn phải gánh vác cả gia đình. Đã đến lúc trưởng thành thực sự.\n\n#TruongChiaSe #cha #giadinh #truongthanh #daoly","zalo":"Gửi những người con đang mải mê với thế giới ngoài kia: Hãy một lần nhìn lại đôi vai gầy của cha. Khi cha bắt đầu hỏi ý kiến bạn thay vì ra lệnh, đó là lúc cha đã mệt rồi. Hãy vững vàng để trở thành điểm tựa mới cho gia đình nhé.\n\n#TruongChiaSe","instagram":"Sự trưởng thành của con được đo bằng dấu vết thời gian trên gương mặt cha. Đã đến lúc trở thành cây cao bóng cả che chở cho gia đình.\n\n#TruongChiaSe #family #wisdom #lifequotes #father","pinnedComment":"Khoảnh khắc nào khiến bạn nhận ra mình đã thực sự phải gánh vác gia đình thay cha? Chia sẻ câu chuyện của bạn để chúng ta cùng thấu hiểu nhé. Đừng quên ghé link bio của mình để chọn những món quà sức khỏe ý nghĩa dành tặng đấng sinh thành! #TruongChiaSe","affiliateSuggestions":"Máy massage cổ vai gáy\nSách Cha và Con - Tony Parsons\nMáy đo huyết áp điện tử Omron\nThực phẩm bảo vệ sức khỏe Glucosamine\nSữa bột cho người cao tuổi","productLink":""},{"stt":17,"category":"Trường Chia Sẻ","title":"Video 17","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1190uF5E6DRjmY4fIfgXOaz1ueQdnDsv2/view?usp=drivesdk","youtubeTitle":"Sự Thật Về Nỗi Đau Mất Người Thân: Khi Kỷ Niệm Trở Thành Vết Cắt | Truong Chia Se","youtubeDesc":"Có những sự mất mát không làm ta bật khóc ngay lập tức, nhưng lại khiến ta đau thắt lòng vào những khoảnh khắc vô tình nhất trong đời. Bài học sâu sắc về sự trân trọng những người thân yêu khi họ vẫn còn bên cạnh. Đừng để đến khi chỉ còn nhìn thấy họ qua những món đồ cũ mới thấy hối tiếc. Chúc bạn tìm thấy sự an yên qua video này.\n\n#TruongChiaSe #BaiHocCuocDoi","tiktok":"Bạn có biết điều gì đau đớn hơn cả sự chia ly không? Không phải lúc họ đi, mà là những ngày tháng dài đằng sau đó. Video này dành cho những ai đang cất giấu một bóng hình trong tim. Hãy xem hết để hiểu vì sao chúng ta cần trân trọng nhau ngay lúc này.\n\n#TruongChiaSe","facebook":"Nỗi đau không nằm ở lúc chia lìa, mà ở những lần vô tình nhớ lại. Trân trọng người bên cạnh khi còn có thể.\n\n#TruongChiaSe #NoiDu #KyNiem #GiaDinh #Life","zalo":"Gửi bạn, đừng đợi đến khi mất đi mới thấy nuối tiếc. Hãy dành thời gian quan tâm, nhắn tin hay đơn giản là ăn cùng người thân một bữa cơm ngay hôm nay. Cuộc đời vô thường, trân trọng nhau khi còn có thể bạn nhé.\n\n#TruongChiaSe","instagram":"Nỗi đau vốn dĩ không có âm thanh, nó chỉ âm thầm hiện về trong từng món đồ cũ. ✨\n\n#TruongChiaSe #Healing #LifeLessons #Memories #Family","pinnedComment":"Khoảnh khắc nào khiến bạn nhớ về người thân đã khuất nhất? Hãy chia sẻ để lòng nhẹ nhàng hơn nhé. Bạn có thể tìm thấy những sản phẩm giúp chữa lành tâm hồn ở link bio của Truong nha!","affiliateSuggestions":"Sách Tìm Mình Trong Thế Giới Hậu Chia Ly\nSách Vẫn Còn Kịp - Nhìn Lại Để Yêu Thương\nNến thơm mùi gỗ đàn hương thư giãn\nSổ tay hành trình chữa lành tâm hồn\nĐèn ngủ ánh sáng vàng ấm áp","productLink":""},{"stt":18,"category":"Trường Chia Sẻ","title":"Video 18","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1QZKP_khEHCNQRHuPz-aVKZ12oywwL-qr/view?usp=drivesdk","youtubeTitle":"Cảnh Giới Cao Nhất Của Đàn Ông Bản Lĩnh: Nghệ Thuật Từ Chối Và Làm Chủ Cuộc Đời | Truong Chia Se","youtubeDesc":"Sống ở đời, không nợ ai thì không phải cúi đầu trước ai. Video này chia sẻ những nguyên tắc vàng trong đối nhân sự thế, từ việc giữ kỷ luật bản thân, kiểm soát cơn nóng giận đến cách ứng xử khôn ngoan chốn đông người. Đừng để cảm xúc chi phối trí tuệ, hãy học cách sống thông minh hơn để kiến tạo một tương lai rạng rỡ. Đừng quên nhấn đăng ký để nhận thêm nhiều bài học giá trị mỗi ngày.\n\n#TruongChiaSe","tiktok":"Bạn có đang mất tiền và mất luôn cả mối quan hệ chỉ vì không biết cách từ chối? Đàn ông bản lĩnh không nằm ở việc ongChiaSe","instagram":"Nhân gian điên đảo, lòng người khó đoán. Giữ lấy một chút tịnh tâm giữa vạn vật đổi thay. ✨\n\n#TruongChiaSe #songcham #nhansinh #trietly #binhyen","pinnedComment":"Trong một xã hội mà đồng tiền có thể làm thay đổi mọi giá trị, theo bạn điều gì mới là bền vững nhất? Hãy để lại ý kiến của bạn nhé! 👇 Nếu bạn đang tìm kiếm sự bình an trong tâm trí, hãy tham khảo các sản phẩm tại giỏ hàng của mình.","affiliateSuggestions":"Sách Muôn Kiếp Nhân Sinh - Nguyên Phong\nSách Hiểu Về Trái Tim - Thích Minh Niệm\nMáy xông tinh dầu phun sương cao cấp\nVòng tay Trầm Hương tự nhiên\nSách Càng Kỷ Luật Càng Tự Do","productLink":""},{"stt":22,"category":"Trường Chia Sẻ","title":"Video 22","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1G_y81NIjEwS-wowvTh_vo53ySOtCtQla/view?usp=drivesdk","youtubeTitle":"Đời Người Vội Vã: Khi Hiểu Chuyện Thì Đã Không Còn Trẻ | Bài Học Nhân Sinh Sâu Sắc","youtubeDesc":"Chúng ta dành cả đời để chạy đua với thời gian, tiền bạc và trách nhiệm. Để rồi khi nhìn lại, tóc đã pha sương, sức đã cạn. Video này dành cho những ai đang mệt mỏi giữa dòng đời vạn biến, mong bạn tìm thấy chút bình yên và trân trọng hiện tại. Hãy học cách thương mình trước khi quá muộn. Đừng quên Đăng ký kênh để nhận thêm nhiều bài học giá trị.\n\n#TruongChiaSe #baihoccuocdoi","tiktok":"Có phải bạn đang thức trắng đêm vì gánh nặng cuộc đời? Chúng ta từng liều mạng để chơi, rồi lại liều mạng để làm, để rồi khi nhìn lại mới thấy mình chưa thực sự sống. Xem hết video để thức tỉnh trước khi quá muộn nhé!\n\n#TruongChiaSe","facebook":"Khi hiểu chuyện, ta đã chẳng còn trẻ. Chớp mắt đã hết một đời người.\n\n#TruongChiaSe #daoly #nhansinh #cuocsong #truongthanh","zalo":"Đời người ngắn ngủi, ngoảnh đi ngoảnh lại đã quá nửa đời. Đừng quá liều mạng vì vật chất mà quên chăm sóc bản thân và gia đình. Mong bạn mỗi sáng thức dậy đều thấy bình an và mỗi đêm về đều được giấc ngủ ngon. Chúc bạn một đời an nhiên!\n\n#TruongChiaSe","instagram":"Tuổi trẻ liều mạng eo một phần tiếc nuối, nhưng mẹ sẽ luôn vì con mà cố gắng. ✨\n\n#TruongChiaSe #motherhood #lifequotes #giadinh","pinnedComment":"Bạn chọn ở nhà cùng con hay ra ngoài bôn ba kiếm tiền? Hãy chia sẻ câu chuyện của bạn để chúng ta cùng thấu hiểu nhé. Đừng quên tham khảo các sản phẩm hỗ trợ hành trình làm mẹ bớt vất vả hơn tại giỏ hàng của mình nha! 👇","affiliateSuggestions":"Máy hút sữa điện đôi\nMáy hâm sữa tiệt trùng\nSách Nuôi con không phải là cuộc chiến\nTúi trữ sữa cảm ứng nhiệt\nNôi cũi đa năng cho bé","productLink":""},{"stt":25,"category":"Trường Chia Sẻ","title":"Video 25","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/14I4bQIW96O5HMFdkOCl3Su4wlazmnjyk/view?usp=drivesdk","youtubeTitle":"Đừng Để Lời Nói Làm Tổn Thương Con Cả Đời | Bài Học Thức Tỉnh Cho Cha Mẹ","youtubeDesc":"Nhiều người lầm tưởng mắng nhiếc là giúp con phấn đấu, nhưng thực chất đó là 'khẩu nghiệp' ghim vào xương tủy đứa trẻ. Video này chia sẻ về nghệ thuật dạy con bằng tình thương vô điều kiện và sức mạnh của ái ngữ. Hãy dừng việc so sánh và chỉ trích để thiết lập lại sợi dây tình cảm ruột thịt. Cuối video là món quà hành trang quý giá cho tương lai của con, đừng bỏ lỡ nhé!\n\n#TruongChiaSe","tiktok":"Bạn có đang vô tình 'giết chết' tâm hồn con bằng lời nói? Những lời tàn độc không tạo ra động lực, nó chỉ tạo ra tổn thương và sự oán hận. Đừng để 'giáo đa tất oán'. Hãy xem hết video này để thấu hiểu cách chuyển hóa con bằng tình thương và ái ngữ thay vì sự chỉ trích.\n\n#TruongChiaSe","facebook":"Lời mắng chửi của cha mẹ là vết sẹo đi cùng con cả đời. Đừng để tình thương biến thành oán hận.\n\n#TruongChiaSe #DayCon #ChaMe #GiaoDuc #NhanSinh","zalo":"Gửi các bậc làm cha làm mẹ: Đừng dùng lời cay nghiệt để dạy con, vì chỉ có tình thương chân thành mới có sức mạnh chuyển hóa sự vô minh. Hãy dành cho con những lời ái ngữ để tình thâm thêm bền chặt mỗi ngày nhé.\n\n#TruongChiaSe","instagram":"Lời nói có thể là liều thuốc, cũng có thể là liều độc. Chọn ái ngữ để nuôi dưỡng tâm hồn con trẻ. ✨\n\n#TruongChiaSe #Parenting #Love #Quotes #GiaoDuc #LoiHayYDep","pinnedComment":"Bạn có tin rằng tình thương sẽ chuyển hóa được sự bướng bỉnh của con không? Hãy cùng chia sẻ trải nghiệm của mình nhé! Để trang bị thêm hành trang cho con vào đời, bạn có thể tham khảo cuốn sách '38 lá thư Rockefeller' ngay tại giỏ hàng/link bio nhé! 👇","affiliateSuggestions":"Sách 38 lá thư Rockefeller gửi cho con trai\nSách Vô cùng tàn nhẫn vô cùng yêu thương\nSách Cha mẹ khéo chọn lời con trẻ sẽ thông minh\nSách Nuôi con không phải là cuộc chiến\nSách Đọc vị mọi vấn đề của trẻ","productLink":""},{"stt":26,"category":"Trường Chia Sẻ","title":"Video 26","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1U9ywhfMgCJdmxEImK82nDpKzYvv-8_Mo/view?usp=drivesdk","youtubeTitle":"Đừng Để Lời Nói Nặng Nề Làm Cha Đau Lòng | Bài Học Thấu Tận Tâm Can về Tình Phụ Tử","youtubeDesc":"Cha là người cả đời hy sinh thầm lặng, không ngại gian khổ nhưng lại sợ nhất sự vô tâm của con cái. Mỗi đồng tiền bạn tiêu đều đổi bằng mồ hôi và sức lao động của cha. Đừng dùng lời lẽ nặng nề với người đã dành cả thanh xuân để bảo bọc bạn. Hãy học cách trân trọng và thấu hiểu người đàn ông vĩ đại nhất cuộc đời mình khi còn có thể.\n\n#TruongChiaSe #BaiHocCuocDoi #TinhCha #DaoHieu","tiktok":"Bạn có biết điều gì khiến một người cha mạnh mẽ nhất cũng phải gục ngã không? Không phải gánh nặng cơm áo, mà là sự lạnh nhạt từ chính người con mình yêu thương. Video này sẽ khiến bạn phải nhìn lại cách mình đối xử với cha bấy lâu nay. Đừng để quá muộn mới nhận ra giá trị của tình thân, hãy xem hết để thấu hiểu lòng cha nhé.\n\n#TruongChiaSe","facebook":"Đừng để sự vô tâm làm cha đau lòng. Bạn có từng thấy những giọt mồ hôi lặng lẽ của cha chưa?\n\n#TruongChiaSe #Cha #GiaDinh #DaoLy #BietOn","zalo":"Gửi bạn, người đang mải mê với thế giới ngoài kia. Đừng quên ở nhà vẫn có một người cha luôn dõi theo và hy sinh tất cả vì bạn. Đôi khi chỉ một lời hỏi thăm chân thành, một câu nói tử tế cũng đủ làm ấm lòng cha sau những vất vả bộn bề. Hãy dành thời gian cho cha mẹ nhiều hơn nhé.\n\n#TruongChiaSe","instagram":"Phía sau vẻ ngoài nóng tính là cả một đời lo toan thầm lặng. Hãy tử tế với người đã dành cả đời để gánh vác thế giới cho bạn. ✨❤️\n\n#TruongChiaSe #Fatherhood #FamilyFirst #LifeLessons #Healing #TrânTrọng","pinnedComment":"Lần cuối cùng bạn ngồi lại nói chuyện tử tế hoặc quan tâm đến sức khỏe của cha là khi nào? Hãy chia sẻ câu chuyện của bạn bên dưới nhé. Đừng quên ghé giỏ hàng/link bio để chọn những món quà sức khỏe ý nghĩa gửi tặng đấng sinh thành ngay hôm nay! 👇","affiliateSuggestions":"Máy massage cổ vai gáy hồng ngoại\nThực phẩm bảo vệ sức khỏe xương khớp Glucosamine\nTrà thảo mộc túi lọc giúp ngủ ngon\nMáy đo huyết áp tự động tại nhà Omron\nSữa bột dinh dưỡng dành cho người trung niên và người già","productLink":""},{"stt":27,"category":"Trường Chia Sẻ","title":"Video 27","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1-vvNOXT_1S60CmfVjo1EDJsVw6KJVeVv/view?usp=drivesdk","youtubeTitle":"Tại Sao Cuộc Đời Không Có Cục Tẩy? Bài Học Thức Tỉnh Về Sự Trưởng Thành | Truong Chia Se","youtubeDesc":"Bạn có biết vì sao khi lớn lên, chúng ta dùng bút mực thay vì bút chì? Đó là bởi lỗi lầm ở tuổi trưởng thành không thể dùng tẩy để xóa nhòa. Mỗi chữ ký, mỗi lựa chọn đều để lại dấu tích vĩnh viễn. Video này là lời nhắn nhủ sâu sắc về trách nhiệm và sự cẩn trọng trên hành trình vào đời. Hãy cùng Truong Chia Se chiêm nghiệm bài học quý giá từ cuốn sách 38 lá thư của Rockefeller gửi cho con trai để vững vàng hơn trước sóng gió xã hội.\n\n#TruongChiaSe #TrietLySong #BaiHocCuocDoi #PhatTrienBanThan #Rockefeller","tiktok":"Tại sao càng lớn, bút chì lại được thay bằng bút mực? Bí mật đằng sau cục tẩy mòn vẹt và những cái giá đắt đỏ khi bước ra xã hội sẽ khiến bạn thức tỉnh. Đừng để đến khi đánh đổi cả nửa đời người mới nhận ra bài học này. Xem hết video để hiểu vì sao trưởng thành lại không có chỗ cho sự tùy tiện.\n\n#TruongChiaSe #BaiHocCuocDoi #PhatTrienBanThan #NuoiDayCon #ThucTinh","facebook":"Cuộc đời không có cục tẩy để sửa sai mãi mãi. Trưởng thành là khi bạn biết tự gánh vác hậu quả.\n\n#TruongChiaSe #BaiHoc #GiaoDuc #Song #PhatTrien","zalo":"Gửi bạn, người đang nỗ lực mỗi ngày. Càng lớn, chúng ta càng nhận ra sai lầm không còn dễ dàng xóa bỏ như vết bút chì thuở nhỏ. Mong bạn luôn vững tay bút trên trang giấy cuộc đời mình. Một món quà tinh thần ý nghĩa dành cho người thân chính là sự thấu hiểu về cái giá của sự trưởng thành. Chúc bạn luôn bình an và sáng suốt.\n\n#TruongChiaSe","instagram":"Đời người không có cục tẩy, chỉ có những bài học khắc cốt ghi tâm. Viết tiếp chương mới thật cẩn trọng nhé. ✨📖\n\n#TruongChiaSe #LifeLessons #Mindset #Growth #Minimalism","pinnedComment":"Bạn đã bao giờ ước mình có một 'cục tẩy' để quay lại sửa chữa một lỗi lầm trong quá khứ chưa? Chia sẻ câu chuyện của bạn bên dưới nhé! Đừng quên trang bị tư duy đúng đắn từ sớm cho mình và con trẻ qua cuốn sách được nhắc tới trong video tại giỏ hàng/link bio nha. 👇","affiliateSuggestions":"Sách 38 Lá Thư Rockefeller Gửi Cho Con Trai\nSách Đắc Nhân Tâm - Dale Carnegie\nSách Cha Giàu Cha Nghèo - Robert Kiyosaki\nSách Nghĩ Giàu Và Làm Giàu - Napoleon Hill\nSách Khéo Ăn Nói Sẽ Có Được Thiên Hạ","productLink":""},{"stt":28,"category":"Trường Chia Sẻ","title":"Video 28","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1mGasX43XR_Dy-NJRSjZ9ekwaBvBVr-nS/view?usp=drivesdk","youtubeTitle":"Muốn Giàu Phải Kinh Doanh: 3 Bí Quyết Xương Máu Để Kiếm Tiền Tỷ | Bài Học Cuộc Đời","youtubeDesc":"Bạn muốn làm chủ hay làm thuê cả đời? Video này sẽ vạch trần những sai lầm khiến bạn mãi không giàu và chia sẻ 3 chiến lược cốt lõi của người thành công: Từ cách chọn phân khúc khách hàng giàu, tư duy bắt chước mô hình hiệu quả đến việc khởi nghiệp tinh gọn với vốn thấp. Hãy nhớ: Thà làm chủ nhỏ còn hơn làm thuê lớn. Đừng bỏ lỡ bài học quý giá này tại .\n\n#TruongChiaSe","tiktok":"Bạn có biết vì sao cày cuốc cả đời vẫn chỉ đủ ăn? Bí mật nằm ở chỗ bạ
